a-kind facilities (integrated production facilities/open EU foundries) eligible for aid and fast permits under the Chips Act.", "sec": "m2-chipsact", "secTitle": "The EU Chips Act — Three Pillars"}, {"term": "Functional superpower", "def": "The EU achieving influence through true co-regulatory convergence in digital standardisation.", "sec": "m3-ttc", "secTitle": "EU-US Techno-Democratic Regulatory Alliance? (TTC)"}, {"term": "FUTURINNOV", "def": "A tech-foresight initiative to inform the EIC and link with the MFF 2028-2034 via a new Observatory for Emerging Technologies.", "sec": "m1-toolbox", "secTitle": "The Foresight Toolbox"}, {"term": "Gaia-X", "def": "A European 'LEGO cloud' infrastructure initiative cited as having disappointed.", "sec": "m2-cloud", "secTitle": "AI Vertical Use Cases — Cloud"}, {"term": "Gatekeepers", "def": "Large platforms subject to DMA obligations to ensure contestability and fairness.", "sec": "sem-sisters", "secTitle": "The DSA & DMA — the ‘Digital (not twin) Sisters’"}, {"term": "Geopolitical Commission", "def": "Lorenzani & Szapiro (2023): a point of inflection towards more assertiveness and coherence between domestic and external agendas across time horizons.", "sec": "m1-linking", "secTitle": "Linking Foresight & the New EU Industrial Strategy"}, {"term": "Global Gateway", "def": "The EU's connectivity-investment offer, rivalled by China's Belt and Road / Digital Silk Road.", "sec": "m2-chipswar", "secTitle": "Security Dimension — the ‘Chips War’"}, {"term": "Glocal eco-world", "def": "A 2050 scenario where, after failed policy responses to climate havoc, society adapts with lower material prosperity but stronger human relationships and community.", "sec": "m4-pathways", "secTitle": "From Scenarios to Policy Pathways"}, {"term": "GPAI models", "def": "General-purpose AI models; all face transparency requirements; high-impact ones presumed to pose systemic risks (notification, risk assessment, mitigation).", "sec": "m3-aiact3", "secTitle": "The AI Act — GPAI, Sandboxing & Governance"}, {"term": "Green business boom", "def": "A 2050 scenario where market + innovation decouple profits from resource use (circular economy, renewables, bio-economy).", "sec": "m4-pathways", "secTitle": "From Scenarios to Policy Pathways"}, {"term": "Horizon Europe", "def": "The EU R&I framework programme, structured in 3 pillars (Excellent Science; Global Challenges; Innovative Europe incl. the EIC).", "sec": "m2-rilifecycle", "secTitle": "The Research & Innovation Lifecycle: Capital, Knowledge, Scale"}, {"term": "Horizon scanning", "def": "Anticipating future developments by spotting 'signs of change', validating them as 'weak signals', and exploring impact in 'sense-making sessions'; output = quarterly newsletters to the College.", "sec": "m1-megatrends", "secTitle": "Megatrends & Horizon Scanning"}, {"term": "Horizontal vs vertical battle", "def": "Horizontal = between geo-blocks (US/China/EU models); vertical = governments vs tech giants.", "sec": "m3-empires", "secTitle": "Digital Empires & the Battles for Influence"}, {"term": "IKEA cloud paradox", "def": "The EU has lost the cloud market to US hyperscalers; competing head-on is unrealistic; a 'LEGO cloud' (e.g. Gaia-X) disappointed.", "sec": "m2-cloud", "secTitle": "AI Vertical Use Cases — Cloud"}, {"term": "Industrial policy trilemma", "def": "The tension between competitiveness, decarbonisation and economic security/fairness that industrial policy must manage.", "sec": null, "secTitle": null}, {"term": "Industrial-policy trilemma/quadrilemma", "def": "The tension between competitiveness, decarbonisation, economic security (trilemma) plus fairness (quadrilemma) that industrial policy must manage (Renda, 2024).", "sec": "m4-trilemma", "secTitle": "Solving the EU’s Industrial-Policy Trilemma"}, {"term": "Industry 5.0", "def": "Links industrial transformation with human-centricity, sustainability and resilience.", "sec": "m4-industry5", "secTitle": "Industry 5.0 & Society 5.0"}, {"term": "IoT", "def": "Devices with sensors/software that connect and exchange data over the internet or other networks.", "sec": "intro-glossary1", "secTitle": "Digital Glossary (I): AI, Connectivity & Computing"}, {"term": "IPCEI", "def": "Important Projects of Common European Interest — complex, lengthy (up to 3 years) state-aid vehicles; e.g. 2nd IPCEI on Microelectronics (June 2023).", "sec": "m2-stateaid", "secTitle": "Bespoke State Aid & the ‘Chips Subsidies Race’"}, {"term": "Joint Research Centre (JRC)", "def": "The Commission's science service; with the Secretariat-General it is a lead service implementing the foresight mandate and produces the foresight studies underpinning the SFRs.", "sec": "m1-orga", "secTitle": "Organisation of Foresight within the EU"}, {"term": "Machine learning / deep learning", "def": "AI algorithms that create expert systems to make predictions or classifications based on input data (encompassed within AI).", "sec": null, "secTitle": null}, {"term": "Megatrends", "def": "Large-scale, long-term driving forces observable now that could significantly influence the future across most human activities.", "sec": "m1-megatrends", "secTitle": "Megatrends & Horizon Scanning"}, {"term": "Middle technology trap", "def": "The EU's over-specialisation in mid-tech, mature sectors (e.g. automotive) instead of frontier digital/software, leaving it lagging at the technology frontier.", "sec": "m2-mtt", "secTitle": "The EU’s ‘Middle Technology Trap’"}, {"term": "Ministers of the Future", "def": "An EU Foresight Network of Member-State ministers supporting national foresight capabilities.", "sec": "m1-orga", "secTitle": "Organisation of Foresight within the EU"}, {"term": "Mobility/Transport as a Service (MaaS/TaaS)", "def": "Digital-enabled mobility models identified by the 2022 SFR to assuage green-digital trade-offs.", "sec": "m4-2022sfr", "secTitle": "2022 SFR — Tech Factors to Assuage Trade-offs"}, {"term": "NIS2 Directive", "def": "EU-wide cooperation on cybersecurity of critical infrastructure; harmonised requirements for essential and important entities; fines up to 2% of turnover.", "sec": "m2-cyber", "secTitle": "The EU Cybersecurity Acquis"}, {"term": "Normative (super)power", "def": "Influence via rules, values and standards rather than military/economic coercion.", "sec": "m3-intro", "secTitle": "Module 3 — The EU as a Digital Normative Superpower?"}, {"term": "North Star trilemma", "def": "The tension between competitiveness, decarbonisation and security that digitalisation can help assuage (underpins the 2023 SFR).", "sec": "m1-mainstreaming", "secTitle": "Mainstreaming Resilience, OSA & Sustainable Competitiveness"}, {"term": "Open banking sandbox", "def": "The UK FCA's 2016 sandbox (one of the first globally); influenced other jurisdictions alongside the EU's PSD2.", "sec": "m3-banking", "secTitle": "Example of a Regulatory Sandbox — Open Banking"}, {"term": "Open strategic autonomy (OSA)", "def": "Reducing harmful dependencies while staying outward-looking; 'as open as possible, as autonomous as necessary'; the geopolitical dimension of resilience.", "sec": "m1-commissioner", "secTitle": "The Foresight Commissioner & Open Strategic Autonomy"}, {"term": "Platform work", "def": "Labour mediated by digital platforms, raising questions about employment status, social protection and fairness.", "sec": null, "secTitle": null}, {"term": "Platform Work Directive", "def": "Adopted by the Council in October 2024; the EU is the first legislator worldwide to regulate platform work; MS have 2 years to transpose.", "sec": "m4-gig", "secTitle": "A New EU Social Contract — Gig Workers"}, {"term": "PSD2", "def": "The EU's revised Payment Services Directive, part of the open-banking experience referenced in the sandbox example.", "sec": "m3-banking", "secTitle": "Example of a Regulatory Sandbox — Open Banking"}, {"term": "Quantum (OSA test)", "def": "The next disruptive technology and a test for EU open strategic autonomy; could break current encryption; China leads, EU lags the 2030 target of 3 quantum computers.", "sec": "m2-quantum", "secTitle": "AI Vertical Use Cases — Quantum Computing"}, {"term": "Quantum computing", "def": "Uses superposition and entanglement to compute exponentially faster than classical computers.", "sec": "intro-glossary1", "secTitle": "Digital Glossary (I): AI, Connectivity & Computing"}, {"term": "R&I lifecycle (CAPITAL/KNOWLEDGE/SCALE)", "def": "The three needs of the research & innovation lifecycle the EU must connect to exit the middle technology trap.", "sec": "m2-rilifecycle", "secTitle": "The Research & Innovation Lifecycle: Capital, Knowledge, Scale"}, {"term": "Rebuttable presumption of employment", "def": "The Platform Work Directive's mechanism: workers presumed employees based on control/direction elements, unless rebutted; modalities set by each MS.", "sec": "m4-gig2", "secTitle": "Platform Work Directive — Mechanisms"}, {"term": "RegTech / SupTech", "def": "Technology for regulatory compliance (RegTech) and supervision (SupTech), used in implementation/enforcement.", "sec": "m3-tools", "secTitle": "Linking Foresight & Regulation — Agile Regulatory Tools"}, {"term": "Regulatory sandbox", "def": "A controlled testing scheme under an experimentation clause; screens applicants, evaluates results before authorisation.", "sec": "m3-tools", "secTitle": "Linking Foresight & Regulation — Agile Regulatory Tools"}, {"term": "Regulatory un-peace", "def": "The horizontal battle for influence between geo-blocks over digital governance.", "sec": "m3-empires", "secTitle": "Digital Empires & the Battles for Influence"}, {"term": "Resilience Dashboards", "def": "Tools mainstreaming resilience in the European Semester.", "sec": "m1-mainstreaming", "secTitle": "Mainstreaming Resilience, OSA & Sustainable Competitiveness"}, {"term": "Resilient EU 2030", "def": "A foresight study (Spain's 2023 Presidency, with the Commission and Member States) to reinforce the EU's OSA and global leadership.", "sec": "m1-mainstreaming", "secTitle": "Mainstreaming Resilience, OSA & Sustainable Competitiveness"}, {"term": "Scenario Building and Exploration System", "def": "A JRC online tool to simulate possible future paths on any topic.", "sec": "m1-toolbox", "secTitle": "The Foresight Toolbox"}, {"term": "Skills foresight", "def": "Anticipating skills needs across industrial ecosystems to empower workers and boost innovation.", "sec": "m4-jobs", "secTitle": "The Technology/Jobs Puzzle"}, {"term": "Society 5.0", "def": "A 'super-smart' society combining societal goals (SDGs) with new technologies.", "sec": "m4-industry5", "secTitle": "Industry 5.0 & Society 5.0"}, {"term": "Sovereign cloud / edge nodes", "def": "EU solutions (supported via public procurement) and local edge nodes that reduce hyperscaler dependence and keep data in the EU.", "sec": "m2-cloud", "secTitle": "AI Vertical Use Cases — Cloud"}, {"term": "STEP", "def": "Strategic Technologies for Europe Platform — vehicle under which support/restrictive measures for critical tech are evaluated.", "sec": "m2-econsec", "secTitle": "Economic Security Strategy — the 3 P’s"}, {"term": "Strategic foresight", "def": "A policy discipline of exploring, anticipating and shaping future developments so EU strategies are resilient and future-proof; a foresight-based political narrative informing today's decisions.", "sec": "m1-lens", "secTitle": "Foresight as a ‘Strategic Lens’"}, {"term": "Strategic Foresight Report (SFR)", "def": "Annual Commission Communication, underpinned by a JRC foresight study; proposes 'areas for action' and builds the case for future initiatives.", "sec": "m1-sfr", "secTitle": "The Strategic Foresight Report (SFR)"}, {"term": "Supercomputing (HPC)", "def": "High-performance computing using supercomputers to process complex calculations and large data volumes.", "sec": null, "secTitle": null}, {"term": "Technology/jobs puzzle", "def": "Whether the AI revolution causes job loss or job expansion; the goal is 'good jobs' in 'good sectors' via skills foresight (Renda, Balland, Bosoer 2023).", "sec": "m4-jobs", "secTitle": "The Technology/Jobs Puzzle"}, {"term": "Treaty of Paris (1951)", "def": "Founded the European Coal and Steel Community (ECSC) by six countries.", "sec": "read-shield", "secTitle": "A Shield for Europe — Reviving the European Defence Community"}, {"term": "Twin transition", "def": "The combined green and digital transition, emphasising synergies and trade-offs.", "sec": null, "secTitle": null}, {"term": "Twinning (green-digital)", "def": "The combined green and digital transition; managing synergies and trade-offs between them over time.", "sec": "m4-intro", "secTitle": "Module 4 — Dynamic Coherence of the Digital with the Green/Fair Transition"}, {"term": "Union of Skills strategy (2025)", "def": "The 2025 strategy of which skills foresight and digital skills are a part.", "sec": "m4-takeaways", "secTitle": "Module 4 — Key Takeaways"}, {"term": "Versailles Declaration (March 2022)", "def": "EU leaders called Russia's war a 'tectonic shift in European history'.", "sec": "read-shield", "secTitle": "A Shield for Europe — Reviving the European Defence Community"}, {"term": "Vertical AI use cases", "def": "Diffusion of AI and general-purpose technologies across industrial sectors of strength (e.g. Apply AI strategy).", "sec": "m2-intro", "secTitle": "Module 2 — A New EU Digital Industrial Strategy"}, {"term": "Vertical vs horizontal industrial policy", "def": "Vertical = sector/technology-targeted support; horizontal = economy-wide framework conditions. The VdL I Commission swung between them.", "sec": "m1-trio", "secTitle": "A New ‘Consistent Trio’ — the Industrial-Policy Turn"}, {"term": "VLOPs", "def": "Very Large Online Platforms — the focus of the DSA's strongest obligations.", "sec": "sem-sisters", "secTitle": "The DSA & DMA — the ‘Digital (not twin) Sisters’"}, {"term": "Von der Leyen I Commission", "def": "Identified in the course as a 'swinging moment' in EU industrial policy (vertical vs horizontal) towards competitiveness, resilience and open strategic autonomy.", "sec": "m1-trio", "secTitle": "A New ‘Consistent Trio’ — the Industrial-Policy Turn"}, {"term": "Weaponisation of interdependence", "def": "The use of supply/infrastructure dependencies (e.g. submarine cables) as leverage by third countries; a challenge to EU tech sovereignty.", "sec": "m2-cables", "secTitle": "State-of-the-Art Enablers — Submarine Cables"}], "flashcards": [{"front": "State the course's 'consistent trio'.", "back": "Strategic foresight + industrial strategy + digital policy — a new, crucial trio in EU policymaking.", "concept": "Consistent trio"}, {"front": "Weighting of the final exam, and its format?", "back": "55% of the grade; a 2-hour closed-book written exam (1–2 essays ≤1000 words = 50%; a few short questions = 50%).", "concept": "Assessment"}, {"front": "Define foresight (2020 SFR).", "back": "“The discipline of exploring, anticipating and shaping the future” — tools/methods to create a safe space for disruptive questions using collective intelligence to prepare for the future.", "concept": "Strategic foresight"}, {"front": "What does ESPAS stand for and how many institutions take part?", "back": "European Strategy and Policy Analysis System; 9 EU institutions participate.", "concept": "ESPAS"}, {"front": "How many global megatrends does the Megatrends Hub analyse?", "back": "14.", "concept": "Megatrends"}, {"front": "Horizon scanning: name the three steps and the output.", "back": "Spot 'signs of change' → validate as 'weak signals' → explore impact in 'sense-making sessions'; output = quarterly newsletters to the College.", "concept": "Horizon scanning"}, {"front": "OSA in one phrase?", "back": "'As open as possible, as autonomous as necessary' — the geopolitical dimension of resilience.", "concept": "Open strategic autonomy"}, {"front": "Across how many sensitive industrial ecosystems did the EU map excessive dependencies?", "back": "11.", "concept": "Mitigation of dependencies"}, {"front": "Chips Act: production target and entry into force?", "back": "Raise EU production share to 20% by 2030; entered into force September 2023.", "concept": "EU Chips Act"}, {"front": "Chips Fund figures?", "back": "3.3 bn EUR (Horizon Europe & Digital Europe, blended under InvestEU & EIC) to catalyse 43 bn EUR by 2030.", "concept": "EU Chips Act"}, {"front": "Chips bespoke state aid: how much of a funding gap can be covered?", "back": "Up to 100% of a proven funding gap for FOAK facilities that would otherwise not exist in Europe.", "concept": "State aid"}, {"front": "Global chip subsidy figures (US/China/Japan/EU)?", "back": "US CHIPS Act $53bn; China $150–200bn; Japan $5bn; EU ~€100bn announced.", "concept": "Chips subsidies race"}, {"front": "The Economic Security Strategy's 3 P's?", "back": "Promoting (competitiveness), Protecting (economic security), Partnering (with like-minded countries) — and Preparing?", "concept": "Economic Security Strategy"}, {"front": "The 4 high-risk areas flagged by the Economic Security Strategy?", "back": "Advanced chips, AI, quantum, biotech.", "concept": "Economic Security Strategy"}, {"front": "Three pillars of the cybersecurity acquis?", "back": "NIS2 Directive; Cybersecurity Act; Cyber Resilience Act (+ sectoral acts & cyber-diplomacy toolbox).", "concept": "Cybersecurity acquis"}, {"front": "NIS2 fines vs Cyber Resilience Act fines?", "back": "NIS2: up to 2% of turnover. CRA: up to €15mn or 2.5% of turnover (EU market access from 2027, via CE marking).", "concept": "Cybersecurity acquis"}, {"front": "Where is the EU Cybersecurity Competence Centre (ECCC)?", "back": "Bucharest.", "concept": "ECCC"}, {"front": "EuroHPC: EU supercomputers in the global top 10?", "back": "4.", "concept": "EuroHPC"}, {"front": "AI factories — how many and across how many MS? Plus Gigafactories?", "back": "19 AI factories across 16 MS; plus the first 4–5 AI Gigafactories planned.", "concept": "AI Factories"}, {"front": "Digital Decade quantum-computer target by 2030?", "back": "3 quantum computers (the EU is far from it; China leads).", "concept": "Quantum"}, {"front": "What is the 'IKEA cloud paradox' and the data-value-loss figure?", "back": "The EU lost the cloud market to US hyperscalers; head-on competition is unrealistic. EU data value loss is up to 90%.", "concept": "Cloud"}, {"front": "Define the Brussels effect.", "back": "The EU shapes global markets through regulation because firms adapt to EU rules and diffuse them beyond Europe.", "concept": "Brussels effect"}, {"front": "Bradford's three Digital Empires models?", "back": "US market-driven; China state-driven; EU rights-driven.", "concept": "Digital Empires"}, {"front": "AI Act: what is it, and its citation?", "back": "World's first horizontal AI regulation; Regulation (EU) 2024/1689; rights-based and risk-based.", "concept": "AI Act"}, {"front": "AI Act risk tiers?", "back": "8 banned (unacceptable); high-risk (conformity assessment); low-risk (transparency); minimal (minimal obligations).", "concept": "AI Act"}, {"front": "AI Act maximum fines?", "back": "Up to €35 million or 7% of total worldwide annual turnover (whichever higher).", "concept": "AI Act fines"}, {"front": "AI Pact pledges: Sep 2024 vs Jan 2026?", "back": "Over 100 (Sep 2024); over 230 (Jan 2026).", "concept": "AI Pact"}, {"front": "Digital Omnibus (2025) extended AI Act deadlines?", "back": "02/12/27 for listed high-risk AI; 02/12/28 for AI embedded in regulated products (e.g. medical devices, machinery).", "concept": "Digital Omnibus"}, {"front": "DSA vs DMA in one line each?", "back": "DSA: safer digital space, protects users' fundamental rights (esp. vs VLOPs). DMA: level playing field, obligations on gatekeepers for contestability & fairness.", "concept": "DSA/DMA"}, {"front": "Origin of EU intermediary-liability/digital-services rules?", "back": "The 2000 E-commerce Directive.", "concept": "DSA origins"}, {"front": "DSA citation?", "back": "Regulation (EU) 2022/2065.", "concept": "DSA"}, {"front": "UK open-banking sandbox: who and when?", "back": "Launched 2016 by the Financial Conduct Authority (FCA); model spread alongside the EU's PSD2.", "concept": "Open banking sandbox"}, {"front": "ICT share of global electricity vs AI emissions reduction potential?", "back": "ICT = 7%–9% of global electricity use (trade-off); AI could cut global emissions by 4% (synergy).", "concept": "Twinning by 2050"}, {"front": "JRC 2050 scenarios: the two axes?", "back": "Societal behaviour (individualistic vs collaborative) and policy mix (less vs more supportive of sustainability) — 4 scenarios.", "concept": "Twinning by 2050"}, {"front": "Name the two scenario pathways described.", "back": "'Green business boom' (market/innovation-driven) and 'Glocal eco-world' (adaptation after failed policy response).", "concept": "Scenarios"}, {"front": "AI in healthcare: project and savings?", "back": "EU-funded Exscalate used HPC to screen molecules (COVID-19 vaccines); up to 50% cost savings; cuts the ~9.1-year clinical-development time.", "concept": "AI in healthcare"}, {"front": "Digital Decade skills targets by 2030?", "back": "80% with basic digital skills and 20 million ICT specialists (EU lags both; 42-44% currently lack basic skills).", "concept": "Digital skills"}, {"front": "Gig workers 2022 vs 2025, and % self-employed?", "back": "28 mn (2022) → 43 mn (2025); 93% (26 mn) classified self-employed; ~5 mn (19%) likely misclassified.", "concept": "Gig workers"}, {"front": "Platform Work Directive: when adopted, transposition, key mechanism?", "back": "Council adopted Oct 2024; 2 years to transpose; rebuttable presumption of employment + rules on workplace algorithms.", "concept": "Platform Work Directive"}, {"front": "Industrial-policy trilemma vs quadrilemma (Renda)?", "back": "Trilemma: competitiveness, decarbonisation, economic security. Quadrilemma adds fairness.", "concept": "Trilemma"}, {"front": "Draghi Report title and year?", "back": "'The Future of European Competitiveness', September 2024.", "concept": "Draghi Report"}, {"front": "EDC: founding years and the 'two states' point?", "back": "ECSC via 1951 Treaty of Paris (6 states); EDC established 1952. Fabbrini (2025): if France and Italy approved today, the EDC would become operational.", "concept": "EDC"}, {"front": "Von der Leyen I Commission — described how?", "back": "A 'swinging moment' in EU industrial policy (vertical vs horizontal) towards competitiveness, resilience and (open) strategic autonomy.", "concept": "Industrial policy turn"}, {"front": "Competitiveness Compass: what and four aims?", "back": "A 2025 Commission framework / 'North Star' orienting Europe towards productivity, innovation, decarbonisation and security.", "concept": "Competitiveness Compass"}, {"front": "Define: <b>Consistent trio<\/b>", "back": "Foresight + industrial strategy + digital policy as a new, crucial trio in EU policymaking.", "concept": "Consistent trio"}, {"front": "Define: <b>Dynamic policy coherence<\/b>", "back": "The capacity to exploit synergies and manage trade-offs between policies over time, especially between digital, green, fair and security objectives.", "concept": "Dynamic policy coherence"}, {"front": "Define: <b>Final exam (55%)<\/b>", "back": "A 2-hour closed-book written exam: 1–2 essays (1000 words max, 50%) plus a few short questions (50%).", "concept": "Final exam (55%)"}, {"front": "Define: <b>Artificial intelligence (AI)<\/b>", "back": "The ability of a computer/robot to perform tasks of intelligent beings; combines computer science and data analytics; encompasses machine learning and deep learning.", "concept": "Artificial intelligence (AI)"}, {"front": "Define: <b>5G/6G<\/b>", "back": "Fifth-/sixth-generation wireless tech; higher frequencies than 4G; more bandwidth, lower (microsecond) latency; standardised by the ITU.", "concept": "5G/6G"}, {"front": "Define: <b>Edge computing<\/b>", "back": "Distributed architecture bringing computation/storage closer to data sources to improve response times and save bandwidth.", "concept": "Edge computing"}, {"front": "Define: <b>Quantum computing<\/b>", "back": "Uses superposition and entanglement to compute exponentially faster than classical computers.", "concept": "Quantum computing"}, {"front": "Define: <b>IoT<\/b>", "back": "Devices with sensors/software that connect and exchange data over the internet or other networks.", "concept": "IoT"}, {"front": "Define: <b>Exascale<\/b>", "back": "Supercomputer performance of at least 10^18 double-precision operations per second (exaFLOPS).", "concept": "Exascale"}, {"front": "Define: <b>Digital twins<\/b>", "back": "A digital counterpart of a real-world physical product/system/process used for simulation, testing, monitoring, maintenance.", "concept": "Digital twins"}, {"front": "Define: <b>Data Centres<\/b>", "back": "Centralized facilities concentrating IT operations for storing, processing and disseminating data; can be on-premise, cloud or edge.", "concept": "Data Centres"}, {"front": "Define: <b>Edge cloud (fog)<\/b>", "back": "Cloud computing at the network edge; reduces latency, raises availability, reduces unauthorized-access risk.", "concept": "Edge cloud (fog)"}, {"front": "Define: <b>Von der Leyen I Commission<\/b>", "back": "Identified in the course as a 'swinging moment' in EU industrial policy (vertical vs horizontal) towards competitiveness, resilience and open strategic autonomy.", "concept": "Von der Leyen I Commission"}, {"front": "Define: <b>Vertical vs horizontal industrial policy<\/b>", "back": "Vertical = sector/technology-targeted support; horizontal = economy-wide framework conditions. The VdL I Commission swung between them.", "concept": "Vertical vs horizontal industrial policy"}, {"front": "Define: <b>Competitiveness Compass<\/b>", "back": "A 2025 Commission framework, presented as a 'North Star', orienting Europe towards productivity, innovation, decarbonisation and security.", "concept": "Competitiveness Compass"}, {"front": "Define: <b>Competitiveness Coordination Tool (CCT)<\/b>", "back": "A coordination instrument presented as part of the Competitiveness Compass machinery.", "concept": "Competitiveness Coordination Tool (CCT)"}, {"front": "Define: <b>Strategic foresight<\/b>", "back": "A policy discipline of exploring, anticipating and shaping future developments so EU strategies are resilient and future-proof; a foresight-based political narrative informing today's decisions.", "concept": "Strategic foresight"}, {"front": "Define: <b>Collective intelligence<\/b>", "back": "Structured pooling of diverse expertise used in foresight to prepare for future developments/crises.", "concept": "Collective intelligence"}, {"front": "Define: <b>ESPAS<\/b>", "back": "European Strategy and Policy Analysis System — the inter-institutional foresight network in which 9 EU institutions participate.", "concept": "ESPAS"}, {"front": "Define: <b>Ministers of the Future<\/b>", "back": "An EU Foresight Network of Member-State ministers supporting national foresight capabilities.", "concept": "Ministers of the Future"}, {"front": "Define: <b>Joint Research Centre (JRC)<\/b>", "back": "The Commission's science service; with the Secretariat-General it is a lead service implementing the foresight mandate and produces the foresight studies underpinning the SFRs.", "concept": "Joint Research Centre (JRC)"}, {"front": "Define: <b>Open strategic autonomy (OSA)<\/b>", "back": "Reducing harmful dependencies while staying outward-looking; 'as open as possible, as autonomous as necessary'; the geopolitical dimension of resilience.", "concept": "Open strategic autonomy (OSA)"}, {"front": "Define: <b>FUTURINNOV<\/b>", "back": "A tech-foresight initiative to inform the EIC and link with the MFF 2028-2034 via a new Observatory for Emerging Technologies.", "concept": "FUTURINNOV"}, {"front": "Define: <b>Scenario Building and Exploration System<\/b>", "back": "A JRC online tool to simulate possible future paths on any topic.", "concept": "Scenario Building and Exploration System"}, {"front": "Define: <b>Megatrends<\/b>", "back": "Large-scale, long-term driving forces observable now that could significantly influence the future across most human activities.", "concept": "Megatrends"}, {"front": "Define: <b>Horizon scanning<\/b>", "back": "Anticipating future developments by spotting 'signs of change', validating them as 'weak signals', and exploring impact in 'sense-making sessions'; output = quarterly newsletters to the College.", "concept": "Horizon scanning"}, {"front": "Define: <b>Strategic Foresight Report (SFR)<\/b>", "back": "Annual Commission Communication, underpinned by a JRC foresight study; proposes 'areas for action' and builds the case for future initiatives.", "concept": "Strategic Foresight Report (SFR)"}, {"front": "Define: <b>North Star trilemma<\/b>", "back": "The tension between competitiveness, decarbonisation and security that digitalisation can help assuage (underpins the 2023 SFR).", "concept": "North Star trilemma"}, {"front": "Define: <b>Resilience Dashboards<\/b>", "back": "Tools mainstreaming resilience in the European Semester.", "concept": "Resilience Dashboards"}, {"front": "Define: <b>Resilient EU 2030<\/b>", "back": "A foresight study (Spain's 2023 Presidency, with the Commission and Member States) to reinforce the EU's OSA and global leadership.", "concept": "Resilient EU 2030"}, {"front": "Define: <b>Geopolitical Commission<\/b>", "back": "Lorenzani & Szapiro (2023): a point of inflection towards more assertiveness and coherence between domestic and external agendas across time horizons.", "concept": "Geopolitical Commission"}, {"front": "Define: <b>11 sensitive industrial ecosystems<\/b>", "back": "The ecosystems across which the EU mapped excessive dependencies (over-reliance on limited actors for goods, services, data, infrastructures, skills, technologies).", "concept": "11 sensitive industrial ecosystems"}, {"front": "Define: <b>Vertical AI use cases<\/b>", "back": "Diffusion of AI and general-purpose technologies across industrial sectors of strength (e.g. Apply AI strategy).", "concept": "Vertical AI use cases"}, {"front": "Define: <b>Middle technology trap<\/b>", "back": "The EU's over-specialisation in mid-tech, mature sectors (e.g. automotive) instead of frontier digital/software, leaving it lagging at the technology frontier.", "concept": "Middle technology trap"}, {"front": "Define: <b>European Innovation Scoreboard<\/b>", "back": "Annual EU benchmark of innovation performance (2024 edition cited).", "concept": "European Innovation Scoreboard"}, {"front": "Define: <b>R&I lifecycle (CAPITAL/KNOWLEDGE/SCALE)<\/b>", "back": "The three needs of the research & innovation lifecycle the EU must connect to exit the middle technology trap.", "concept": "R&I lifecycle (CAPITAL/KNOWLEDGE/SCALE)"}, {"front": "Define: <b>Horizon Europe<\/b>", "back": "The EU R&I framework programme, structured in 3 pillars (Excellent Science; Global Challenges; Innovative Europe incl. the EIC).", "concept": "Horizon Europe"}, {"front": "Define: <b>European Innovation Council (EIC)<\/b>", "back": "Part of Horizon Europe Pillar 3 (Innovative Europe), ~€10.1bn, supporting breakthrough/scale-up innovation.", "concept": "European Innovation Council (EIC)"}, {"front": "Define: <b>EU Chips Act<\/b>", "back": "EU Regulation (in force Sept 2023) to raise the EU chip production share to 20% by 2030; 3 pillars: Chips for Europe; security of supply; monitoring/crisis response.", "concept": "EU Chips Act"}, {"front": "Define: <b>European Semiconductor Board (ESB)<\/b>", "back": "Supports the Commission in strategic mapping/monitoring of chips and is consulted before priority-rated orders.", "concept": "European Semiconductor Board (ESB)"}, {"front": "Define: <b>FOAK<\/b>", "back": "First-of-a-kind facilities (integrated production facilities/open EU foundries) eligible for aid and fast permits under the Chips Act.", "concept": "FOAK"}, {"front": "Define: <b>IPCEI<\/b>", "back": "Important Projects of Common European Interest — complex, lengthy (up to 3 years) state-aid vehicles; e.g. 2nd IPCEI on Microelectronics (June 2023).", "concept": "IPCEI"}, {"front": "Define: <b>Bespoke State aid (chips)<\/b>", "back": "A case-by-case Chips Act approach allowing aid up to 100% of a proven funding gap for FOAK facilities that would otherwise not exist in Europe.", "concept": "Bespoke State aid (chips)"}, {"front": "Define: <b>Battle of narratives, offers and models<\/b>", "back": "The global contest (2023 SFR) in which EU tech sovereignty competes with third-country propaganda and alternative offers (e.g. Belt and Road).", "concept": "Battle of narratives, offers and models"}, {"front": "Define: <b>Global Gateway<\/b>", "back": "The EU's connectivity-investment offer, rivalled by China's Belt and Road / Digital Silk Road.", "concept": "Global Gateway"}, {"front": "Define: <b>Economic Security Strategy (3 P's)<\/b>", "back": "2023 risk-management approach: Promoting competitiveness, Protecting economic security, Partnering with like-minded countries (…and Preparing?).", "concept": "Economic Security Strategy (3 P's)"}, {"front": "Define: <b>4 high-risk areas<\/b>", "back": "Advanced chips, AI, quantum and biotech — flagged for immediate joint risk assessment.", "concept": "4 high-risk areas"}, {"front": "Define: <b>STEP<\/b>", "back": "Strategic Technologies for Europe Platform — vehicle under which support/restrictive measures for critical tech are evaluated.", "concept": "STEP"}, {"front": "Define: <b>Economic Security Doctrine (Dec 2025)<\/b>", "back": "Operationalises economic security via FDI screening, export-control coordination, outbound-investment screening and dual-use R&D; 6 high-risk areas tied to risk thresholds.", "concept": const KEY = "lorenzani_state_v3";
const MODTITLE = {}; DATA.modules.forEach(m=>MODTITLE[m.id]=m.title);
const SEC = {}; DATA.sections.forEach(s=>SEC[s.id]=s);

/* ---------- state ---------- */
let state = load();
function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || fresh(); }
  catch(e){ return fresh(); }
}
function fresh(){
  return { sec:{}, cards:{}, concepts:{}, last:null, exams:[] };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function secState(id){ return state.sec[id] || (state.sec[id]={read:false,best:0,attempts:0}); }
function recordConcept(concept, ok){
  if(!concept) return;
  const c = state.concepts[concept] || (state.concepts[concept]={correct:0,wrong:0});
  if(ok) c.correct++; else c.wrong++;
}

/* ---------- helpers ---------- */
const esc = s => (s==null?"":String(s));
function norm(s){ return (s||"").toLowerCase().replace(/[‘’“”]/g,"'").replace(/[^a-z0-9%]+/g," ").trim(); }
function masteryBadge(best){
  if(best>=80) return '<span class="badge ok">Mastered '+best+'%</span>';
  if(best>0)   return '<span class="badge mid">'+best+'%</span>';
  return '<span class="badge no">Not started</span>';
}

/* ---------- key-term highlighting in reading mode ---------- */
let TERMINDEX = null;
function buildTermIndex(){
  TERMINDEX = DATA.glossary.map(g=>({t:g.term, d:g.def}))
    .sort((a,b)=>b.t.length-a.t.length);
}
function highlightTerms(htmlStr){
  if(!TERMINDEX) buildTermIndex();
  // operate only on text outside existing tags
  return htmlStr.replace(/(<[^>]+>)|([^<]+)/g, (m,tag,text)=>{
    if(tag) return tag;
    let out = text;
    for(const term of TERMINDEX){
      const safe = term.t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
      const re = new RegExp("\\b("+safe+")\\b");
      if(re.test(out)){
        out = out.replace(re, '<span class="kw" title="'+term.d.replace(/"/g,"&quot;")+'" onclick="event.stopPropagation();go(\'glossary\',{q:\''+term.t.replace(/'/g,"")+'\'})">$1</span>');
      }
    }
    return out;
  });
}

/* ---------- navigation render ---------- */
function renderNav(){
  const el = document.getElementById("secnav");
  let h="";
  DATA.modules.forEach(m=>{
    const secs = DATA.sections.filter(s=>s.module===m.id);
    if(!secs.length) return;
    h+='<div class="modgroup"><div class="modtitle">'+esc(m.title)+'</div>';
    secs.forEach(s=>{
      const st=secState(s.id);
      const cls = st.best>=80?"mastered":(st.read?"read":"");
      h+='<div class="seclink" data-sec="'+s.id+'" onclick="openSection(\''+s.id+'\')">'+
         '<span class="dot '+cls+'"></span><span>'+esc(s.title)+'</span>'+
         '<span class="pct">'+(st.best?st.best+'%':'')+'</span></div>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
  highlightActiveNav();
}
function highlightActiveNav(){
  document.querySelectorAll(".seclink").forEach(n=>n.classList.toggle("active", n.dataset.sec===current.sec));
  document.querySelectorAll(".navbtns button").forEach(b=>b.classList.toggle("active", b.dataset.view===current.view));
}

/* ---------- routing ---------- */
let current = {view:"dashboard", sec:null};
function go(view, opts){
  current.view=view; current.sec=null;
  if(window.innerWidth<=880) closeNav();
  window.scrollTo(0,0);
  if(view==="dashboard") renderDashboard();
  else if(view==="flashcards") renderFlashcards();
  else if(view==="exam") renderExam();
  else if(view==="weak") renderWeak();
  else if(view==="glossary") renderGlossary(opts&&opts.q);
  highlightActiveNav();
}
function openSection(id){
  current.view="section"; current.sec=id;
  state.last=id; save();
  if(window.innerWidth<=880) closeNav();
  window.scrollTo(0,0);
  renderSection(id);
  highlightActiveNav();
}
function resumeLast(){
  if(state.last && SEC[state.last]) openSection(state.last);
  else go("dashboard");
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const secs=DATA.sections;
  const readN=secs.filter(s=>secState(s.id).read).length;
  const masteredN=secs.filter(s=>secState(s.id).best>=80).length;
  const avg=Math.round(secs.reduce((a,s)=>a+secState(s.id).best,0)/secs.length);
  const cardsDue=flashDueCount();
  let h='<h1 class="page">Course Overview Dashboard</h1>'+
    '<p class="sub">Foresight, industrial strategy and digital policies: a new ‘consistent trio’ in the EU — Prof. Dimitri Lorenzani. Master every section below to be ready for a 20/20.</p>';
  h+='<div class="kpis">'+
     '<div class="kpi"><div class="ring" style="--p:'+avg+'"><div class="inner"><b>'+avg+'%</b><span class="l">mastery</span></div></div></div>'+
     '<div class="kpi"><div class="n">'+masteredN+'/'+secs.length+'</div><div class="l">sections mastered (≥80%)</div></div>'+
     '<div class="kpi"><div class="n">'+readN+'/'+secs.length+'</div><div class="l">sections read</div></div>'+
     '<div class="kpi"><div class="n">'+cardsDue+'</div><div class="l">flashcards due now</div></div>'+
     '</div>';
  h+='<div class="row" style="margin-bottom:18px"><button class="btn primary" onclick="startFirstUnread()">▶ Continue studying</button>'+
     '<button class="btn ghost" onclick="go(\'flashcards\')">Review flashcards</button>'+
     '<button class="btn ghost" onclick="go(\'exam\')">Take final exam</button></div>';
  DATA.modules.forEach(m=>{
    const ms=DATA.sections.filter(s=>s.module===m.id); if(!ms.length) return;
    const mavg=Math.round(ms.reduce((a,s)=>a+secState(s.id).best,0)/ms.length);
    h+='<div class="card mod-card"><div class="row"><h3>'+esc(m.title)+'</h3><span class="spacer"></span><b>'+mavg+'%</b></div>'+
       '<div class="bar" style="margin:8px 0 6px"><span style="width:'+mavg+'%"></span></div>';
    ms.forEach(s=>{
      const st=secState(s.id);
      h+='<div class="dash-sec" onclick="openSection(\''+s.id+'\')"><span class="dot '+(st.best>=80?'mastered':(st.read?'read':''))+'"></span>'+
         esc(s.title)+' <span class="pct">'+masteryBadge(st.best)+'</span></div>';
    });
    h+='</div>';
  });
  document.getElementById("main").innerHTML=h;
}
function startFirstUnread(){
  const s=DATA.sections.find(s=>!secState(s.id).read)||DATA.sections[0];
  openSection(s.id);
}

/* ---------- Section (reading + quiz) ---------- */
function renderSection(id){
  const s=SEC[id]; const st=secState(id); st.read=true; save(); renderNav();
  const idx=DATA.sections.findIndex(x=>x.id===id);
  const prev=DATA.sections[idx-1], next=DATA.sections[idx+1];
  let h='<span class="modtag">'+esc(MODTITLE[s.module])+'</span>';
  h+='<div class="card"><div class="section-head"><h2>'+esc(s.title)+'</h2>'+masteryBadge(st.best)+'</div>';
  s.blocks.forEach(b=>{ h+=renderBlock(b); });
  h+='</div>';
  // quiz
  h+='<div class="card" id="quizCard"><div class="row"><h2 style="margin:0;font-size:20px">Comprehension Quiz</h2>'+
     '<span class="spacer"></span><span class="muted">'+s.quiz.length+' questions · from the exact course wording</span></div>'+
     '<p class="muted">Answer all questions, then submit for instant feedback and source passages. Score ≥80% to mark this section mastered.</p>'+
     '<div id="quizBody"></div>'+
     '<div class="row" style="margin-top:14px"><button class="btn primary" onclick="submitQuiz(\''+id+'\')">Submit quiz</button>'+
     '<button class="btn ghost" onclick="renderSectionQuiz(\''+id+'\')">Reset</button></div>'+
     '<div id="quizResult"></div></div>';
  h+='<div class="row">';
  if(prev) h+='<button class="btn ghost" onclick="openSection(\''+prev.id+'\')">← '+esc(prev.title)+'</button>';
  h+='<span class="spacer"></span>';
  if(next) h+='<button class="btn primary" onclick="openSection(\''+next.id+'\')">'+esc(next.title)+' →</button>';
  else h+='<button class="btn good" onclick="go(\'exam\')">Finish · Final Exam →</button>';
  h+='</div>';
  document.getElementById("main").innerHTML=h;
  renderSectionQuiz(id);
}
function renderBlock(b){
  if(b.k==="list"){
    let h='<div class="block text">';
    if(b.lead) h+='<div class="lead">'+highlightTerms(b.lead)+'</div>';
    h+='<ul>';
    b.items.forEach(it=>h+='<li>'+highlightTerms(it)+'</li>');
    h+='</ul></div>'; return h;
  }
  const labels={def:"Definition",ex:"Example",principle:"Key principle",warn:"Exam warning",quote:"Source quote",text:""};
  const lbl=labels[b.k]||"";
  return '<div class="block '+b.k+'">'+(lbl?'<span class="lbl">'+lbl+'</span>':'')+highlightTerms(b.t)+'</div>';
}
function renderSectionQuiz(id){
  const s=SEC[id];
  let h="";
  s.quiz.forEach((q,i)=>{ h+=renderQ(q,i,id); });
  document.getElementById("quizBody").innerHTML=h;
  document.getElementById("quizResult").innerHTML="";
}
function renderQ(q,i,sid){
  let h='<div class="q" id="'+sid+'_q'+i+'"><div class="qno">Question '+(i+1)+' · <span class="pill">'+esc(q.concept)+'</span> '+(q.type==="mcq"?"Multiple choice":"Fill in the blank")+'</div>'+
        '<div class="qtext">'+esc(q.q)+'</div>';
  if(q.type==="mcq"){
    q.options.forEach((o,oi)=>{
      h+='<button class="opt" data-oi="'+oi+'" onclick="pick(\''+sid+'\','+i+','+oi+')">'+esc(o)+'</button>';
    });
  } else {
    h+='<input class="fillin" placeholder="Type your answer…" data-blank="1" onkeydown="if(event.key===\'Enter\')event.preventDefault()"/>';
  }
  h+='<div class="feedback" id="'+sid+'_f'+i+'"></div></div>';
  return h;
}
let picks={};
function pick(sid,i,oi){
  picks[sid+"_"+i]=oi;
  const q=document.getElementById(sid+"_q"+i);
  q.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel", +b.dataset.oi===oi));
}
function submitQuiz(id){
  const s=SEC[id]; let correct=0;
  s.quiz.forEach((q,i)=>{
    const qEl=document.getElementById(id+"_q"+i);
    const fb=document.getElementById(id+"_f"+i);
    let ok=false, given="";
    if(q.type==="mcq"){
      const sel=picks[id+"_"+i];
      qEl.querySelectorAll(".opt").forEach(b=>{
        const oi=+b.dataset.oi;
        if(oi===q.answer) b.classList.add("correct");
        if(oi===sel && sel!==q.answer) b.classList.add("wrong");
      });
      ok = (sel===q.answer);
      given = (sel!=null)?q.options[sel]:"(no answer)";
    } else {
      const inp=qEl.querySelector("input");
      given=(inp.value||"").trim();
      ok=checkBlank(given, q.accept);
      inp.style.borderColor = ok?"var(--good)":"var(--bad)";
    }
    if(ok) correct++;
    recordConcept(q.concept, ok);
    fb.className="feedback show "+(ok?"ok":"no");
    let exp = ok? "✓ Correct." : "✗ Not quite. Correct answer: <b>"+esc(q.answer)+"</b>.";
    fb.innerHTML = exp + '<div class="src"><b>Source:</b> '+esc(q.source)+'</div>';
  });
  const pct=Math.round(100*correct/s.quiz.length);
  const st=secState(id); st.attempts++; if(pct>st.best) st.best=pct; save(); renderNav();
  const res=document.getElementById("quizResult");
  res.innerHTML='<div class="block '+(pct>=80?'ex':(pct>=50?'principle':'warn'))+'" style="margin-top:16px"><span class="lbl">Result</span>'+
    'You scored <b>'+correct+'/'+s.quiz.length+' ('+pct+'%)</b>. '+
    (pct>=80?'Section mastered! ✅':'Review the highlighted answers and try again to reach 80%.')+
    ' Best so far: <b>'+st.best+'%</b>.</div>';
  res.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function checkBlank(given, accept){
  const g=norm(given); if(!g) return false;
  return accept.some(a=>{ const n=norm(a); return g===n || g.replace(/\s+/g,"")===n.replace(/\s+/g,"") || (n.length>3 && g.includes(n)) || (g.length>3 && n.includes(g)); });
}

/* ---------- Flashcards (spaced repetition) ---------- */
const INTERVALS=[0,1,2,4,7,15,30]; // box -> days
function cardState(i){ return state.cards[i] || (state.cards[i]={box:0,due:0,seen:0,lapses:0}); }
function flashDueCount(){
  const now=Date.now();
  return DATA.flashcards.reduce((n,_,i)=>{ const c=state.cards[i]; return n+((!c||c.due<=now)?1:0); },0);
}
function buildQueue(){
  const now=Date.now();
  let due=[]; DATA.flashcards.forEach((_,i)=>{ const c=state.cards[i]; if(!c||c.due<=now) due.push(i); });
  // prioritize weak-concept cards
  const weak=weakConcepts().map(w=>w.concept);
  due.sort((a,b)=>{
    const wa=weak.indexOf(DATA.flashcards[a].concept), wb=weak.indexOf(DATA.flashcards[b].concept);
    const ra=wa<0?99:wa, rb=wb<0?99:wb;
    if(ra!==rb) return ra-rb;
    return (cardState(a).box)-(cardState(b).box);
  });
  return due;
}
let fq={queue:[],pos:0,flip:false};
function renderFlashcards(){
  fq.queue=buildQueue(); fq.pos=0; fq.flip=false;
  let h='<h1 class="page">Active-Recall Flashcards</h1>'+
    '<p class="sub">Spaced repetition: rate each card. <b>Again</b> re-queues it now, <b>Hard</b> shortens the interval, <b>Easy</b> pushes it further out. Weak-concept cards are shown first.</p>';
  h+='<div class="row" style="margin-bottom:8px"><span class="muted" id="flashCount"></span><span class="spacer"></span>'+
     '<button class="btn ghost" onclick="resetFlash()">Reset all scheduling</button></div>';
  h+='<div id="flashArea"></div>';
  document.getElementById("main").innerHTML=h;
  showCard();
}
function showCard(){
  const area=document.getElementById("flashArea");
  document.getElementById("flashCount").textContent =
    DATA.flashcards.length+" cards total · "+flashDueCount()+" due";
  if(!fq.queue.length){
    area.innerHTML='<div class="card"><div class="block ex"><span class="lbl">All caught up</span>No flashcards are due right now. Great spacing! Come back later, or reset scheduling to drill everything again.</div></div>';
    return;
  }
  if(fq.pos>=fq.queue.length){
    area.innerHTML='<div class="card"><div class="block ex"><span class="lbl">Session complete</span>You reviewed '+fq.queue.length+' cards. '+
      '<div class="row" style="margin-top:12px"><button class="btn primary" onclick="renderFlashcards()">Start another round</button></div></div></div>';
    return;
  }
  const i=fq.queue[fq.pos]; const c=DATA.flashcards[i];
  let h='<div class="card"><div class="muted" style="font-size:13px">Card '+(fq.pos+1)+' of '+fq.queue.length+' · <span class="pill">'+esc(c.concept)+'</span></div>'+
    '<div class="flash"><div class="flash-inner'+(fq.flip?" flip":"")+'" id="flashInner" onclick="flipCard()">'+
      '<div class="face front"><span class="tag">'+esc(c.concept)+'</span><div class="role">Question</div><div class="txt">'+esc(c.front)+'</div><div class="hint">click to reveal</div></div>'+
      '<div class="face back"><span class="tag">'+esc(c.concept)+'</span><div class="role">Answer</div><div class="txt">'+esc(c.back)+'</div><div class="hint">rate your recall below</div></div>'+
    '</div></div>';
  if(fq.flip){
    h+='<div class="row" style="margin-top:10px"><button class="btn bad" onclick="rate(0)">Again</button>'+
       '<button class="btn warn" onclick="rate(1)">Hard</button>'+
       '<button class="btn good" onclick="rate(2)">Easy</button></div>';
  } else {
    h+='<div class="row" style="margin-top:10px"><button class="btn primary" onclick="flipCard()">Show answer</button></div>';
  }
  h+='</div>';
  area.innerHTML=h;
}
function flipCard(){ fq.flip=!fq.flip; showCard(); }
function rate(grade){
  const i=fq.queue[fq.pos]; const c=cardState(i); c.seen++;
  if(grade===0){ c.box=0; c.lapses++; c.due=Date.now(); fq.queue.push(i); }       // Again
  else if(grade===1){ c.box=Math.max(1,c.box); c.due=Date.now()+INTERVALS[Math.min(c.box,INTERVALS.length-1)]*864e5; }
  else { c.box=Math.min(c.box+1,INTERVALS.length-1); c.due=Date.now()+INTERVALS[c.box]*864e5; }
  save(); fq.pos++; fq.flip=false; showCard();
}
function resetFlash(){ if(confirm("Reset spaced-repetition scheduling for all cards?")){ state.cards={}; save(); renderFlashcards(); } }

/* ---------- Weak points ---------- */
function weakConcepts(){
  const arr=Object.keys(state.concepts).map(k=>{
    const c=state.concepts[k]; const total=c.correct+c.wrong;
    return {concept:k, wrong:c.wrong, total, rate: total?c.wrong/total:0};
  }).filter(x=>x.wrong>0);
  arr.sort((a,b)=> b.wrong-a.wrong || b.rate-a.rate);
  return arr.slice(0,10);
}
function renderWeak(){
  const weak=weakConcepts();
  let h='<h1 class="page">Weak Points Tracker</h1>'+
    '<p class="sub">The 10 concepts you miss most often, ranked by number of wrong answers. These are surfaced first in flashcard sessions. Drill them, then re-test.</p>';
  if(!weak.length){
    h+='<div class="card"><div class="empty">No weak points yet — answer some quizzes and the concepts you miss will appear here automatically.</div></div>';
  } else {
    h+='<div class="card"><div class="tablewrap"><table><thead><tr><th>#</th><th>Concept</th><th>Wrong</th><th>Attempts</th><th>Error rate</th><th></th></tr></thead><tbody>';
    weak.forEach((w,i)=>{
      const sec=findSectionForConcept(w.concept);
      h+='<tr><td>'+(i+1)+'</td><td><b>'+esc(w.concept)+'</b></td><td>'+w.wrong+'</td><td>'+w.total+'</td><td>'+Math.round(w.rate*100)+'%</td>'+
         '<td>'+(sec?'<button class="btn ghost" onclick="openSection(\''+sec+'\')">Study</button>':'')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="row" style="margin-top:14px"><button class="btn primary" onclick="go(\'flashcards\')">Drill these in flashcards</button>'+
       '<button class="btn ghost" onclick="if(confirm(\'Clear weak-point history?\')){state.concepts={};save();renderWeak();}">Clear history</button></div></div>';
  }
  document.getElementById("main").innerHTML=h;
}
function findSectionForConcept(concept){
  const s=DATA.sections.find(s=>s.quiz.some(q=>q.concept===concept) || s.terms.some(t=>t.t===concept));
  return s?s.id:null;
}

/* ---------- Final Exam Simulator ---------- */
let exam=null, examTimerId=null;
function renderExam(){
  if(exam && exam.active){ renderExamRunning(); return; }
  let h='<h1 class="page">Final Exam Simulator</h1>'+
    '<p class="sub">Mimics the real exam: <b>closed-book, timed, randomised</b> questions pulled from <b>all sections</b>. 20 questions, 30 minutes. You are graded out of <b>20</b> with a per-question rubric.</p>';
  const last = state.exams[state.exams.length-1];
  h+='<div class="card"><div class="row"><div><div class="muted">Questions</div><b>20</b></div>'+
     '<div style="margin-left:24px"><div class="muted">Time limit</div><b>30:00</b></div>'+
     '<div style="margin-left:24px"><div class="muted">Pass mark</div><b>16 / 20 (80%)</b></div>'+
     '<span class="spacer"></span><button class="btn primary" onclick="startExam()">▶ Start exam</button></div>';
  if(last){
    h+='<div class="block '+(last.score>=16?'ex':'warn')+'" style="margin-top:14px"><span class="lbl">Last attempt</span>'+
       'Scored <b>'+last.score+'/20</b> ('+last.pct+'%) on '+new Date(last.when).toLocaleString()+'.</div>';
  }
  h+='</div>';
  if(state.exams.length){
    h+='<div class="card"><h3 style="margin-top:0">Attempt history</h3><div class="tablewrap"><table><thead><tr><th>#</th><th>Date</th><th>Score /20</th><th>%</th></tr></thead><tbody>';
    state.exams.slice().reverse().forEach((e,i)=>{ h+='<tr><td>'+(state.exams.length-i)+'</td><td>'+new Date(e.when).toLocaleString()+'</td><td>'+e.score+'</td><td>'+e.pct+'%</td></tr>'; });
    h+='</tbody></table></div></div>';
  }
  document.getElementById("main").innerHTML=h;
}
function allQuestions(){
  const pool=[];
  DATA.sections.forEach(s=>s.quiz.forEach(q=>pool.push(Object.assign({secId:s.id,secTitle:s.title},q))));
  return pool;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startExam(){
  const pool=shuffle(allQuestions()).slice(0,20);
  exam={active:true, qs:pool, ans:{}, t:1800, started:Date.now()};
  if(examTimerId) clearInterval(examTimerId);
  examTimerId=setInterval(()=>{ exam.t--; const el=document.getElementById("examTimer"); if(el) el.textContent=fmt(exam.t); if(exam.t<=0){ clearInterval(examTimerId); finishExam(); } },1000);
  renderExamRunning();
}
function fmt(s){ s=Math.max(0,s); return String(Math.floor(s/60)).padStart(2,'0')+":"+String(s%60).padStart(2,'0'); }
function renderExamRunning(){
  let h='<div class="card"><div class="row"><h2 style="margin:0">Final Exam — in progress</h2><span class="spacer"></span><span class="exam-timer" id="examTimer">'+fmt(exam.t)+'</span></div>'+
     '<p class="muted">Answer all 20. Closed-book — no peeking. Submit when ready (or the timer will auto-submit).</p></div>';
  exam.qs.forEach((q,i)=>{
    h+='<div class="q"><div class="qno">Q'+(i+1)+' / 20 · <span class="pill">'+esc(q.concept)+'</span></div><div class="qtext">'+esc(q.q)+'</div>';
    if(q.type==="mcq"){
      q.options.forEach((o,oi)=>{ const sel=exam.ans[i]===oi; h+='<button class="opt'+(sel?' sel':'')+'" onclick="examPick('+i+','+oi+')">'+esc(o)+'</button>'; });
    } else {
      h+='<input class="fillin" value="'+esc(exam.ans[i]||"")+'" oninput="exam.ans['+i+']=this.value" placeholder="Type your answer…"/>';
    }
    h+='</div>';
  });
  h+='<div class="row"><button class="btn primary" onclick="finishExam()">Submit exam for grading</button>'+
     '<button class="btn ghost" onclick="if(confirm(\'Abandon this exam?\')){exam.active=false;clearInterval(examTimerId);renderExam();}">Abandon</button></div>';
  document.getElementById("main").innerHTML=h;
}
function examPick(i,oi){ exam.ans[i]=oi; renderExamRunning(); }
function finishExam(){
  clearInterval(examTimerId); exam.active=false;
  let correct=0; const review=[];
  exam.qs.forEach((q,i)=>{
    let ok=false, given;
    if(q.type==="mcq"){ given=(exam.ans[i]!=null)?q.options[exam.ans[i]]:"(no answer)"; ok=(exam.ans[i]===q.answer); }
    else { given=(exam.ans[i]||"").trim()||"(no answer)"; ok=checkBlank(given,q.accept); }
    if(ok) correct++; recordConcept(q.concept, ok);
    review.push({q,given,ok});
  });
  const score=Math.round(20*correct/exam.qs.length);
  const pct=Math.round(100*correct/exam.qs.length);
  state.exams.push({when:Date.now(),score,pct,correct,total:exam.qs.length}); save(); renderNav();
  let grade = pct>=90?"Distinction":pct>=80?"Pass with merit":pct>=60?"Borderline":"Fail — keep studying";
  let h='<h1 class="page">Exam Results & 20/20 Rubric</h1>';
  h+='<div class="card"><div class="rubric"><div class="scorebig">'+score+'<span style="font-size:24px;color:var(--muted)">/20</span></div>'+
     '<div><div class="bar" style="width:240px"><span style="width:'+pct+'%"></span></div>'+
     '<div class="muted" style="margin-top:6px">'+correct+' of '+exam.qs.length+' correct · '+pct+'% · <b>'+grade+'</b></div></div>'+
     '<span class="spacer"></span><button class="btn primary" onclick="startExam()">Retake</button>'+
     '<button class="btn ghost" onclick="renderExam()">Done</button></div>';
  h+='<div class="block '+(score>=16?'ex':'warn')+'" style="margin-top:14px"><span class="lbl">Verdict</span>'+
     (score>=16?'You are exam-ready on this sample. Repeat with fresh randomised sets until 20/20 is consistent.':'Below the 16/20 target. Review the missed questions below — each links to its source — and revisit those sections.')+'</div></div>';
  h+='<div class="card"><h3 style="margin-top:0">Per-question review</h3>';
  review.forEach((r,i)=>{
    h+='<div class="qreview"><div class="row"><b>Q'+(i+1)+'.</b> <span class="pill">'+esc(r.q.concept)+'</span> '+
       (r.ok?'<span class="badge ok">Correct</span>':'<span class="badge no" style="background:var(--warnbg);color:var(--bad)">Incorrect</span>')+'</div>'+
       '<div style="margin:6px 0">'+esc(r.q.q)+'</div>'+
       '<div class="muted">Your answer: '+esc(r.given)+'</div>'+
       (r.ok?'':'<div>Correct answer: <b>'+esc(r.q.answer)+'</b></div>')+
       '<div class="src"><b>Source:</b> '+esc(r.q.source)+' <a href="#" onclick="openSection(\''+r.q.secId+'\');return false;">↗ '+esc(r.q.secTitle)+'</a></div></div>';
  });
  h+='</div>';
  document.getElementById("main").innerHTML=h; window.scrollTo(0,0);
}

/* ---------- Glossary ---------- */
function renderGlossary(query){
  let h='<h1 class="page">Word-by-Word Glossary</h1>'+
    '<p class="sub">'+DATA.glossary.length+' technical terms and proper nouns extracted from the course. Each links back to its source section.</p>'+
    '<input class="search" id="gloSearch" placeholder="Filter terms…" value="'+esc(query||"")+'" oninput="filterGlo(this.value)" style="max-width:420px"/>'+
    '<div id="gloList"></div>';
  document.getElementById("main").innerHTML=h;
  filterGlo(query||"");
  if(query){ const i=document.getElementById("gloSearch"); i.focus(); }
}
function filterGlo(q){
  const n=norm(q);
  const list=DATA.glossary.filter(g=> !n || norm(g.term).includes(n) || norm(g.def).includes(n));
  let h='<div class="card">';
  if(!list.length) h+='<div class="empty">No matching terms.</div>';
  list.forEach(g=>{
    h+='<div class="qreview"><div class="row"><b>'+esc(g.term)+'</b>'+
       (g.sec?'<span class="spacer"></span><button class="btn ghost" onclick="openSection(\''+g.sec+'\')">↗ Source</button>':'')+'</div>'+
       '<div style="margin-top:4px">'+esc(g.def)+'</div>'+
       (g.secTitle?'<div class="muted" style="font-size:12.5px;margin-top:4px">in: '+esc(g.secTitle)+'</div>':'')+'</div>';
  });
  h+='</div>';
  document.getElementById("gloList").innerHTML=h;
}

/* ---------- Global search ---------- */
function onSearch(q){
  if(!q || q.trim().length<2){ if(current.view==="search") go("dashboard"); return; }
  current.view="search";
  const n=norm(q);
  const results=[];
  DATA.sections.forEach(s=>{
    let hay=s.title+" ";
    s.blocks.forEach(b=>{ hay += (b.t||"")+" "+(b.lead||"")+" "+((b.items||[]).join(" "))+" "; });
    s.terms.forEach(t=>hay+=t.t+" "+t.d+" ");
    if(norm(hay).includes(n)){
      // find a snippet
      const plain=hay.replace(/<[^>]+>/g," ");
      const li=plain.toLowerCase().indexOf(q.toLowerCase());
      let snip = li>=0? plain.slice(Math.max(0,li-50), li+90) : plain.slice(0,140);
      results.push({id:s.id,title:s.title,mod:MODTITLE[s.module],snip});
    }
  });
  let h='<h1 class="page">Search</h1><p class="sub">'+results.length+' section'+(results.length===1?'':'s')+' match “'+esc(q)+'”.</p><div class="card">';
  if(!results.length) h+='<div class="empty">No matches in the course text.</div>';
  results.forEach(r=>{
    const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
    h+='<div class="searchres" onclick="openSection(\''+r.id+'\')"><div class="t">'+esc(r.title)+'</div>'+
       '<div class="muted" style="font-size:12px">'+esc(r.mod)+'</div>'+
       '<div style="font-size:13.5px;color:#444">…'+esc(r.snip).replace(re,'<span class="hl">$1</span>')+'…</div></div>';
  });
  h+='</div>';
  document.getElementById("main").innerHTML=h;
  highlightActiveNav();
}

/* ---------- nav toggle (mobile) ---------- */
function toggleNav(){ const s=document.getElementById("sidebar"); s.classList.toggle("open"); document.getElementById("scrim").classList.toggle("show", s.classList.contains("open")); }
function closeNav(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("scrim").classList.remove("show"); }

/* ---------- init ---------- */
buildTermIndex();
renderNav();
renderDashboard();
</script>
