<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lorenzani Course — Mastery Trainer</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --ink:#1d2330; --muted:#5d6678; --line:#e6e9ef;
  --brand:#1c5fd6; --brand2:#0f47ad; --accent:#0a7e57;
  --def:#1c5fd6; --defbg:#eef3fe; --ex:#0a7e57; --exbg:#e9f6ef;
  --pr:#8a5a00; --prbg:#fdf3e0; --warn:#b22b3b; --warnbg:#fdecee;
  --quote:#5a4bb3; --quotebg:#f0eefb;
  --good:#0a7e57; --bad:#b22b3b; --shadow:0 1px 3px rgba(20,30,60,.08),0 6px 24px rgba(20,30,60,.06);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit}
.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:300px;flex:0 0 300px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px 40px}
.brand{font-weight:800;font-size:18px;letter-spacing:.2px;margin:4px 6px 2px;color:var(--brand2)}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.3px;margin-top:3px}
.search{width:100%;margin:14px 0 8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fbfcfe}
.navbtns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 4px 12px}
.navbtns button,.resume{flex:1 1 auto;border:1px solid var(--line);background:#fbfcfe;color:var(--ink);border-radius:9px;padding:8px 6px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.navbtns button:hover,.resume:hover{background:#eef3fe;border-color:#cfe0ff}
.navbtns button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.resume{width:100%;margin:0 4px 12px;background:#eaf7f0;border-color:#bfe7d2;color:#0a6b4a}
.modgroup{margin:10px 4px}
.modtitle{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:8px 8px 4px}
.seclink{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13.3px;color:var(--ink)}
.seclink:hover{background:#f1f4fb}
.seclink.active{background:#eef3fe;color:var(--brand2);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:#d6dbe6}
.dot.read{background:#f2c14e}
.dot.mastered{background:var(--good)}
.seclink .pct{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Main */
.main{flex:1;min-width:0;padding:26px 34px 80px;max-width:1000px;margin:0 auto;width:100%}
.topbar{display:none}
h1.page{font-size:26px;margin:2px 0 4px;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin:0 0 18px}
.section-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.section-head h2{margin:0;font-size:22px;flex:1 1 auto}
.modtag{display:inline-block;background:#eef3fe;color:var(--brand2);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:700;letter-spacing:.2px;margin-bottom:8px}
.block{margin:14px 0;padding:13px 16px;border-radius:10px;border-left:4px solid var(--line);background:#fbfcfe}
.block .lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;opacity:.85;margin-bottom:5px;display:block}
.block.def{border-color:var(--def);background:var(--defbg)} .block.def .lbl{color:var(--def)}
.block.ex{border-color:var(--ex);background:var(--exbg)} .block.ex .lbl{color:var(--ex)}
.block.principle{border-color:var(--pr);background:var(--prbg)} .block.principle .lbl{color:var(--pr)}
.block.warn{border-color:var(--warn);background:var(--warnbg)} .block.warn .lbl{color:var(--warn)}
.block.quote{border-color:var(--quote);background:var(--quotebg);font-style:italic} .block.quote .lbl{color:var(--quote)}
.block.text{border-color:#cdd4e2;background:#fff}
.block ul{margin:6px 0 0;padding-left:22px}
.block ul li{margin:4px 0}
.lead{font-weight:700;margin-bottom:4px}
.kw{border-bottom:1.5px dotted var(--brand);cursor:help;font-weight:600}
.btn{display:inline-block;border:none;border-radius:10px;padding:11px 18px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:#f1f4fb}
.btn.good{background:var(--good);color:#fff}
.btn.warn{background:#e0a106;color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}
/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .n{font-size:30px;font-weight:800;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),#e9edf5 0);display:flex;align-items:center;justify-content:center;margin:0 auto}
.ring .inner{width:92px;height:92px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .inner b{font-size:26px}
.bar{height:9px;border-radius:6px;background:#e9edf5;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#3f86ff)}
.mod-card{margin-bottom:14px}
.mod-card h3{margin:0 0 4px;font-size:16px}
.dash-sec{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.dash-sec:hover{color:var(--brand)}
.dash-sec .pct{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.ok{background:var(--exbg);color:var(--good)} .badge.mid{background:var(--prbg);color:var(--pr)} .badge.no{background:#eef1f6;color:var(--muted)}
/* Quiz */
.q{margin:16px 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.q .qno{font-size:12px;font-weight:800;color:var(--muted)}
.q .qtext{font-weight:600;margin:6px 0 12px;font-size:15.5px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fbfcfe;border-radius:9px;padding:11px 14px;margin:7px 0;cursor:pointer;font-size:14.5px;transition:.12s}
.opt:hover{border-color:#bcd0ff;background:#f3f7ff}
.opt.sel{border-color:var(--brand);background:#eaf1ff}
.opt.correct{border-color:var(--good);background:#e9f7f0}
.opt.wrong{border-color:var(--bad);background:#fdeef0}
.fillin{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14.5px}
.feedback{margin-top:11px;padding:11px 13px;border-radius:9px;font-size:14px;display:none}
.feedback.show{display:block}
.feedback.ok{background:#e9f7f0;border:1px solid #bfe7d2}
.feedback.no{background:#fdeef0;border:1px solid #f3c6cd}
.src{margin-top:8px;font-size:13px;color:#444;background:#f6f8fc;border-left:3px solid var(--brand);padding:8px 11px;border-radius:6px}
.pill{display:inline-block;background:#eef3fe;color:var(--brand2);font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;margin-right:6px}
/* Flashcard */
.flash{perspective:1200px;margin:18px 0}
.flash-inner{position:relative;width:100%;min-height:230px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash-inner.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:#fbfdff}
.face .role{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.face .txt{font-size:19px;line-height:1.5}
.face.back .txt{font-size:17px}
.face .hint{position:absolute;bottom:12px;font-size:11.5px;color:var(--muted)}
.tag{position:absolute;top:12px;left:14px;font-size:11px;color:var(--muted)}
/* Exam */
.exam-timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}
.rubric{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.scorebig{font-size:54px;font-weight:800;letter-spacing:-1px}
.qreview{border-top:1px solid var(--line);padding:12px 0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.hl{background:#fff3bf;border-radius:3px;padding:0 2px}
.searchres{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.searchres:hover{background:#f6f8fc}
.searchres .t{font-weight:700;color:var(--brand2)}
.empty{color:var(--muted);font-style:italic;padding:20px 0}
.menu-toggle{display:none}
@media(max-width:880px){
  .sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}
  .main{padding:64px 16px 70px}
  .topbar{display:flex;position:fixed;top:0;left:0;right:0;height:52px;background:#fff;border-bottom:1px solid var(--line);align-items:center;gap:12px;padding:0 14px;z-index:40}
  .menu-toggle{display:inline-flex;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:18px;cursor:pointer}
  .topbar .t{font-weight:800;color:var(--brand2)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(10,20,40,.35);z-index:45}
  .scrim.show{display:block}
}
</style>
</head>

<div class="topbar">

      <button data-view="weak" onclick="go('weak')">Weak Points</button>
      <button data-view="glossary" onclick="go('glossary')">Glossary</button>

    <div id="secnav"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

 words max) – 50% of the grade.", "concept": "Assessment"}, {"type": "mcq", "q": "Oral presentations are worth what share of the grade?", "options": ["30%", "15%", "55%", "25%"], "answer": 0, "source": "Oral presentations (30%).", "concept": "Assessment"}, {"type": "blank", "q": "The written outline for the oral presentation must be sent at least ______ hours in advance.", "accept": ["48"], "answer": "48", "source": "Written outline (max 2 pages excl. bibliography) to be sent at least 48 hours before the oral presentation to Academic Assistant.", "concept": "Assessment"}]}, {"id": "intro-schedule", "module": "intro", "title": "Schedule & Module Map", "blocks": [{"k": "text", "t": "The course develops around 4 teaching modules. An optional tutorial ‘Digital Policy 101’ with the Academic Assistant is possible."}, {"k": "list", "lead": "Overall schedule:", "items": ["Fri 09/01/2026 — General introduction + MODULE 1 (foresight as a beacon of the new EU industrial strategy)", "Sat 10/01/2026 — MODULE 1 + MODULE 2 (Open Strategic Autonomy)", "Fri 30/01/2026 — MODULE 2 (Open Strategic Autonomy)", "Sat 31/01/2026 — MODULE 2 + Presentation Group 1 + MODULE 3 (Regulatory)", "Fri 20/03/2026 — MODULE 3 (Regulatory) + SEMINAR by M. HAVRDA", "Sat 21/03/2026 — MODULE 3 + Presentations Group 2 & 3 + MODULE 4 (Twinning green-digital)", "Fri 17/04/2026 — MODULE 4 (Twinning green-digital) + SEMINAR by F. CHIRICO", "Sat 18/04/2026 — MODULE 4 + Presentations Group 4 & 5"]}, {"k": "list", "lead": "The four modules:", "items": ["Module 1: Introduction — strategic foresight as a beacon of the EU’s new industrial strategy.", "Module 2: Digitalisation and advanced technologies as a leg of Europe’s new industrial strategy and open strategic autonomy.", "Module 3: The EU as a digital normative superpower (regulatory).", "Module 4: Dynamic coherence of the digital transition with the green/fair transition (twinning)."]}, {"k": "ex", "t": "Two seminars complement the modules: <b>M. HAVRDA<\/b> (with Module 3) and <b>F. CHIRICO<\/b> (with Module 4, on the DSA and DMA)."}], "terms": [], "quiz": [{"type": "mcq", "q": "Which seminar accompanies Module 4 and covers the DSA and DMA?", "options": ["F. Chirico", "M. Havrda", "A. Renda", "M. Szapiro"], "answer": 0, "source": "MODULE 4 (Twinning green-digital) + SEMINAR by F. CHIRICO.", "concept": "Seminars"}, {"type": "mcq", "q": "Module 4 is about…", "options": ["Twinning of the digital transition with the green/fair transition", "Open strategic autonomy", "EU digital regulation", "Strategic foresight tools"], "answer": 0, "source": "MODULE 4 (Twinning green-digital).", "concept": "Course structure"}]}, {"id": "intro-readinglist", "module": "intro", "title": "Reading List (Compulsory Readings by Module)", "blocks": [{"k": "list", "lead": "Module 1:", "items": ["A ‘Geopolitical Commission’: Reaching a Point of Inflexion?, Lorenzani D. and M. Szapiro, 2023 (in O. Costa & S. Van Hecke eds., “The EU Political System After the 2019 European Elections”).", "Strategic foresight as a beacon for the new EU industrial policy, Lorenzani D., 2024, European Law Journal (vol. 30, no. 3, Sept 2024, pp. 422-433).", "Competitiveness Compass Communication, European Commission, 2025.", "2020 Strategic Foresight Report, European Commission, 2020.", "2025 Strategic Foresight Report, European Commission, 2025."]}, {"k": "list", "lead": "Module 2:", "items": ["Draghi Report, 2024 — part B chapters ‘Digitalisation & Advanced Tech’ (p 67), ‘Accelerating Innovation’ (p 228) and ‘Strengthening Governance’ (p 307).", "2021 Strategic Foresight Report, European Commission, 2021.", "New measures to secure raw materials and strengthen the EU’s economic security, 2025; and New EU economic security doctrine (European Parliament briefing, 2025).", "2025 Report on the state of the Digital Decade, European Commission, 2025.", "Revised Cybersecurity Act, European Commission, 2026."]}, {"k": "list", "lead": "Module 3:", "items": ["2023 Strategic Foresight Report, European Commission, 2023.", "Anu Bradford: the race to become the next technology superpower, McKinsey Global Publishing, November 2023.", "Artificial Intelligence and the Great Divergence, White House, 2026.", "Draghi Report, 2024, chapter ‘Strengthening governance’ (p 307 and following).", "Digital issues in the EU-US Trade and Technology Council, Commission documents."]}, {"k": "list", "lead": "Module 4:", "items": ["What ‘North Star’ for future EU industrial policy?, Andrea Renda, 2024.", "The Technology/Jobs Puzzle: A European Perspective, Andrea Renda, Pierre Alexandre Balland and Lucia Bosoer, February 28, 2023.", "The future of jobs is green, JRC, Publications Office of the European Union, 2021.", "IoT4SDGs, CEPS publications, Andrea Renda and Moritz Laurer, 2020.", "2022 Strategic Foresight Report, European Commission, 2022."]}, {"k": "warn", "t": "The compulsory core: the <b>Draghi Report<\/b> (Part A + digital and governance chapters in Part B), the <b>Competitiveness Compass<\/b>, and the <b>Strategic Foresight Reports 2020-2021-2022-2023-2025<\/b>."}], "terms": [], "quiz": [{"type": "mcq", "q": "Which author wrote 'The Technology/Jobs Puzzle: A European Perspective' (with Balland and Bosoer)?", "options": ["Andrea Renda", "Mario Draghi", "Anu Bradford", "Dimitri Lorenzani"], "answer": 0, "source": "The Technology/Jobs Puzzle: A European Perspective, Andrea Renda, Pierre Alexandre Balland and Lucia Bosoer, 2023.", "concept": "Renda"}, {"type": "mcq", "q": "Which Strategic Foresight Reports are listed as compulsory?", "options": ["2020, 2021, 2022, 2023 and 2025", "Only 2024", "2019 and 2020", "2022 and 2026"], "answer": 0, "source": "The European Commission’s Strategic Foresight Reports 2020-2021-2022-2023-2025.", "concept": "Reading list"}, {"type": "mcq", "q": "Which McKinsey reading concerns 'the race to become the next technology superpower'?", "options": ["Anu Bradford (2023)", "Andrea Renda (2024)", "Federico Fabbrini (2025)", "Mario Draghi (2024)"], "answer": 0, "source": "Anu Bradford: the race to become the next technology superpower, McKinsey Global Publishing, November 2023.", "concept": "Reading list"}]}, {"id": "intro-glossary1", "module": "intro", "title": "Digital Glossary (I): AI, Connectivity & Computing", "blocks": [{"k": "def", "t": "<b>Artificial intelligence (AI)<\/b>: the ability of a computer or computer-controlled robot to perform tasks associated with intelligent beings — reasoning, discovering meaning, generalizing, learning from past experience. It combines computer science and data analytics and encompasses <b>machine learning<\/b> and <b>deep learning<\/b> (AI algorithms that create expert systems to make predictions or classifications based on input data)."}, {"k": "def", "t": "<b>5G/6G<\/b>: fifth- and sixth-generation technology for wireless communications over cellular data networks; operating on higher radio frequencies than 4G, providing more bandwidth and lower latency at microsecond speeds. Wireless generations are standardized by the <b>International Telecommunication Union<\/b>."}, {"k": "def", "t": "<b>Edge (computing)<\/b>: a distributed computing paradigm/architecture that brings computation and data storage closer to the sources of data, in order to improve response times and save bandwidth."}, {"k": "def", "t": "<b>Supercomputing<\/b>: a type of high-performance computing (HPC) using computers with high computational capabilities (supercomputers) to process complex calculations and large volumes of data."}, {"k": "def", "t": "<b>Quantum (computing)<\/b>: the use of quantum (physics) phenomena like superposition and entanglement to perform computation exponentially faster than classic (electrodynamics) computers, including HPCs."}, {"k": "def", "t": "<b>Internet of Things (IoT)<\/b>: devices with sensors, processing ability, software and other technologies that connect and exchange data with other devices and systems over the Internet or other communications networks."}, {"k": "def", "t": "<b>Cloud<\/b>: networked computing facilities providing remote data storage and processing services via the internet."}], "terms": [{"t": "Artificial intelligence (AI)", "d": "The ability of a computer/robot to perform tasks of intelligent beings; combines computer science and data analytics; encompasses machine learning and deep learning."}, {"t": "5G/6G", "d": "Fifth-/sixth-generation wireless tech; higher frequencies than 4G; more bandwidth, lower (microsecond) latency; standardised by the ITU."}, {"t": "Edge computing", "d": "Distributed architecture bringing computation/storage closer to data sources to improve response times and save bandwidth."}, {"t": "Quantum computing", "d": "Uses superposition and entanglement to compute exponentially faster than classical computers."}, {"t": "IoT", "d": "Devices with sensors/software that connect and exchange data over the internet or other networks."}], "quiz": [{"type": "blank", "q": "AI encompasses machine learning and ______ learning (algorithms that create expert systems to make predictions or classifications).", "accept": ["deep"], "answer": "deep", "source": "It combines computer science, data analytics and encompasses machine learning and deep learning.", "concept": "AI"}, {"type": "mcq", "q": "Which two quantum-physics phenomena let quantum computers compute exponentially faster?", "options": ["Superposition and entanglement", "Reflection and refraction", "Induction and conduction", "Fission and fusion"], "answer": 0, "source": "Quantum: use of quantum phenomena like superposition and entanglement to perform computation exponentially faster than classic computers.", "concept": "Quantum"}, {"type": "mcq", "q": "Wireless generations (5G/6G) are standardized by the…", "options": ["International Telecommunication Union (ITU)", "European Commission", "ISO", "NATO"], "answer": 0, "source": "Wireless generations are standardized by International Telecommunication Union.", "concept": "5G/6G"}, {"type": "blank", "q": "______ computing brings computation and data storage closer to the sources of data to improve response times and save bandwidth.", "accept": ["Edge"], "answer": "Edge", "source": "Edge (computing): distributed computing paradigm that brings computation and data storage closer to the sources of data.", "concept": "Edge computing"}]}, {"id": "intro-glossary2", "module": "intro", "title": "Digital Glossary (II): Exascale, Twins, Data Centres & AI Models", "blocks": [{"k": "def", "t": "<b>Exascale<\/b>: a measure of supercomputer performance — computing systems capable of calculating at least “10¹⁸ IEEE 754 Double Precision (64-bit) operations (multiplications and/or additions) per second (exaFLOPS)”."}, {"k": "def", "t": "<b>Digital twins<\/b>: a digital model of an intended or actual real-world physical product, system or process (the ‘physical twin’) that serves as its indistinguishable digital counterpart for practical purposes: simulation, integration, testing, monitoring, maintenance."}, {"k": "def", "t": "<b>Data Centres<\/b>: a centralized facility where an organization’s IT operations and equipment are concentrated, serving critical functions related to storing, processing and disseminating data and applications. <b>Enterprise on-premise<\/b> data centres are hosted in the organization’s own facilities (e.g. for greater control over security and regulatory compliance). <b>Cloud computing<\/b> data centres house IT infrastructure resources for shared use by multiple customers via the Internet. Cloud providers sometimes maintain smaller <b>edge data centers<\/b> closer to customers for lower latency or data-intensive workloads like big-data analytics."}, {"k": "def", "t": "<b>Edge cloud (or fog)<\/b>: cloud computing that occurs at the network edge (the point where data is exchanged between devices — computers, smartphones, sensors, IoT devices — and cloud services) instead of sending data back to a central data center or private cloud. Advantages: reducing data latency; maintaining high availability by processing data closer to the source (if one edge location fails, another nearby can take over); and reducing the risk of unauthorized access to sensitive data via public networks."}, {"k": "def", "t": "<b>AI model<\/b>: a program trained on a set of data to perform specific tasks like recognizing certain patterns or making certain decisions. It uses algorithms to learn from data and apply that learning to achieve pre-defined objectives, and can make predictions when provided with the necessary information. An <b>AI language model<\/b> is a program that can recognize and generate text based on the preceding words."}], "terms": [{"t": "Exascale", "d": "Supercomputer performance of at least 10^18 double-precision operations per second (exaFLOPS)."}, {"t": "Digital twins", "d": "A digital counterpart of a real-world physical product/system/process used for simulation, testing, monitoring, maintenance."}, {"t": "Data Centres", "d": "Centralized facilities concentrating IT operations for storing, processing and disseminating data; can be on-premise, cloud or edge."}, {"t": "Edge cloud (fog)", "d": "Cloud computing at the network edge; reduces latency, raises availability, reduces unauthorized-access risk."}], "quiz": [{"type": "mcq", "q": "'Exascale' refers to a system capable of at least how many double-precision operations per second?", "options": ["10¹⁸ (exaFLOPS)", "10⁹ (gigaFLOPS)", "10¹² (teraFLOPS)", "10¹⁵ (petaFLOPS)"], "answer": 0, "source": "Exascale: computing systems capable of calculating at least 10^18 IEEE 754 Double Precision operations per second (exaFLOPS).", "concept": "Exascale"}, {"type": "blank", "q": "A digital ______ is the indistinguishable digital counterpart of a real-world physical product, system or process.", "accept": ["twin", "twins"], "answer": "twin", "source": "Digital twins: digital model of intended or actual real-world physical product, system, or process (physical twin).", "concept": "Digital twins"}, {"type": "mcq", "q": "Edge cloud (fog) is best described as…", "options": ["cloud computing that occurs at the network edge", "a centralized enterprise data centre", "a quantum computer", "a 6G base station"], "answer": 0, "source": "Edge cloud (or fog): cloud computing that occurs at the network edge instead of sending data back to a central data center.", "concept": "Edge cloud"}]}, {"id": "m1-trio", "module": "m1", "title": "A New ‘Consistent Trio’ — the Industrial-Policy Turn", "blocks": [{"k": "principle", "t": "The <b>Von der Leyen I Commission<\/b> was a <b>swinging moment<\/b> in EU industrial policies — shifting between <b>vertical vs horizontal<\/b> approaches towards <b>competitiveness, resilience and (open) strategic autonomy<\/b>."}, {"k": "text", "t": "Module 1 asks: foresight as a beacon of the EU’s new industrial strategy for Europe — <b>why is it linked?<\/b>"}, {"k": "quote", "t": "“Industrial strategies today – as seen in the US and China – combine multiple policies, ranging from fiscal policies to encourage domestic production, to trade policies to penalise anti-competitive behaviour, to foreign economic policies to secure supply chains. In the EU context, linking policies in this way requires […] a new industrial strategy for Europe.” — Mario Draghi, ‘The Future of European Competitiveness’, September 2024 ('Soul searching for a new industrial strategy')."}, {"k": "ex", "t": "The slide pairs the US and China as examples of countries that already <b>combine<\/b> fiscal, trade and foreign-economic policies into an industrial strategy — the model the EU is urged to emulate."}], "terms": [{"t": "Von der Leyen I Commission", "d": "Identified in the course as a 'swinging moment' in EU industrial policy (vertical vs horizontal) towards competitiveness, resilience and open strategic autonomy."}, {"t": "Vertical vs horizontal industrial policy", "d": "Vertical = sector/technology-targeted support; horizontal = economy-wide framework conditions. The VdL I Commission swung between them."}], "quiz": [{"type": "mcq", "q": "The course calls the Von der Leyen I Commission a 'swinging moment' between which two industrial-policy approaches?", "options": ["Vertical vs horizontal", "Fiscal vs monetary", "Open vs closed", "National vs supranational"], "answer": 0, "source": "Von der Leyen I Commission as a swinging moment in EU industrial policies (vertical vs horizontal) towards competitiveness, resilience and (open) strategic autonomy.", "concept": "Industrial policy turn"}, {"type": "mcq", "q": "Draghi notes that US and Chinese industrial strategies combine fiscal policies, trade policies and…", "options": ["foreign economic policies to secure supply chains", "monetary easing", "carbon taxes", "data-protection rules"], "answer": 0, "source": "…to foreign economic policies to secure supply chains.", "concept": "Draghi Report"}]}, {"id": "m1-compass", "module": "m1", "title": "The Competitiveness Compass — Europe’s ‘North Star’", "blocks": [{"k": "def", "t": "<b>Competitiveness Compass<\/b>: a Commission framework (2025), presented as a <b>‘North Star’<\/b>, to orient Europe towards <b>productivity, innovation, decarbonisation and security<\/b>."}, {"k": "text", "t": "Related slides build the theme: ‘A Competitiveness Compass for Europe’, ‘Competitiveness as Europe’s North Star’, ‘A new Competitiveness Compass for Europe’, and ‘Digital innovation-based productivity’."}, {"k": "ex", "t": "A <b>Competitiveness Coordination Tool (CCT)<\/b> is presented as part of the Compass machinery."}, {"k": "principle", "t": "The Compass connects <b>competitiveness<\/b> to <b>digital innovation-based productivity<\/b> — i.e. digital technologies are framed as the engine of Europe’s productivity and competitiveness."}], "terms": [{"t": "Competitiveness Compass", "d": "A 2025 Commission framework, presented as a 'North Star', orienting Europe towards productivity, innovation, decarbonisation and security."}, {"t": "Competitiveness Coordination Tool (CCT)", "d": "A coordination instrument presented as part of the Competitiveness Compass machinery."}], "quiz": [{"type": "blank", "q": "The Competitiveness Compass is presented as Europe’s ‘______ Star’.", "accept": ["North"], "answer": "North", "source": "Competitiveness as Europe’s ‘North Star’.", "concept": "Competitiveness Compass"}, {"type": "mcq", "q": "The Competitiveness Compass orients Europe towards which four objectives?", "options": ["Productivity, innovation, decarbonisation and security", "Trade, defence, agriculture and migration", "Tax, spending, debt and deficit", "Privacy, transparency, fairness and openness"], "answer": 0, "source": "Competitiveness Compass: a Commission framework to orient Europe towards productivity, innovation, decarbonisation and security.", "concept": "Competitiveness Compass"}]}, {"id": "m1-lens", "module": "m1", "title": "Foresight as a ‘Strategic Lens’", "blocks": [{"k": "def", "t": "<b>Foresight<\/b> is “the discipline of exploring, anticipating and shaping the future”. It is a set of qualitative and quantitative tools and methods to build a <b>safe space to ask disruptive questions<\/b> and use <b>collective intelligence<\/b> in a structured way to prepare for future developments/crises (Strategic Foresight Report, 2020)."}, {"k": "def", "t": "<b>Strategic foresight<\/b> is a <b>foresight-based political narrative<\/b>, informing today’s policies/decision-making through: analysis of long-term (mega)trends, and short-term horizon scanning."}, {"k": "quote", "t": "“You are not doing a good job if you are not attracting some incoming fire.” — Hillary Clinton (cited to convey that good foresight challenges the status quo)."}, {"k": "text", "t": "The slide closes with a ‘Post Scriptum: What foresight is <i>not<\/i>’ — a reminder that foresight is not prediction/fortune-telling but structured preparation."}], "terms": [{"t": "Strategic foresight", "d": "A policy discipline of exploring, anticipating and shaping future developments so EU strategies are resilient and future-proof; a foresight-based political narrative informing today's decisions."}, {"t": "Collective intelligence", "d": "Structured pooling of diverse expertise used in foresight to prepare for future developments/crises."}], "quiz": [{"type": "blank", "q": "Foresight is defined as 'the discipline of exploring, anticipating and ______ the future'.", "accept": ["shaping"], "answer": "shaping", "source": "Foresight is “the discipline of exploring, anticipating and shaping the future”.", "concept": "Strategic foresight"}, {"type": "mcq", "q": "According to the 2020 SFR, foresight builds a 'safe space' to…", "options": ["ask disruptive questions and use collective intelligence", "lobby for national interests", "predict exact future events", "replace democratic debate"], "answer": 0, "source": "A set of tools and methods to build a safe space to ask disruptive questions and use collective intelligence in a structured way.", "concept": "Strategic foresight"}, {"type": "mcq", "q": "Strategic foresight informs today's policies through long-term (mega)trend analysis and…", "options": ["short-term horizon scanning", "annual budget votes", "treaty revision", "comitology"], "answer": 0, "source": "Strategic foresight: analysis of long-term (mega)trends; short-term horizon scanning.", "concept": "Strategic foresight"}]}, {"id": "m1-orga", "module": "m1", "title": "Organisation of Foresight within the EU", "blocks": [{"k": "list", "lead": "Foresight is institutionally embedded across the EU:", "items": ["A <b>Commissioner in charge of strategic foresight<\/b> — leading political efforts to embed it into EU policymaking.", "Member States’ foresight capabilities supported by an <b>EU Foresight Network of ‘Ministers of the Future’<\/b>.", "The Commission’s <b>Secretariat-General & Joint Research Centre (JRC)<\/b> are the lead services for implementing this mandate.", "<b>9 EU institutions<\/b> participate in the inter-institutional foresight network <b>ESPAS (European Strategy and Policy Analysis System)<\/b>."]}], "terms": [{"t": "ESPAS", "d": "European Strategy and Policy Analysis System — the inter-institutional foresight network in which 9 EU institutions participate."}, {"t": "Ministers of the Future", "d": "An EU Foresight Network of Member-State ministers supporting national foresight capabilities."}, {"t": "Joint Research Centre (JRC)", "d": "The Commission's science service; with the Secretariat-General it is a lead service implementing the foresight mandate and produces the foresight studies underpinning the SFRs."}], "quiz": [{"type": "blank", "q": "The inter-institutional foresight network in which 9 EU institutions participate is called ______ (acronym).", "accept": ["ESPAS"], "answer": "ESPAS", "source": "9 EU institutions participate in the inter-institutional foresight network ESPAS (European Strategy and Policy Analysis System).", "concept": "ESPAS"}, {"type": "mcq", "q": "Which two Commission services are the lead services for implementing the foresight mandate?", "options": ["Secretariat-General & Joint Research Centre", "DG COMP & DG TRADE", "ECB & EIB", "EEAS & ENISA"], "answer": 0, "source": "Commission’s Secretariat-General & Joint Research Centre lead services for implementing this mandate.", "concept": "ESPAS"}, {"type": "mcq", "q": "The EU Foresight Network of Member-State ministers is nicknamed the…", "options": ["Ministers of the Future", "Council of Elders", "Digital Decade Board", "Foresight College"], "answer": 0, "source": "Member States’ foresight capabilities supported by an EU Foresight Network of Ministers of the Future.", "concept": "Ministers of the Future"}]}, {"id": "m1-commissioner", "module": "m1", "title": "The Foresight Commissioner & Open Strategic Autonomy", "blocks": [{"k": "quote", "t": "“We want to keep Europe at the forefront of the sustainability transition, leveraging our unique social market economy and global trade power. This will help strengthen Europe’s leadership in the world, and our ability to stand on our own while building strong partnerships with others: this is what we call Europe’s open strategic autonomy.” — Maroš Šefčovič, Executive Vice-President for the European Green Deal, Interinstitutional Relations and Foresight."}, {"k": "def", "t": "<b>Open strategic autonomy (OSA)<\/b>: the EU objective of reducing harmful dependencies while remaining outward-looking and cooperative where possible — being ‘as open as possible, as autonomous as necessary’ (and, more recently, increasingly the other way round)."}, {"k": "principle", "t": "OSA is the <b>geopolitical dimension of resilience<\/b>: the freedom and capacity to act in the world in an increasingly contested and multipolar global order."}], "terms": [{"t": "Open strategic autonomy (OSA)", "d": "Reducing harmful dependencies while staying outward-looking; 'as open as possible, as autonomous as necessary'; the geopolitical dimension of resilience."}], "quiz": [{"type": "blank", "q": "OSA is summarised as being 'as open as possible, as ______ as necessary'.", "accept": ["autonomous"], "answer": "autonomous", "source": "OSA is the geopolitical dimension of resilience: being as open as possible, as autonomous as necessary… or, more recently, increasingly the other way round.", "concept": "Open strategic autonomy"}, {"type": "mcq", "q": "Which Commissioner is quoted defining Europe’s open strategic autonomy?", "options": ["Maroš Šefčovič", "Ursula von der Leyen", "Mario Draghi", "Thierry Breton"], "answer": 0, "source": "Maroš Šefčovič, Executive Vice-President for the European Green Deal, Interinstitutional Relations and Foresight.", "concept": "Open strategic autonomy"}]}, {"id": "m1-toolbox", "module": "m1", "title": "The Foresight Toolbox", "blocks": [{"k": "list", "lead": "Foresight methods/tools:", "items": ["<b>Scenarios<\/b>: the JRC offers an online <b>Scenario Building and Exploration System<\/b> to simulate possible future paths on any topic (e.g. ‘what if quantum broke current encryption systems?’).", "<b>Megatrends monitoring and implications assessment<\/b>.", "<b>Horizon scanning<\/b>.", "<b>Others<\/b>: personas, Delphi, vision building, etc.", "<b>Tech foresight<\/b> (e.g. <b>FUTURINNOV<\/b> to inform the EIC and link with the MFF 2028-2034 via a new <b>Observatory for Emerging Technologies<\/b>)."]}], "terms": [{"t": "FUTURINNOV", "d": "A tech-foresight initiative to inform the EIC and link with the MFF 2028-2034 via a new Observatory for Emerging Technologies."}, {"t": "Scenario Building and Exploration System", "d": "A JRC online tool to simulate possible future paths on any topic."}], "quiz": [{"type": "mcq", "q": "Which is NOT listed as a foresight tool/method in the toolbox?", "options": ["Quantitative easing", "Scenarios", "Horizon scanning", "Delphi"], "answer": 0, "source": "Toolbox: Scenarios; Megatrends monitoring; Horizon scanning; Others: personas, Delphi, vision building; Tech foresight.", "concept": "Foresight toolbox"}, {"type": "mcq", "q": "FUTURINNOV is a tech-foresight initiative designed to inform the EIC and link with…", "options": ["the MFF 2028-2034 via a new Observatory for Emerging Technologies", "NATO planning", "the ECB's monetary policy", "the AI Act sandboxes"], "answer": 0, "source": "Tech foresight (e.g. FUTURINNOV to inform the EIC and link with MFF 2028-2034 via a new Observatory for Emerging Technologies).", "concept": "FUTURINNOV"}]}, {"id": "m1-megatrends", "module": "m1", "title": "Megatrends & Horizon Scanning", "blocks": [{"k": "text", "t": "The Commission’s <b>Megatrends Hub<\/b> analyses <b>14 global megatrends<\/b> from an EU perspective — a crucial methodology underlying the Commission’s Strategic Foresight Reports."}, {"k": "def", "t": "<b>Megatrends<\/b>: large-scale, long-term driving forces that are observable now and could have significant influence on the future, impacting most human activities, processes and perceptions."}, {"k": "def", "t": "<b>Horizon scanning<\/b>: the Commission keeps an eye on the horizon to anticipate future developments — especially in areas of disruptive change/innovation like digital. Horizon scanners from <b>ESPAS<\/b> identify <b>‘signs of change’<\/b>, then validated as <b>‘weak signals’<\/b> and explored in terms of their future impact via <b>‘sense-making sessions’<\/b>. Output: <b>quarterly horizon scanning newsletters<\/b> presented to the College."}, {"k": "ex", "t": "Examples cited: the Horizon Scanning bulletins of Dec 2023 and Nov 2025 (HorizonScanning_ESPAS_06.pdf)."}], "terms": [{"t": "Megatrends", "d": "Large-scale, long-term driving forces observable now that could significantly influence the future across most human activities."}, {"t": "Horizon scanning", "d": "Anticipating future developments by spotting 'signs of change', validating them as 'weak signals', and exploring impact in 'sense-making sessions'; output = quarterly newsletters to the College."}], "quiz": [{"type": "blank", "q": "The Commission’s Megatrends Hub analyses ______ global megatrends from an EU perspective.", "accept": ["14"], "answer": "14", "source": "Commission’s Megatrends Hub analyses 14 global megatrends from EU perspective.", "concept": "Megatrends"}, {"type": "mcq", "q": "In horizon scanning, 'signs of change' are first validated as ______ before their impact is explored.", "options": ["'weak signals'", "'megatrends'", "'black swans'", "'scenarios'"], "answer": 0, "source": "Horizon scanners from ESPAS identify ‘signs of change’ then validated as ‘weak signals’ and explored via ‘sense-making sessions’.", "concept": "Horizon scanning"}, {"type": "mcq", "q": "The output of horizon scanning is…", "options": ["quarterly horizon scanning newsletters presented to the College", "annual budget reports", "binding regulations", "treaty amendments"], "answer": 0, "source": "Output: quarterly horizon scanning newsletters presented to the College.", "concept": "Horizon scanning"}]}, {"id": "m1-sfr", "module": "m1", "title": "The Strategic Foresight Report (SFR)", "blocks": [{"k": "def", "t": "<b>Strategic Foresight Report (SFR)<\/b>: an <b>annual Commission Communication<\/b>, underpinned by a JRC Foresight study. It addresses cross-cutting strategic issues, proposes increasingly concrete policy recommendations (‘areas for action’), builds the case for future EU or national initiatives, and mainstreams ideas via the Foresight Networks’ inclusive participatory process."}, {"k": "ex", "t": "Each SFR pairs a <b>Science for Policy Report<\/b> (JRC) with a <b>Commission Communication<\/b>."}], "terms": [{"t": "Strategic Foresight Report (SFR)", "d": "Annual Commission Communication, underpinned by a JRC foresight study; proposes 'areas for action' and builds the case for future initiatives."}], "quiz": [{"type": "mcq", "q": "The Strategic Foresight Report is best described as…", "options": ["an annual Commission Communication underpinned by a JRC foresight study", "a binding regulation", "a treaty protocol", "a one-off Draghi report"], "answer": 0, "source": "Annual Commission Communication, underpinned by JRC’s Foresight study.", "concept": "SFR"}, {"type": "blank", "q": "The SFR proposes increasingly concrete policy recommendations called ‘areas for ______’.", "accept": ["action"], "answer": "action", "source": "Proposing increasingly concrete policy recommendations (“areas for action”).", "concept": "SFR"}]}, {"id": "m1-mainstreaming", "module": "m1", "title": "Mainstreaming Resilience, OSA & Sustainable Competitiveness", "blocks": [{"k": "quote", "t": "“[…] investing in our European tech sovereignty, we want to create links and not dependencies […]” — Commission President Ursula von der Leyen, State of the Union Speech, 15 September 2021."}, {"k": "ex", "t": "<b>Spain<\/b> put open strategic autonomy as the <i>fil rouge<\/i> of its <b>2023 Presidency<\/b>: the foresight study “Resilient EU 2030” on reinforcing the EU’s OSA and global leadership, with the Commission and a cluster of Member States; an informal European Council on 6 October 2023 discussed this and issued a Leaders’ Declaration."}, {"k": "text", "t": "<b>Mainstreaming resilience<\/b> in the European Semester via <b>Resilience Dashboards<\/b>. The <b>2021 Annual Sustainable Growth Survey<\/b> (Nov 2020) mentioned resilience 69 times, defined along the lines of the 2020 SFR."}, {"k": "list", "lead": "Mainstreaming sustainable competitiveness:", "items": ["The <b>2022 SFR<\/b> studied forward-looking interplays between the green and digital transitions to maximise synergies and assuage trade-offs across <b>5 critical sectors towards 2050<\/b>.", "A <b>2023 JRC Foresight Study<\/b> set out <b>4 scenarios<\/b> for a sustainable EU in 2050.", "Key idea of <b>dynamic policy coherence<\/b> underlying the 2023 SFR: digitalisation can help assuage the <b>‘North Star trilemma’<\/b> between competitiveness, decarbonisation and security (Module 4)."]}, {"k": "ex", "t": "Update of the new EU industrial strategy (May 2021) aimed to “respond to the lessons learned from the crisis to enhance the EU's open strategic autonomy” and “strengthen the resilience of the Single Market”, with a new focus on the <b>mitigation of excessive dependencies<\/b>."}], "terms": [{"t": "North Star trilemma", "d": "The tension between competitiveness, decarbonisation and security that digitalisation can help assuage (underpins the 2023 SFR)."}, {"t": "Resilience Dashboards", "d": "Tools mainstreaming resilience in the European Semester."}, {"t": "Resilient EU 2030", "d": "A foresight study (Spain's 2023 Presidency, with the Commission and Member States) to reinforce the EU's OSA and global leadership."}], "quiz": [{"type": "mcq", "q": "Which Member State made open strategic autonomy the 'fil rouge' of its 2023 Presidency?", "options": ["Spain", "France", "Germany", "Italy"], "answer": 0, "source": "Spain put open strategic autonomy as the fil rouge of its Presidency in 2023.", "concept": "OSA mainstreaming"}, {"type": "mcq", "q": "The 'North Star trilemma' that digitalisation can help assuage is between…", "options": ["competitiveness, decarbonisation and security", "openness, autonomy and partnership", "AI, chips and cloud", "trade, fiscal and monetary policy"], "answer": 0, "source": "Digitalization can help assuage the ‘North Star trilemma’ between competitiveness, decarbonization, and security.", "concept": "North Star trilemma"}, {"type": "blank", "q": "The 2022 SFR examined green-digital interplays across 5 critical sectors towards the year ______.", "accept": ["2050"], "answer": "2050", "source": "2022 SFR on forward-looking interplays between the green and digital transitions… across 5 critical sectors towards 2050.", "concept": "2022 SFR"}, {"type": "mcq", "q": "Whose 2021 State of the Union line is 'we want to create links and not dependencies'?", "options": ["Ursula von der Leyen", "Maroš Šefčovič", "Mario Draghi", "Hillary Clinton"], "answer": 0, "source": "Commission President Ursula von der Leyen, State of the Union Speech, 15 September 2021.", "concept": "OSA mainstreaming"}]}, {"id": "m1-linking", "module": "m1", "title": "Linking Foresight & the New EU Industrial Strategy", "blocks": [{"k": "quote", "t": "EU industrial policy is an example of the point of inflection towards a ‘geopolitical Commission’ due to “increased awareness of the need for more assertiveness and coherence between domestic and external policy agendas and across time horizons” (Lorenzani D. and M. Szapiro, 2023)."}, {"k": "principle", "t": "The SFRs have contributed to mainstreaming <b>resilience, open strategic autonomy and sustainable competitiveness<\/b> as pillars of a new industrial policy (Lorenzani D., 2024)."}, {"k": "def", "t": "<b>Mitigation of excessive dependencies<\/b>: based on JRC foresight input, the EU mapped (excessive) dependencies across <b>11 sensitive industrial ecosystems<\/b> — i.e. (over)reliance on a limited number of actors for the supply of goods, services, data, infrastructures, skills and technologies, with limited capacity for internal production to substitute imports critical to the Union’s and Member States’ strategic interests."}], "terms": [{"t": "Geopolitical Commission", "d": "Lorenzani & Szapiro (2023): a point of inflection towards more assertiveness and coherence between domestic and external agendas across time horizons."}, {"t": "11 sensitive industrial ecosystems", "d": "The ecosystems across which the EU mapped excessive dependencies (over-reliance on limited actors for goods, services, data, infrastructures, skills, technologies)."}], "quiz": [{"type": "blank", "q": "The EU mapped excessive dependencies across ______ sensitive industrial ecosystems.", "accept": ["11"], "answer": "11", "source": "(Excessive) dependencies across 11 sensitive industrial ecosystems.", "concept": "Mitigation of dependencies"}, {"type": "mcq", "q": "Lorenzani & Szapiro (2023) describe the EU industrial-policy turn as a point of inflection towards a…", "options": ["'geopolitical Commission'", "'digital single market'", "'fiscal union'", "'defence union'"], "answer": 0, "source": "EU industrial policy as example of the point of inflection towards a ‘geopolitical Commission’ (Lorenzani & Szapiro, 2023).", "concept": "Geopolitical Commission"}, {"type": "mcq", "q": "Per Lorenzani (2024), the SFRs mainstreamed which three pillars of a new industrial policy?", "options": ["Resilience, open strategic autonomy and sustainable competitiveness", "Tax, trade and defence", "AI, chips and cloud", "DSA, DMA and AI Act"], "answer": 0, "source": "The SFRs have contributed to mainstream resilience, open strategic autonomy, and sustainable competitiveness as pillars of a new industrial policy.", "concept": "Linking foresight"}]}, {"id": "m1-takeaways", "module": "m1", "title": "Module 1 — Key Takeaways", "blocks": [{"k": "list", "lead": "The four key takeaways of Module 1:", "items": ["Strategic foresight is the <b>analytical lens<\/b> of this course.", "The Strategic Foresight Reports and other foresight input guided the Commission’s <b>geopolitical awakening<\/b> via more policy coherence around the concepts of <b>resilience, open strategic autonomy and sustainable competitiveness<\/b>.", "The EU’s <b>industrial strategy<\/b> is the area most affected by this shift, through a new focus on sustainable competitiveness and <b>mitigation of excessive strategic dependencies<\/b>, as shown by the new Competitiveness Compass for Europe.", "The rest of the course investigates how specific pieces of EU (digital) laws and policies fit this framework — with a focus on <b>innovation and security (Module 2)<\/b>, <b>regulatory superpower (Module 3)<\/b> and <b>dynamic coherence vis-à-vis green and social aspects (Module 4)<\/b>."]}], "terms": [], "quiz": [{"type": "mcq", "q": "Module 1's takeaway names strategic foresight as the course's…", "options": ["analytical lens", "funding tool", "enforcement body", "trade instrument"], "answer": 0, "source": "Strategic foresight is the analytical lens of this course.", "concept": "Module 1 takeaways"}, {"type": "mcq", "q": "Module 2, 3 and 4 focus respectively on…", "options": ["innovation & security; regulatory superpower; dynamic green/social coherence", "trade; defence; agriculture", "AI; chips; cloud", "DSA; DMA; AI Act"], "answer": 0, "source": "…innovation and security (module 2), regulatory superpower (module 3), and dynamic coherence vis-à-vis green and social aspects (module 4).", "concept": "Module 1 takeaways"}]}, {"id": "m2-intro", "module": "m2", "title": "Module 2 — A New EU Digital Industrial Strategy", "blocks": [{"k": "text", "t": "Module 2: a new EU digital industrial strategy and its <b>geopolitical/geoeconomic relevance<\/b>. Focus: the <b>build-up and diffusion of advanced technologies<\/b>."}, {"k": "list", "lead": "The three pillars of the new digital industrial strategy:", "items": ["<b>More tech foresight & security of supply<\/b> (identify high-potential techs to invest in or secure supply chains). <i>Example: Chips Act + Economic Security Doctrine.<\/i>", "<b>State-of-the-art enablers<\/b>: fast and secure connectivity infrastructure, HPC, spectrum, etc. <i>Example: AI Gigafactories + Cybersecurity Act.<\/i>", "<b>Forward-looking approach to diffuse AI and general-purpose techs<\/b> across industrial sectors of strength (‘vertical AI use cases’). <i>Example: Apply AI + Cloud & AI Development Act.<\/i>"]}], "terms": [{"t": "Vertical AI use cases", "d": "Diffusion of AI and general-purpose technologies across industrial sectors of strength (e.g. Apply AI strategy)."}], "quiz": [{"type": "mcq", "q": "Which is one of the three pillars of the new EU digital industrial strategy?", "options": ["State-of-the-art enablers (connectivity, HPC, spectrum)", "A single EU corporate tax", "A common EU army", "A federal budget"], "answer": 0, "source": "Pillars: tech foresight & security of supply; state-of-the-art enablers; vertical AI use cases.", "concept": "Module 2 pillars"}, {"type": "mcq", "q": "The example paired with 'tech foresight & security of supply' is…", "options": ["Chips Act + Economic Security Doctrine", "AI Gigafactories + Cybersecurity Act", "Apply AI + Cloud & AI Development Act", "DSA + DMA"], "answer": 0, "source": "More tech foresight & security of supply… Example: Chips Act + Economic Security Doctrine.", "concept": "Module 2 pillars"}]}, {"id": "m2-mtt", "module": "m2", "title": "The EU’s ‘Middle Technology Trap’", "blocks": [{"k": "def", "t": "<b>Middle technology trap<\/b>: the EU specialises in mid-tech, mature industries (notably automotive) rather than the frontier digital/software sectors where the US (and increasingly others) lead — leaving Europe stuck in the middle of the value/technology ladder."}, {"k": "ex", "t": "Top firms by market value illustrate the gap. <b>US (2003 → 2012 → 2022)<\/b>: Ford/Pfizer/GM → Microsoft/Intel/Merck → <b>Google, Meta, Microsoft (all software)<\/b>. <b>EU (2003 → 2012 → 2022)<\/b>: Mercedes/Siemens/VW → VW/Mercedes/Bosch → <b>VW, Mercedes, Bosch (all auto)<\/b> (Science, research and innovation performance of the EU, 2024)."}, {"k": "ex", "t": "Evidence base: the <b>European Innovation Scoreboard 2024<\/b>."}], "terms": [{"t": "Middle technology trap", "d": "The EU's over-specialisation in mid-tech, mature sectors (e.g. automotive) instead of frontier digital/software, leaving it lagging at the technology frontier."}, {"t": "European Innovation Scoreboard", "d": "Annual EU benchmark of innovation performance (2024 edition cited)."}], "quiz": [{"type": "mcq", "q": "The 'middle technology trap' describes the EU being stuck in…", "options": ["mid-tech, mature sectors (e.g. automotive) rather than frontier software/digital", "low-tech agriculture only", "frontier quantum computing", "defence manufacturing"], "answer": 0, "source": "The EU’s middle technology trap: EU top firms remained auto (VW, Mercedes, Bosch) while US shifted to software (Google, Meta, Microsoft).", "concept": "Middle technology trap"}, {"type": "mcq", "q": "By 2022 the EU's most valuable companies were dominated by which sector?", "options": ["Automotive (VW, Mercedes, Bosch)", "Software", "Pharma", "Hardware"], "answer": 0, "source": "EU 2022: VW (auto), Mercedes (auto), Bosch (auto).", "concept": "Middle technology trap"}]}, {"id": "m2-rilifecycle", "module": "m2", "title": "The Research & Innovation Lifecycle: Capital, Knowledge, Scale", "blocks": [{"k": "principle", "t": "The R&I lifecycle is presented along three needs: <b>CAPITAL<\/b>, <b>KNOWLEDGE<\/b> and <b>SCALE<\/b> — to escape the middle technology trap, the EU must connect funding, research excellence and scale-up capacity."}, {"k": "ex", "t": "On <b>CAPITAL<\/b>, the slide details <b>Horizon Europe<\/b> by pillar (figures in € bn): Pillar 1 ‘Excellent Science’ (25) incl. ERC (16), MSCA (6.6), Research infrastructures (2.4); Pillar 2 ‘Global Challenges’ (53.5) incl. Cluster 4 ‘Digital, Industry and Space’ (15.3) and Cluster 5 ‘Climate, Energy and Mobility’ (15.1); Pillar 3 ‘Innovative Europe’ (13.6) incl. EIC (10.1)."}, {"k": "text", "t": "SCALE is highlighted as the EU’s persistent weakness: European innovators struggle to scale up to global size."}], "terms": [{"t": "R&I lifecycle (CAPITAL/KNOWLEDGE/SCALE)", "d": "The three needs of the research & innovation lifecycle the EU must connect to exit the middle technology trap."}, {"t": "Horizon Europe", "d": "The EU R&I framework programme, structured in 3 pillars (Excellent Science; Global Challenges; Innovative Europe incl. the EIC)."}, {"t": "European Innovation Council (EIC)", "d": "Part of Horizon Europe Pillar 3 (Innovative Europe), ~€10.1bn, supporting breakthrough/scale-up innovation."}], "quiz": [{"type": "mcq", "q": "The Research & Innovation lifecycle is presented along which three needs?", "options": ["Capital, Knowledge and Scale", "Promote, Protect, Partner", "Reduce, Reuse, Recycle", "People, Planet, Profit"], "answer": 0, "source": "Research & innovation lifecycle: CAPITAL / KNOWLEDGE / SCALE.", "concept": "R&I lifecycle"}, {"type": "mcq", "q": "Within Horizon Europe, the European Innovation Council (EIC) sits in which pillar?", "options": ["Pillar 3 – Innovative Europe", "Pillar 1 – Excellent Science", "Pillar 2 – Global Challenges", "It is not in Horizon Europe"], "answer": 0, "source": "PILLAR 3: Innovative Europe, 13.6 — EIC, 10.1.", "concept": "Horizon Europe"}]}, {"id": "m2-chipsact", "module": "m2", "title": "The EU Chips Act — Three Pillars", "blocks": [{"k": "def", "t": "<b>EU Chips Act<\/b>: an EU Regulation that entered into force in <b>September 2023<\/b> — the leitmotiv of the President’s State of the Union address — providing a framework to raise the EU’s production share to <b>20% by 2030<\/b>."}, {"k": "list", "lead": "The three pillars:", "items": ["<b>Pillar 1 — ‘Chips for Europe’ initiative<\/b>: pilot lines for testing advanced chips (incl. quantum); a cloud-based electronic-design-automation (EDA) platform; chips competence centres in MS to boost skills; a <b>Chips Fund<\/b> (3.3 bn EUR from Horizon Europe & Digital Europe Programme, blended under InvestEU & EIC) to catalyse <b>43 bn EUR<\/b> public/private investment by 2030.", "<b>Pillar 2 — Security of supply and resilience<\/b>: FOAK (first-of-a-kind) integrated production facilities (IPF) & open EU foundries (OEF) ‘of public interest’ can access financial aid and admin support (e.g. fast construction permits); Design Centres of Excellence.", "<b>Pillar 3 — Monitoring and crisis response<\/b>: a <b>European Semiconductor Board (ESB)<\/b> supports the Commission in strategic mapping and monitoring (incl. preventive measures if national authorities alert COM); an <b>emergency toolbox<\/b> (QMV in Council) if serious disruptions affect a critical sector: (1) information gathering from firms (enforced with fines); (2) priority-rated orders (last resort, after consulting ESB); (3) common purchasing of crisis-related products."]}], "terms": [{"t": "EU Chips Act", "d": "EU Regulation (in force Sept 2023) to raise the EU chip production share to 20% by 2030; 3 pillars: Chips for Europe; security of supply; monitoring/crisis response."}, {"t": "European Semiconductor Board (ESB)", "d": "Supports the Commission in strategic mapping/monitoring of chips and is consulted before priority-rated orders."}, {"t": "FOAK", "d": "First-of-a-kind facilities (integrated production facilities/open EU foundries) eligible for aid and fast permits under the Chips Act."}], "quiz": [{"type": "blank", "q": "The EU Chips Act aims to raise the EU’s chip production share to ______% by 2030.", "accept": ["20"], "answer": "20", "source": "Framework to raise production share to 20% by 2030.", "concept": "EU Chips Act"}, {"type": "mcq", "q": "When did the EU Chips Act Regulation enter into force?", "options": ["September 2023", "January 2020", "December 2025", "2018"], "answer": 0, "source": "EU Regulation entered into force in Sep 2023.", "concept": "EU Chips Act"}, {"type": "blank", "q": "The Chips Fund provides 3.3 bn EUR aiming to catalyse ______ bn EUR of public/private investment by 2030.", "accept": ["43"], "answer": "43", "source": "Chips Fund: 3.3 bn EUR… to catalyse 43 bn EUR public/private investment by 2030.", "concept": "EU Chips Act"}, {"type": "mcq", "q": "The Chips Act emergency toolbox (Pillar 3) includes all EXCEPT:", "options": ["Nationalising foreign foundries", "Information gathering from firms (enforced with fines)", "Priority-rated orders (last resort)", "Common purchasing of crisis-related products"], "answer": 0, "source": "Emergency toolbox: 1) information gathering (fines); 2) priority-rated orders; 3) common purchasing.", "concept": "EU Chips Act"}]}, {"id": "m2-stateaid", "module": "m2", "title": "Bespoke State Aid & the ‘Chips Subsidies Race’", "blocks": [{"k": "text", "t": "EU state-aid rules allow targeted support for chips <b>R&D<\/b> but not <b>manufacturing<\/b>; moreover, <b>IPCEIs<\/b> are complex and lengthy (up to 3 years) — e.g. the 2nd IPCEI on Microelectronics and Communication Technologies (June 2023)."}, {"k": "quote", "t": "The Chips Act introduced a bespoke State aid approach for chips manufacturing: “Commission recognizes the need for a case-by-case assessment, where public support includes State aid that does not fall under existing guidelines […] may be justified […] up to 100% of a proven funding gap, if such facilities would otherwise not exist in Europe.”"}, {"k": "list", "lead": "Key facts:", "items": ["Criteria: <b>FOAK; cross-border impact; supply security; funding-gap analysis<\/b>.", "Scale of the global race (announced/subsidy programmes): <b>EU ~EUR 100 bn announced<\/b>; <b>US CHIPS and Science Act $53 bn<\/b> (tax incentives, state grants); <b>China $150–200 bn<\/b>; <b>Japan $5 bn<\/b>.", "Direction of travel: towards a <b>Chips Act 2.0 in 2026<\/b>."]}], "terms": [{"t": "IPCEI", "d": "Important Projects of Common European Interest — complex, lengthy (up to 3 years) state-aid vehicles; e.g. 2nd IPCEI on Microelectronics (June 2023)."}, {"t": "Bespoke State aid (chips)", "d": "A case-by-case Chips Act approach allowing aid up to 100% of a proven funding gap for FOAK facilities that would otherwise not exist in Europe."}], "quiz": [{"type": "blank", "q": "Under the Chips Act bespoke State aid approach, support may cover up to ______% of a proven funding gap.", "accept": ["100"], "answer": "100", "source": "…may be justified […] up to 100% of a proven funding gap, if such facilities would otherwise not exist in Europe.", "concept": "State aid"}, {"type": "mcq", "q": "The US CHIPS and Science Act is cited at roughly…", "options": ["$53 bn", "$5 bn", "$150–200 bn", "€100 bn"], "answer": 0, "source": "US CHIPS and Science Act ($53 bn, tax incentives, state grants).", "concept": "Chips subsidies race"}, {"type": "mcq", "q": "EU state-aid rules traditionally allow targeted support for chips R&D but NOT for…", "options": ["manufacturing", "research", "training", "design"], "answer": 0, "source": "EU state aid rules allow targeted support for chips R&D but not manufacturing.", "concept": "State aid"}]}, {"id": "m2-chipswar", "module": "m2", "title": "Security Dimension — the ‘Chips War’", "blocks": [{"k": "principle", "t": "The EU Chips Act is an example of efforts towards a new EU industrial policy for <b>critical tech inputs<\/b> like semiconductors (more domestic capacities & more secure supply from third countries)."}, {"k": "def", "t": "<b>Battle of narratives, offers and models<\/b> (2023 SFR): EU tech sovereignty helps fight a battle on the global stage and is key for security & defence (a stronger Europe in the world) and EU values (a Europe that protects), vis-à-vis: third countries’ propaganda amplified by social media/AI; and third countries’ alternative offers to the EU <b>Global Gateway<\/b> or the <b>Partnership for Global Infrastructure & Investment<\/b> (e.g. China’s <b>Belt and Road Initiative<\/b> and <b>Digital Silk Road<\/b>)."}, {"k": "principle", "t": "Securing critical digital infrastructure matters for global influence and for the <b>‘battle of models’<\/b> between democratic and authoritarian regimes."}], "terms": [{"t": "Battle of narratives, offers and models", "d": "The global contest (2023 SFR) in which EU tech sovereignty competes with third-country propaganda and alternative offers (e.g. Belt and Road)."}, {"t": "Global Gateway", "d": "The EU's connectivity-investment offer, rivalled by China's Belt and Road / Digital Silk Road."}], "quiz": [{"type": "mcq", "q": "The 2023 SFR frames EU tech sovereignty as fighting a 'battle of narratives, offers and…'", "options": ["models", "armies", "currencies", "tariffs"], "answer": 0, "source": "EU tech sovereignty contributes to fighting a battle of narratives, of offers and of models on the global stage (2023 SFR).", "concept": "Chips War"}, {"type": "mcq", "q": "Which Chinese initiatives are cited as alternatives to the EU Global Gateway?", "options": ["Belt and Road Initiative and Digital Silk Road", "CHIPS and Science Act", "Made in China 2025 and AI Act", "BRICS and SCO"], "answer": 0, "source": "…third countries’ alternative offers to the EU Global Gateway… (e.g. Belt and Road Initiative and Digital Silk Road).", "concept": "Global Gateway"}]}, {"id": "m2-econsec", "module": "m2", "title": "Economic Security Strategy — the 3 P’s", "blocks": [{"k": "def", "t": "<b>Economic Security Strategy<\/b> (2023 Communication): a new comprehensive (country-agnostic?) approach to <b>risk management<\/b> built on the <b>3 P’s — promoting<\/b> competitiveness, <b>protecting<\/b> economic security, <b>partnering<\/b> with like-minded countries (…and Preparing?) — to jointly assess and minimise risks related to: supply-chain resilience; physical and cyber security of critical infrastructure; technology security and leakage; and the weaponisation of dependencies and economic coercion."}, {"k": "ex", "t": "Tool-testing & evidence-building (2023-2025): a recommendation lists <b>10 critical technologies<\/b> for risk mitigation and flags <b>4 high-risk areas<\/b> (<b>advanced chips, AI, quantum, biotech<\/b>) for immediate joint risk assessment and evaluation of the need for restrictive measures or support (under <b>STEP<\/b>). Complemented by pilots on FDI screening, export controls and outbound investments."}], "terms": [{"t": "Economic Security Strategy (3 P's)", "d": "2023 risk-management approach: Promoting competitiveness, Protecting economic security, Partnering with like-minded countries (…and Preparing?)."}, {"t": "4 high-risk areas", "d": "Advanced chips, AI, quantum and biotech — flagged for immediate joint risk assessment."}, {"t": "STEP", "d": "Strategic Technologies for Europe Platform — vehicle under which support/restrictive measures for critical tech are evaluated."}], "quiz": [{"type": "mcq", "q": "The Economic Security Strategy's '3 P's' are…", "options": ["Promoting, Protecting, Partnering", "People, Planet, Profit", "Predict, Prevent, Prepare", "Price, Product, Place"], "answer": 0, "source": "3 P’s: promoting competitiveness, protecting economic security, partnering with like-minded countries… and Preparing?", "concept": "Economic Security Strategy"}, {"type": "blank", "q": "The Economic Security Strategy flags 4 high-risk areas: advanced chips, AI, quantum and ______.", "accept": ["biotech", "biotechnology"], "answer": "biotech", "source": "…flags 4 high-risk areas (advanced chips, AI, quantum, biotech).", "concept": "Economic Security Strategy"}, {"type": "blank", "q": "A recommendation lists ______ critical technologies for risk mitigation.", "accept": ["10", "ten"], "answer": "10", "source": "recommendation lists 10 critical technologies for risk mitigation.", "concept": "Economic Security Strategy"}]}, {"id": "m2-doctrine", "module": "m2", "title": "The Economic Security Doctrine (Dec 2025)", "blocks": [{"k": "list", "lead": "Operationalisation with the December 2025 Economic Security Doctrine:", "items": ["<b>Tighter FDI Screening<\/b>: a 2024 Regulation to create conformity in inbound investment screening (minimum sectoral scope, extended targets, all MS with a screening regime).", "<b>Coordination among MS’ export controls<\/b>, against unilateral measures and based on common EU lists (2024 White Paper).", "<b>Outbound Investments screening<\/b>: a 2025 Recommendation to avoid circumvention of export controls and leakage.", "<b>Scale up dual-use / advanced-tech R&D and prevent technology leakage<\/b>: tailoring cross-sector EU programmes to finance it (linking the EU Chips Act with Horizon) and boosting research security vis-à-vis third countries (including a new EU Centre)."]}, {"k": "principle", "t": "The Doctrine makes these standard components of an EU economic-security governance, classified in <b>6 high-risk areas<\/b>, tied to risk thresholds, and thus normalised and scalable."}], "terms": [{"t": "Economic Security Doctrine (Dec 2025)", "d": "Operationalises economic security via FDI screening, export-control coordination, outbound-investment screening and dual-use R&D; 6 high-risk areas tied to risk thresholds."}], "quiz": [{"type": "mcq", "q": "The December 2025 Economic Security Doctrine classifies risks into how many high-risk areas?", "options": ["6", "4", "10", "3"], "answer": 0, "source": "The Doctrine makes these standard components… classified in 6 high-risk area, tied to risk thresholds.", "concept": "Economic Security Doctrine"}, {"type": "mcq", "q": "Which is a pillar of the Economic Security Doctrine?", "options": ["Outbound investment screening (2025 Recommendation)", "A single EU defence budget", "A carbon border tax", "A digital euro"], "answer": 0, "source": "Outbound Investments screening: 2025 Recommendation to avoid circumvention of export controls and leakage.", "concept": "Economic Security Doctrine"}]}, {"id": "m2-infra", "module": "m2", "title": "State-of-the-Art Enablers — Digital Infrastructure", "blocks": [{"k": "def", "t": "<b>Digital Decade Policy Programme (DDPP)<\/b>: a governance framework with <b>targets for 2030<\/b> and a monitoring system with annual reports based on <b>DESI<\/b> (Digital Economy and Society Index). Member States produce <b>2-yearly Digital Decade Roadmaps<\/b> towards the 2030 targets."}, {"k": "list", "lead": "Key instruments:", "items": ["Support to multi-country projects via <b>EU Digital Infrastructure Consortia (EDICs)<\/b>, combining investment from the EU, MS and the private sector (3 set up in 2024).", "<b>Digital Rights & Principles<\/b> (see Module 4).", "The draft <b>Digital Networks Act (DNA — 21/1/26)<\/b> aims to achieve the 2030 Digital Decade targets for digital infrastructure."]}], "terms": [{"t": "Digital Decade Policy Programme (DDPP)", "d": "Governance framework with 2030 targets and DESI-based monitoring; MS produce 2-yearly Digital Decade Roadmaps."}, {"t": "DESI", "d": "Digital Economy and Society Index — the basis for Digital Decade annual monitoring reports."}, {"t": "EDICs", "d": "EU Digital Infrastructure Consortia — vehicles for multi-country projects combining EU, MS and private investment (3 set up in 2024)."}], "quiz": [{"type": "mcq", "q": "The Digital Decade Policy Programme's annual monitoring reports are based on which index?", "options": ["DESI", "DMA", "DSA", "MFF"], "answer": 0, "source": "DDPP: monitoring system with annual reports based on DESI.", "concept": "DDPP"}, {"type": "blank", "q": "Multi-country digital projects are supported via EU Digital Infrastructure Consortia, known by the acronym ______.", "accept": ["EDICs", "EDIC"], "answer": "EDICs", "source": "EU Digital Infrastructure Consortia (EDICs).", "concept": "EDICs"}]}, {"id": "m2-cyber", "module": "m2", "title": "The EU Cybersecurity Acquis", "blocks": [{"k": "list", "lead": "Three pillars of the cybersecurity acquis:", "items": ["<b>NIS2 Directive<\/b>", "<b>Cybersecurity Act<\/b>", "<b>Cyber Resilience Act<\/b> (+ sectoral acts and a cyber-diplomacy toolbox)"]}, {"k": "def", "t": "<b>NIS2<\/b>: a mechanism of EU-wide cooperation on the cyber-security of critical infrastructure (network and information systems for essential and important entities) with harmonised requirements (e.g. cyber-risk management, business continuity, reporting to national authorities) and <b>fines up to 2% of turnover<\/b> otherwise. <b>Essential entities<\/b> include energy, healthcare, public sector, banking, transport, digital infrastructure (and submarine cables under certain conditions). <b>Important entities<\/b> include digital service providers, food production and waste management — a whole-of-supply-chain/systemic approach."}, {"k": "def", "t": "<b>Cyber Resilience Act (CRA)<\/b>: a regulation introducing mandatory cybersecurity requirements for manufacturers throughout the product lifecycle. Compliance (acknowledged via <b>CE marking<\/b>) is required for EU market access (from <b>2027<\/b>) and enforced with fines up to <b>EUR 15 mn or 2.5% of turnover<\/b>."}, {"k": "def", "t": "<b>EU Cybersecurity Act<\/b>: a regulation on a <b>voluntary<\/b> EU cybersecurity certification for products, services and processes. Certificates are recognised in all MS and encourage <b>security-by-design<\/b>, making cross-border trade easier — cybersecurity becomes a competitive advantage for EU industry. It gives a <b>permanent mandate to ENISA<\/b> and creates a new <b>EU Cybersecurity Competence Centre (ECCC) in Bucharest<\/b> to ensure MS synergies."}], "terms": [{"t": "NIS2 Directive", "d": "EU-wide cooperation on cybersecurity of critical infrastructure; harmonised requirements for essential and important entities; fines up to 2% of turnover."}, {"t": "Cyber Resilience Act (CRA)", "d": "Mandatory lifecycle cybersecurity requirements for manufacturers; CE marking; EU market access from 2027; fines up to €15mn or 2.5% turnover."}, {"t": "EU Cybersecurity Act", "d": "Voluntary EU cybersecurity certification scheme; security-by-design; permanent ENISA mandate; ECCC in Bucharest."}, {"t": "ENISA", "d": "The EU Agency for Cybersecurity, given a permanent mandate by the Cybersecurity Act."}], "quiz": [{"type": "mcq", "q": "The three pillars of the EU cybersecurity acquis are…", "options": ["NIS2 Directive, Cybersecurity Act, Cyber Resilience Act", "DSA, DMA, AI Act", "GDPR, ePrivacy, NIS1", "Chips Act, STEP, EDICs"], "answer": 0, "source": "Pillars: (1) NIS2 Directive; (2) Cybersecurity Act; (3) Cyber Resilience Act.", "concept": "Cybersecurity acquis"}, {"type": "mcq", "q": "The Cyber Resilience Act is enforced with fines up to…", "options": ["EUR 15 mn or 2.5% of turnover", "EUR 35 mn or 7% of turnover", "2% of turnover", "EUR 5 mn flat"], "answer": 0, "source": "Cyber Resilience Act… enforced with fines up to EUR 15 mn or 2.5% of turnover.", "concept": "Cyber Resilience Act"}, {"type": "mcq", "q": "The EU Cybersecurity Act sets up a certification scheme that is…", "options": ["voluntary", "mandatory for all products", "limited to defence", "only for banks"], "answer": 0, "source": "EU Cybersecurity Act: Regulation on a voluntary EU cybersecurity certification for products, services, and processes.", "concept": "EU Cybersecurity Act"}, {"type": "blank", "q": "The new EU Cybersecurity Competence Centre (ECCC) is located in ______.", "accept": ["Bucharest"], "answer": "Bucharest", "source": "new EU Cybersecurity Competence Centre (ECCC) in Bucharest to ensure MS’ synergies.", "concept": "ECCC"}, {"type": "mcq", "q": "Under NIS2, which is an 'essential entity'?", "options": ["Energy", "Food production", "Waste management", "Generic digital service providers"], "answer": 0, "source": "Essential entities (e.g., energy, healthcare, public sector, banking, transport, and digital infrastructure).", "concept": "NIS2"}]}, {"id": "m2-cables", "module": "m2", "title": "State-of-the-Art Enablers — Submarine Cables", "blocks": [{"k": "principle", "t": "The EU’s technological sovereignty is challenged by the <b>weaponisation of interdependence<\/b> by third countries, relevant for critical digital infrastructure."}, {"k": "ex", "t": "China’s <b>HMN<\/b> constructed and upgraded undersea cables connecting Member States and Indo-Pacific areas with NATO military bases."}, {"k": "ex", "t": "The US <b>banned Huawei’s equipment<\/b> and prohibited <b>TikTok on government devices<\/b>. In the EU: <b>14 MS have no restrictions<\/b> on high-risk suppliers; only EU institutions and a few MS banned TikTok on government devices."}], "terms": [{"t": "Weaponisation of interdependence", "d": "The use of supply/infrastructure dependencies (e.g. submarine cables) as leverage by third countries; a challenge to EU tech sovereignty."}], "quiz": [{"type": "mcq", "q": "Which company is named as constructing/upgrading undersea cables linking MS and Indo-Pacific areas with NATO bases?", "options": ["China's HMN", "Huawei", "TikTok", "Gaia-X"], "answer": 0, "source": "China’s HMN constructed and upgraded undersea cables connecting MS and Indo-Pacific areas with NATO military bases.", "concept": "Submarine cables"}, {"type": "blank", "q": "On high-risk suppliers, ______ EU Member States have no restrictions.", "accept": ["14"], "answer": "14", "source": "In the EU: 14 MS have no restrictions on high-risk suppliers.", "concept": "Submarine cables"}]}, {"id": "m2-hpc", "module": "m2", "title": "AI Vertical Use Cases — Computing Power (HPC)", "blocks": [{"k": "ex", "t": "The EU has a strong position in <b>high-performance computing (HPC)<\/b> thanks to the <b>EuroHPC Joint Undertaking<\/b>: <b>4 EU supercomputers are in the top 10 worldwide<\/b>."}, {"k": "def", "t": "<b>AI Factories Initiative<\/b>: opens up HPCs to innovative startups to train trustworthy AI models. The EuroHPC Regulation is amended to create <b>AI factories (19 operational across 16 MS)<\/b> and soon the first <b>4–5 AI Gigafactories<\/b> in Europe. EuroHPC acquires and operates HPCs to train large <b>GPAI<\/b> models; facilitates access to public and private users (SMEs); and offers open-source software for innovators in LLMs/algorithms. EU funding, VC & equity (via EIC/InvestEU) for genAI; reskilling & upskilling; and common <b>Data Spaces<\/b> for AI and novel industrial use cases."}, {"k": "text", "t": "The <b>AI Office<\/b> coordinates EU policies on AI and implements the AI Act."}], "terms": [{"t": "EuroHPC Joint Undertaking", "d": "The EU body for high-performance computing; 4 EU supercomputers are in the global top 10; amended to create AI factories."}, {"t": "AI Factories / AI Gigafactories", "d": "AI factories (19 across 16 MS) open HPCs to startups to train trustworthy AI; the first 4–5 AI Gigafactories are planned for Europe."}, {"t": "AI Office", "d": "Coordinates EU AI policies and implements the AI Act."}], "quiz": [{"type": "blank", "q": "Thanks to EuroHPC, ______ EU supercomputers are in the global top 10.", "accept": ["4", "four"], "answer": "4", "source": "4 EU supercomputers are in the top 10 worldwide.", "concept": "EuroHPC"}, {"type": "mcq", "q": "How many AI factories are described as operational, and across how many MS?", "options": ["19 across 16 MS", "4 across 4 MS", "27 across 27 MS", "10 across 5 MS"], "answer": 0, "source": "AI factories (19 operational across 16 MS) and soon the first 4-5 AI Gigafactories in Europe.", "concept": "AI Factories"}, {"type": "mcq", "q": "Which body coordinates EU AI policies and implements the AI Act?", "options": ["The AI Office", "ENISA", "the ECCC", "the European Semiconductor Board"], "answer": 0, "source": "AI office coordinates EU policies on AI & implements AI Act.", "concept": "AI Office"}]}, {"id": "m2-quantum", "module": "m2", "title": "AI Vertical Use Cases — Quantum Computing", "blocks": [{"k": "principle", "t": "Quantum computing will be the <b>next disruptive technological development<\/b> a
