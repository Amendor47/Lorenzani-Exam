nd a <b>test for the EU’s OSA<\/b>."}, {"k": "warn", "t": "Security implications: quantum may <b>break the digital encryption systems<\/b> underpinning security & defence."}, {"k": "ex", "t": "<b>China appears at the forefront<\/b>. The EU is far from having <b>3 quantum computers by 2030<\/b> (a Digital Decade target) but has key strengths: large public capital, excellent skills and a vibrant ecosystem of RTOs/start-ups."}], "terms": [{"t": "Quantum (OSA test)", "d": "The next disruptive technology and a test for EU open strategic autonomy; could break current encryption; China leads, EU lags the 2030 target of 3 quantum computers."}], "quiz": [{"type": "mcq", "q": "Why is quantum computing a security concern in the course?", "options": ["It may break the digital encryption systems underpinning security & defence", "It causes blackouts", "It is radioactive", "It violates the AI Act"], "answer": 0, "source": "Security implications: it may break digital encryption systems underpinning security & Defence.", "concept": "Quantum"}, {"type": "blank", "q": "The Digital Decade target is to have ______ quantum computers by 2030 — a goal the EU is far from.", "accept": ["3", "three"], "answer": "3", "source": "EU is far from having 3 quantum computers by 2030 (DD target).", "concept": "Quantum"}]}, {"id": "m2-cloud", "module": "m2", "title": "AI Vertical Use Cases — Cloud", "blocks": [{"k": "def", "t": "<b>IKEA cloud paradox<\/b>: the EU has <b>lost the cloud market to US hyperscalers<\/b>, against which direct competition is unrealistic. Past initiatives for a European ‘LEGO cloud’ infrastructure (e.g. <b>Gaia-X<\/b>) have disappointed."}, {"k": "principle", "t": "Governments can create space (e.g. via <b>public procurement<\/b>) for EU ‘<b>sovereign cloud<\/b>’ solutions, and developing local <b>edge nodes<\/b> reduces dependence on hyperscalers and ensures data stays in the EU."}, {"k": "ex", "t": "EU <b>data value loss<\/b> is estimated at up to <b>90%<\/b>."}], "terms": [{"t": "IKEA cloud paradox", "d": "The EU has lost the cloud market to US hyperscalers; competing head-on is unrealistic; a 'LEGO cloud' (e.g. Gaia-X) disappointed."}, {"t": "Sovereign cloud / edge nodes", "d": "EU solutions (supported via public procurement) and local edge nodes that reduce hyperscaler dependence and keep data in the EU."}, {"t": "Gaia-X", "d": "A European 'LEGO cloud' infrastructure initiative cited as having disappointed."}], "quiz": [{"type": "mcq", "q": "The 'IKEA cloud paradox' refers to…", "options": ["the EU having lost the cloud market to US hyperscalers (head-on competition unrealistic)", "cheap Swedish data centres", "modular open-source software", "a quantum encryption flaw"], "answer": 0, "source": "EU has lost the cloud market to US hyperscalers against which competition is unrealistic (‘IKEA cloud paradox’).", "concept": "Cloud"}, {"type": "blank", "q": "EU data value loss is estimated at up to ______%.", "accept": ["90"], "answer": "90", "source": "EU data value loss estimated at up to 90%.", "concept": "Cloud"}, {"type": "mcq", "q": "Which initiative for a European 'LEGO cloud' is said to have disappointed?", "options": ["Gaia-X", "EuroHPC", "STEP", "Global Gateway"], "answer": 0, "source": "Past initiatives for a European ‘LEGO cloud’ infrastructure (e.g. Gaia-X) have disappointed.", "concept": "Cloud"}]}, {"id": "m2-takeaways", "module": "m2", "title": "Module 2 — Key Takeaways", "blocks": [{"k": "list", "lead": "The four key takeaways of Module 2:", "items": ["The EU needs a new <b>digital industrial policy focused on open strategic autonomy<\/b>, combining R&I and industrial policies to exit its <b>middle technology trap<\/b>.", "A new digital industrial policy should leverage at the same time <b>investments and regulation<\/b>, with three pillars: (i) <b>technology horizon scanning & economic security<\/b>; (ii) <b>cyber-secure digital infrastructure<\/b>; and (iii) <b>vertical AI use cases<\/b>.", "This strategy has clear <b>geopolitical and security implications<\/b> — contributing to a ‘battle of narratives, offers and models’ on the global stage.", "Regulatory milestones include: (i) the <b>EU Chips Act and Economic Security Strategy<\/b>; (ii) the <b>EU cyber-security framework<\/b>; and (iii) the inter-linked components of the <b>AI Continent Strategy<\/b> (e.g. AI Gigafactories initiative and steps towards an EU cloud/edge)."]}], "terms": [{"t": "AI Continent Strategy", "d": "The umbrella linking AI Gigafactories, EU cloud/edge steps and related initiatives as part of the new digital industrial policy."}], "quiz": [{"type": "mcq", "q": "Module 2's three pillars of a new digital industrial policy are tech horizon scanning & economic security, cyber-secure digital infrastructure and…", "options": ["vertical AI use cases", "a federal budget", "a common army", "a digital euro"], "answer": 0, "source": "Pillars: (i) technology horizon scanning & economic security; (ii) cyber-secure digital infrastructure; and (iii) vertical AI use cases.", "concept": "Module 2 takeaways"}]}, {"id": "m3-intro", "module": "m3", "title": "Module 3 — The EU as a Digital Normative Superpower?", "blocks": [{"k": "def", "t": "<b>Normative power / normative superpower<\/b>: influence based on rules, values and standards rather than military or purely economic coercion. The EU can project power through law by setting binding standards."}, {"k": "def", "t": "<b>Brussels effect<\/b>: the EU’s capacity to shape global markets through regulation, because firms adapt to EU rules and sometimes diffuse those standards beyond Europe."}, {"k": "list", "lead": "The SFRs build the standard-setting case:", "items": ["<b>2021 SFR<\/b>: ensuring a first-mover position in standard setting.", "<b>2022 SFR<\/b>: a strategic approach to influencing international standardisation, e.g. in batteries.", "<b>2023 SFR<\/b>: a transatlantic marketplace, also in digital standards."]}, {"k": "ex", "t": "Digital: pioneering regulations (e.g. the AI Act) for a more human-centric digital transition “have influenced the evolution of the global regulatory framework”. In a global battle of narratives, offers and models, other geo-blocks take assertive standard-setting actions (e.g. <b>China Standards 2035<\/b>), and ‘Digital Empires’ governance models are evolving or fighting for influence."}], "terms": [{"t": "Normative (super)power", "d": "Influence via rules, values and standards rather than military/economic coercion."}, {"t": "Brussels effect", "d": "The EU shapes global markets through regulation because firms adapt to EU rules and diffuse them beyond Europe."}, {"t": "China Standards 2035", "d": "China's assertive standard-setting strategy cited as a rival in the global 'battle of models'."}], "quiz": [{"type": "mcq", "q": "The 'Brussels effect' means…", "options": ["firms adapt to EU rules, diffusing EU standards globally", "the EU copies US regulation", "Brussels' weather affects markets", "the EU bans non-EU firms"], "answer": 0, "source": "Brussels effect: the EU’s capacity to shape global markets through regulation because firms adapt to EU rules and sometimes diffuse those standards beyond Europe.", "concept": "Brussels effect"}, {"type": "mcq", "q": "Which is China's assertive standard-setting strategy cited in the course?", "options": ["China Standards 2035", "Made in China 2025", "Belt and Road 2049", "Digital Silk Road 2030"], "answer": 0, "source": "other geo-blocks are taking assertive standard-setting actions (e.g. China Standards 2035).", "concept": "Standardisation"}]}, {"id": "m3-empires", "module": "m3", "title": "Digital Empires & the Battles for Influence", "blocks": [{"k": "def", "t": "<b>Digital Empires (Anu Bradford)<\/b>: a ‘horizontal battle’ for influence (‘<b>regulatory un-peace<\/b>’) between three governance models. (1) <b>US market-driven model<\/b>: regulation handed over to tech companies to maximise innovation. (2) <b>China’s state-driven model<\/b>: authoritarian control enabled by tech-based tools but open to economic interdependence. (3) <b>EU rights-driven model<\/b>: boosted by economic size."}, {"k": "principle", "t": "There is also a <b>‘vertical battle’<\/b> for influence: <b>governments vs tech giants<\/b>."}, {"k": "text", "t": "Intersections: acquiescence for economic interest; the need for international techno-democratic regulatory cooperation to meet public opinion’s shift away from trust in market self-regulation; and the question of whether the EU is the only credible techno-democratic alternative offer to China’s."}], "terms": [{"t": "Digital Empires", "d": "Anu Bradford's framing of three rival digital-governance models (US market-driven, China state-driven, EU rights-driven)."}, {"t": "Regulatory un-peace", "d": "The horizontal battle for influence between geo-blocks over digital governance."}, {"t": "Horizontal vs vertical battle", "d": "Horizontal = between geo-blocks (US/China/EU models); vertical = governments vs tech giants."}], "quiz": [{"type": "mcq", "q": "In Bradford's 'Digital Empires', the US model is best described as…", "options": ["market-driven (regulation handed to tech companies to maximise innovation)", "rights-driven", "state-driven authoritarian control", "foresight-driven"], "answer": 0, "source": "US market-driven model: regulation handed over to tech companies to maximize innovation.", "concept": "Digital Empires"}, {"type": "mcq", "q": "The EU's governance model in 'Digital Empires' is…", "options": ["rights-driven, boosted by economic size", "market-driven", "state-driven", "defence-driven"], "answer": 0, "source": "EU rights-driven model: boosted by economic size.", "concept": "Digital Empires"}, {"type": "mcq", "q": "The 'vertical battle' for influence is between…", "options": ["governments vs tech giants", "US vs China", "EU vs UK", "regulators vs courts"], "answer": 0, "source": "‘Vertical battle’ for influence governments vs. tech giants.", "concept": "Digital Empires"}]}, {"id": "m3-ttc", "module": "m3", "title": "EU-US Techno-Democratic Regulatory Alliance? (TTC)", "blocks": [{"k": "def", "t": "<b>EU-US Trade and Technology Council (TTC)<\/b>: one of multiplying policy actions to move towards a ‘<b>transatlantic marketplace<\/b>’ — including for digital/tech (half of its working groups)."}, {"k": "list", "lead": "TTC digital/tech work includes:", "items": ["Coordination on the availability of <b>CRMs (critical raw materials)<\/b> for chips under a joint ‘early warning mechanism’.", "Use of digital trade tools to reduce red tape for firms and strengthen common approaches to investment screening and export controls.", "Common principles for <b>trustworthy AI<\/b>."]}, {"k": "text", "t": "Despite current uncertainties, there is a case for more transatlantic regulatory compatibility: EITHER as a <b>veneer<\/b> motivated by economic interest (e.g. transatlantic personal data flows); OR as <b>true co-regulatory convergence<\/b> in digital standardisation (as a ‘functional superpower’)."}], "terms": [{"t": "EU-US TTC", "d": "Trade and Technology Council moving towards a 'transatlantic marketplace'; ~half its working groups are digital/tech."}, {"t": "Functional superpower", "d": "The EU achieving influence through true co-regulatory convergence in digital standardisation."}], "quiz": [{"type": "mcq", "q": "The EU-US TTC works towards a…", "options": ["'transatlantic marketplace'", "'common army'", "'digital euro'", "'single Atlantic state'"], "answer": 0, "source": "EU-US TTC as one of multiplying policy actions to move towards a “transatlantic marketplace”.", "concept": "TTC"}, {"type": "mcq", "q": "Which is one of the TTC's digital/tech work areas?", "options": ["Common principles for trustworthy AI", "A common corporate tax", "A shared central bank", "Joint nuclear deterrent"], "answer": 0, "source": "Common principles for trustworthy AI.", "concept": "TTC"}]}, {"id": "m3-tools", "module": "m3", "title": "Linking Foresight & Regulation — Agile Regulatory Tools", "blocks": [{"k": "def", "t": "Andrea Renda maps regulatory tools by phase of the ‘<b>policy cycle<\/b>’ (with maturity, government-capacity requirements and innovation impact)."}, {"k": "list", "lead": "Tools by policy-cycle phase (Renda, CEPS):", "items": ["<b>Agenda-setting<\/b>: crowdsourcing priorities; horizon scanning & strategic foresight; transition pathways and backcasting.", "<b>Regulatory<\/b>: self- and co-regulation & outcome-based regulation; <b>regulatory sandboxes<\/b> (+ testbeds, policy experiments, innovation deals/hubs); tech sprints and regulatory hackathons.", "<b>Implementation/enforcement<\/b>: regulatory guidance to support compliance; <b>RegTech and SupTech<\/b>, predictive analytics; innovation hubs."]}, {"k": "def", "t": "<b>Regulatory sandbox<\/b>: a controlled scheme (under an ‘experimentation clause’) where applicants are screened and tested; results are evaluated for suitability, scalability, representativeness and reliability before deployment/authorisation (or the sandbox ‘fails’)."}], "terms": [{"t": "Regulatory sandbox", "d": "A controlled testing scheme under an experimentation clause; screens applicants, evaluates results before authorisation."}, {"t": "RegTech / SupTech", "d": "Technology for regulatory compliance (RegTech) and supervision (SupTech), used in implementation/enforcement."}, {"t": "Backcasting", "d": "An agenda-setting foresight tool working backwards from a desired future via transition pathways."}], "quiz": [{"type": "mcq", "q": "Regulatory sandboxes, tech sprints and co-regulation belong to which policy-cycle phase?", "options": ["Regulatory", "Agenda-setting", "Implementation/enforcement", "Adjudication"], "answer": 0, "source": "Regulatory: self- and co-regulation; regulatory sandboxes; tech sprints and regulatory hackathons.", "concept": "Agile regulation"}, {"type": "mcq", "q": "Which author maps the regulatory tools by phase of the policy cycle?", "options": ["Andrea Renda (CEPS)", "Anu Bradford", "Mario Draghi", "Federico Fabbrini"], "answer": 0, "source": "Source: Andrea Renda, CEPS (forthcoming).", "concept": "Agile regulation"}]}, {"id": "m3-banking", "module": "m3", "title": "Example of a Regulatory Sandbox — Open Banking", "blocks": [{"k": "ex", "t": "The <b>UK’s sandbox for open banking<\/b> was launched in <b>2016 by the Financial Conduct Authority (FCA)<\/b> — one of the first of its kind globally."}, {"k": "ex", "t": "Many tested solutions went to market (e.g. Open Banking apps) and other jurisdictions adopted a similar model based on the UK (and the EU’s <b>PSD2<\/b>) experience."}, {"k": "text", "t": "Process flow: an experimentation clause → sandbox screening of applicants → evaluation (suitability, scalability, representativeness, reliability) → if results are sufficiently robust and positive and residual risks are managed with real-world safeguards, the firm exits to authorisation/deployment; otherwise the application is rejected or the sandbox ‘failed’."}], "terms": [{"t": "Open banking sandbox", "d": "The UK FCA's 2016 sandbox (one of the first globally); influenced other jurisdictions alongside the EU's PSD2."}, {"t": "PSD2", "d": "The EU's revised Payment Services Directive, part of the open-banking experience referenced in the sandbox example."}], "quiz": [{"type": "blank", "q": "The UK open-banking sandbox was launched in 2016 by the Financial Conduct Authority (acronym ______).", "accept": ["FCA"], "answer": "FCA", "source": "UK’s sandbox for open banking launched in 2016 by the Financial Conduct Authority (FCA).", "concept": "Open banking sandbox"}, {"type": "mcq", "q": "The open-banking model spread based on the UK experience and the EU's…", "options": ["PSD2", "GDPR", "AI Act", "DMA"], "answer": 0, "source": "other jurisdictions adopted a similar model based on the UK (and the EU’s PSD2) experience.", "concept": "Open banking sandbox"}]}, {"id": "m3-aiact1", "module": "m3", "title": "The AI Act — Normative Superpower in Digital?", "blocks": [{"k": "def", "t": "<b>AI Act<\/b>: the world’s <b>first horizontal regulation on AI<\/b> — a common binding framework for the use & supply of AI systems in the EU; <b>Regulation (EU) 2024/1689<\/b>. A clear example of a <b>rights-based normative superpower<\/b> (with echoes in the US, China, UK and beyond)."}, {"k": "principle", "t": "It is largely a <b>risk-based and precautionary<\/b> approach, but offers good examples of <b>agile / experimental / adaptive regulation<\/b>: co-regulation, compulsory regulatory sandboxes, and guidance for compliance."}, {"k": "ex", "t": "The <b>AI Pact<\/b> seeks industry’s voluntary pledges to anticipate AI Act provisions (<b>over 100 in Sep 2024<\/b>; <b>over 230 in Jan 2026<\/b>); voluntary codes of conduct for non-high-risk AI systems; EU harmonised standards for presumption of conformity; and pilot sandboxes in the MS since <b>2022 (ES — Spain)<\/b>."}], "terms": [{"t": "AI Act", "d": "World's first horizontal AI regulation, Regulation (EU) 2024/1689; rights-based, risk-based, with agile tools (sandboxes, codes, guidance)."}, {"t": "AI Pact", "d": "Voluntary industry pledges to anticipate AI Act provisions (100+ in Sep 2024, 230+ in Jan 2026)."}], "quiz": [{"type": "mcq", "q": "The AI Act is notable as…", "options": ["the world's first horizontal regulation on AI", "a voluntary code only", "a US federal law", "a sectoral medical-device rule"], "answer": 0, "source": "World’s first horizontal regulation on AI: common binding framework for use & supply of AI systems in EU.", "concept": "AI Act"}, {"type": "blank", "q": "The AI Act's official citation is Regulation (EU) 2024/______.", "accept": ["1689"], "answer": "1689", "source": "Artificial Intelligence Act, Regulation (EU) 2024/1689.", "concept": "AI Act"}, {"type": "mcq", "q": "Pilot AI regulatory sandboxes have run in Member States since 2022, starting in…", "options": ["Spain (ES)", "France", "Germany", "Italy"], "answer": 0, "source": "pilot sandboxes in the MS since 2022 (ES).", "concept": "AI Act"}]}, {"id": "m3-aiact2", "module": "m3", "title": "The AI Act — Risk-Based Architecture", "blocks": [{"k": "principle", "t": "The AI Act applies to all providers placing AI systems and GPAI models on the EU market (with exceptions such as military)."}, {"k": "def", "t": "<b>Risk-based approach<\/b>: a <b>ban for 8 unacceptable-risk<\/b> systems; strong requirements (e.g. <b>conformity assessment<\/b>) on <b>high-risk<\/b> ones; <b>transparency obligations<\/b> on <b>low-risk<\/b> ones; and <b>minimal obligations<\/b> otherwise."}, {"k": "text", "t": "Enforcement is <b>phased<\/b>, with an attempt to move it forward via the AI Pact with firms. There are special provisions for <b>GPAI models<\/b> (presumption of conformity via standards), and <b>regulatory sandboxes are mandated at MS level<\/b> to test innovative solutions."}], "terms": [{"t": "AI Act risk tiers", "d": "Unacceptable (8 banned), high-risk (conformity assessment), low-risk (transparency), minimal (minimal obligations)."}, {"t": "Conformity assessment", "d": "The strong compliance requirement imposed on high-risk AI systems."}], "quiz": [{"type": "blank", "q": "The AI Act bans how many 'unacceptable-risk' AI practices? ______", "accept": ["8", "eight"], "answer": "8", "source": "Risk-based approach: ban for 8 unacceptable-risk ones.", "concept": "AI Act"}, {"type": "mcq", "q": "High-risk AI systems under the AI Act face mainly…", "options": ["strong requirements such as conformity assessment", "an outright ban", "only transparency obligations", "no obligations"], "answer": 0, "source": "strong requirements (e.g. conformity assessment) on high-risk ones.", "concept": "AI Act"}, {"type": "mcq", "q": "Low-risk AI systems are subject mainly to…", "options": ["transparency obligations", "a ban", "conformity assessment", "fines of 7%"], "answer": 0, "source": "transparency obligations on low-risk ones; minimal obligations otherwise.", "concept": "AI Act"}]}, {"id": "m3-aiact3", "module": "m3", "title": "The AI Act — GPAI, Sandboxing & Governance", "blocks": [{"k": "list", "lead": "General-purpose AI (GPAI) models:", "items": ["Vast <b>transparency requirements for all GPAI models<\/b>.", "Special provisions for GPAI models with <b>high-impact capabilities<\/b> (presumption of posing <b>systemic risks<\/b>): notification, risk assessment and mitigation.", "<b>Codes of practice<\/b> by the Commission and presumption of conformity for compliance with EU harmonised standards (agile regulation)."]}, {"k": "list", "lead": "Sandboxing:", "items": ["National authorities must establish <b>at least one regulatory sandbox<\/b> at national level to facilitate development and testing of innovative AI systems.", "Prospective providers of high-risk AI systems may test them in advance in <b>real-world conditions<\/b> if they respect guarantees (e.g. asking for consent)."]}, {"k": "def", "t": "<b>Governance & fines<\/b>: MS must designate at least a <b>market surveillance authority<\/b> and a <b>notifying authority<\/b>. Fines up to <b>EUR 35 million or 7% of total worldwide annual turnover<\/b> (whichever is higher) for infringements on prohibited practices or non-compliance on data (lower fines for smaller companies). EU-level actors: the Commission (implementing/delegated acts, oversight of standardisation), the <b>AI Board<\/b>, the <b>AI Office<\/b> and EU standardisation bodies."}, {"k": "warn", "t": "The <b>2025 Digital Omnibus<\/b> (under negotiation) extends compliance deadlines: currently <b>02/12/27<\/b> for listed high-risk AI systems (e.g. employment, law enforcement, education) and <b>02/12/28<\/b> for AI systems embedded in regulated products (e.g. medical devices, machinery)."}], "terms": [{"t": "GPAI models", "d": "General-purpose AI models; all face transparency requirements; high-impact ones presumed to pose systemic risks (notification, risk assessment, mitigation)."}, {"t": "AI Act fines", "d": "Up to EUR 35 million or 7% of total worldwide annual turnover (whichever higher) for the gravest infringements."}, {"t": "Digital Omnibus (2025)", "d": "Under negotiation; extends AI Act compliance deadlines (02/12/27 for listed high-risk; 02/12/28 for AI in regulated products)."}], "quiz": [{"type": "mcq", "q": "The maximum AI Act fine for the gravest infringements is…", "options": ["EUR 35 million or 7% of worldwide annual turnover", "EUR 15 million or 2.5% of turnover", "2% of turnover", "EUR 20 million flat"], "answer": 0, "source": "Imposition of fines up to EUR 35 million or 7% of total worldwide annual turnover (whichever the higher).", "concept": "AI Act fines"}, {"type": "mcq", "q": "Under the AI Act, national authorities must establish at least one…", "options": ["regulatory sandbox", "AI ministry", "data centre", "supercomputer"], "answer": 0, "source": "National authorities must establish at least one regulatory sandbox at national level.", "concept": "AI Act"}, {"type": "mcq", "q": "GPAI models with high-impact capabilities are presumed to pose…", "options": ["systemic risks", "no risk", "unacceptable risk (banned)", "only transparency risk"], "answer": 0, "source": "Special provisions for GPAI models with high-impact capabilities (presumption of posing system risks).", "concept": "GPAI"}, {"type": "mcq", "q": "Which two authorities must each MS designate to enforce the AI Act?", "options": ["A market surveillance authority and a notifying authority", "A central bank and a court", "A data protection authority and a tax office", "An AI Office and an AI Board"], "answer": 0, "source": "MS must designate at least a market surveillance authority and a notifying authority to ensure enforcement.", "concept": "AI Act governance"}]}, {"id": "m3-takeaways", "module": "m3", "title": "Module 3 — Key Takeaways", "blocks": [{"k": "list", "lead": "The key takeaways of Module 3:", "items": ["Key digital regulation across the ‘pillars’ of the <b>Digital Single Market<\/b> (AI Act, DMA, DSA, etc.) is an area where the EU can still claim a <b>‘normative superpower’<\/b> status — e.g. via standardisation practices contributing to ‘<b>functional<\/b>’ sovereignty (and thus OSA) within the Digital Empires’ horizontal and vertical battles for influence.", "Despite large and persistent regulatory divergences, moving towards a ‘<b>digital transatlantic marketplace<\/b>’ via more EU-US (and beyond) regulatory compatibility and cooperation would respond to such geo-economic interests.", "<b>Agile regulatory tools<\/b> — including strategic foresight and private-sector involvement (co-regulation, standardisation, regulatory sandboxes) — also contribute to these strategic goals and are part of a new digital industrial policy."]}], "terms": [{"t": "Digital Single Market", "d": "The EU project of integrating digital markets, reducing fragmentation and creating common rules for online services and digital business."}], "quiz": [{"type": "mcq", "q": "Module 3 argues the EU can claim 'normative superpower' status especially through…", "options": ["standardisation practices contributing to functional sovereignty", "military build-up", "currency devaluation", "withdrawing from global trade"], "answer": 0, "source": "…via standardization practices contributing to a “functional” sovereignty and thus open strategic autonomy.", "concept": "Module 3 takeaways"}]}, {"id": "m4-intro", "module": "m4", "title": "Module 4 — Dynamic Coherence of the Digital with the Green/Fair Transition", "blocks": [{"k": "text", "t": "Module 4: the <b>dynamic coherence<\/b> of the digital transition with the green/fair transition — pairing, as in the SFRs, a JRC ‘Science for Policy Report’ with a Commission Communication."}, {"k": "principle", "t": "Core question: can the digital transition <b>reinforce<\/b> the green and fair transitions rather than undermine them? Dynamic coherence asks whether policy can manage these interdependencies <b>over time<\/b>."}], "terms": [{"t": "Twinning (green-digital)", "d": "The combined green and digital transition; managing synergies and trade-offs between them over time."}], "quiz": [{"type": "mcq", "q": "Module 4's central concept for managing green-digital interdependencies over time is…", "options": ["dynamic (policy) coherence", "the Brussels effect", "the middle technology trap", "the 3 P's"], "answer": 0, "source": "Dynamic coherence asks whether policy can manage these interdependencies over time.", "concept": "Module 4"}]}, {"id": "m4-trilemma", "module": "m4", "title": "Solving the EU’s Industrial-Policy Trilemma", "blocks": [{"k": "def", "t": "<b>Industrial-policy trilemma<\/b> (Renda, 2024): the tension between <b>competitiveness, decarbonisation and economic security<\/b> — and, adding <b>fairness<\/b>, a <b>quadrilemma<\/b> — that industrial policy must manage."}, {"k": "principle", "t": "Digitalisation can help <b>solve / assuage<\/b> the trilemma/quadrilemma by exploiting synergies and reducing trade-offs across these overlapping (and sometimes competing) goals."}], "terms": [{"t": "Industrial-policy trilemma/quadrilemma", "d": "The tension between competitiveness, decarbonisation, economic security (trilemma) plus fairness (quadrilemma) that industrial policy must manage (Renda, 2024)."}], "quiz": [{"type": "mcq", "q": "The industrial-policy trilemma (Renda) is between competitiveness, decarbonisation and…", "options": ["economic security", "migration", "monetary policy", "agriculture"], "answer": 0, "source": "Solving the EU’s industrial policy trilemma… competitiveness and decarbonization (Source: Andrea Renda, 2024).", "concept": "Trilemma"}, {"type": "blank", "q": "Adding fairness turns the industrial-policy trilemma into a ______.", "accept": ["quadrilemma"], "answer": "quadrilemma", "source": "industrial policy trilemma / quadrilemma between economic security, competitiveness and decarbonization, plus fairness.", "concept": "Quadrilemma"}]}, {"id": "m4-2022sfr", "module": "m4", "title": "2022 SFR — Tech Factors to Assuage Trade-offs", "blocks": [{"k": "ex", "t": "The 2022 SFR identifies digital technology factors to assuage green-digital trade-offs, including: <b>digital technologies for sustainable farming<\/b>; environmental monitoring systems; reduced demand for space; building design and redesign; self-organised <b>microgrids<\/b> & grid-based governance of the e-system; <b>energy-as-a-service<\/b>; materials optimisation (via AI); materials and wastes tracing; <b>Mobility as a Service (MaaS)/Transport as a Service (TaaS)<\/b>; and <b>digital twins<\/b>."}], "terms": [{"t": "Mobility/Transport as a Service (MaaS/TaaS)", "d": "Digital-enabled mobility models identified by the 2022 SFR to assuage green-digital trade-offs."}], "quiz": [{"type": "mcq", "q": "Which is a 2022 SFR tech factor to assuage green-digital trade-offs?", "options": ["Mobility as a Service (MaaS)", "Quantitative easing", "Carbon border tax", "A common EU army"], "answer": 0, "source": "2022 SFR: tech factors… Mobility as a Service (MaaS)/Transport as a Service (TaaS); digital twins; energy-as-a-service.", "concept": "2022 SFR"}]}, {"id": "m4-twinning2050", "module": "m4", "title": "Twinning by 2050 — a Scenario-Based Approach", "blocks": [{"k": "principle", "t": "Understanding forward-looking interplays between the digital and green/fair transition can <b>reduce trade-offs<\/b> and <b>maximise synergies<\/b>."}, {"k": "ex", "t": "Key figures: <b>ICT is responsible for 7%–9% of global electricity use<\/b> (a trade-off); <b>AI-based systems could reduce global emissions by 4%<\/b> (a synergy)."}, {"k": "def", "t": "The <b>JRC built 4 scenarios of a sustainable Europe in 2050<\/b> along <b>2 axes<\/b>: <b>societal behaviour<\/b> (individualistic vs collaborative) and <b>policy mix<\/b> (less vs more supportive of sustainability)."}, {"k": "ex", "t": "Equity dimension: the analysis covers green and social factors — e.g. the <b>richest decile emits 3 times more per capita<\/b> than all other citizens."}], "terms": [{"t": "4 scenarios for 2050", "d": "JRC scenarios of a sustainable Europe in 2050 along two axes: societal behaviour (individualistic vs collaborative) and policy mix (less vs more supportive of sustainability)."}], "quiz": [{"type": "blank", "q": "ICT is responsible for ______ of global electricity use (a trade-off the SFR highlights).", "accept": ["7%-9%", "7-9%", "7%–9%", "7 to 9%", "7%‑9%"], "answer": "7%–9%", "source": "ICT responsible of 7%-9% of global electricity use.", "concept": "Twinning by 2050"}, {"type": "blank", "q": "AI-based systems could reduce global emissions by ______ (a synergy).", "accept": ["4%", "4"], "answer": "4%", "source": "AI-based systems could reduce global emissions by 4%.", "concept": "Twinning by 2050"}, {"type": "mcq", "q": "The JRC's 4 scenarios for 2050 vary along which two axes?", "options": ["Societal behaviour (individualistic vs collaborative) and policy mix (less vs more supportive of sustainability)", "Rich vs poor and old vs young", "Digital vs analogue and urban vs rural", "Openness vs autonomy and risk vs reward"], "answer": 0, "source": "JRC built 4 scenarios… along 2 axis: societal behavior (individualistic vs. collaborative) and policy mix (less vs. more supportive of sustainability).", "concept": "Twinning by 2050"}, {"type": "blank", "q": "On equity, the richest decile emits ______ times more per capita than all other citizens.", "accept": ["3", "three"], "answer": "3", "source": "the richest decile emits 3 times more per capita than all other citizens.", "concept": "Twinning by 2050"}]}, {"id": "m4-pathways", "module": "m4", "title": "From Scenarios to Policy Pathways", "blocks": [{"k": "def", "t": "<b>Green business boom<\/b>: change is primarily driven by the market and by innovation. As resource costs surge, corporations decouple profits from resource consumption — engaging in the circular economy, renewable energies and sustainable bio-economy. Innovation accelerates market opportunities for sustainable business models (enabled by new digital techs), so the economy promotes sustainable behaviour while generating added value. This movement is global, as geopolitical conflicts in the 2020s generated a strong pushback."}, {"k": "def", "t": "<b>Glocal eco-world<\/b>: policymakers failed to respond effectively to the major havoc brought by climate change, forcing people to adapt to more difficult circumstances. Society shifts to a new paradigm: people (re)discover the value of human relationships, connections, community help and the possibility of a dignified life with lower levels of material prosperity."}], "terms": [{"t": "Green business boom", "d": "A 2050 scenario where market + innovation decouple profits from resource use (circular economy, renewables, bio-economy)."}, {"t": "Glocal eco-world", "d": "A 2050 scenario where, after failed policy responses to climate havoc, society adapts with lower material prosperity but stronger human relationships and community."}], "quiz": [{"type": "mcq", "q": "In the 'Green business boom' scenario, change is primarily driven by…", "options": ["the market and by innovation", "the state and regulation", "community self-help", "international treaties"], "answer": 0, "source": "Green business boom: change is primarily driven by the market and by innovation.", "concept": "Scenarios"}, {"type": "mcq", "q": "The 'Glocal eco-world' scenario arises because…", "options": ["policymakers failed to respond effectively to climate change", "innovation decoupled profits from resources", "the EU achieved full autonomy", "AI reduced emissions by 4%"], "answer": 0, "source": "Glocal eco-world: policymakers failed to respond effectively to the major havoc brought by climate change.", "concept": "Scenarios"}]}, {"id": "m4-industry5", "module": "m4", "title": "Industry 5.0 & Society 5.0", "blocks": [{"k": "def", "t": "<b>Industry 5.0<\/b>: an approach that links industrial transformation with <b>human-centricity, sustainability and resilience<\/b> — (digital) technologies for the SDGs."}, {"k": "def", "t": "<b>Society 5.0<\/b>: a ‘super-smart industrial transformation and society’ combining broad societal goals like the <b>SDGs<\/b> with new technologies. Innovation is useful as it enables addressing global societal challenges."}], "terms": [{"t": "Industry 5.0", "d": "Links industrial transformation with human-centricity, sustainability and resilience."}, {"t": "Society 5.0", "d": "A 'super-smart' society combining societal goals (SDGs) with new technologies."}], "quiz": [{"type": "mcq", "q": "Industry 5.0 links industrial transformation with…", "options": ["human-centricity, sustainability and resilience", "automation, profit and scale", "defence, security and autonomy", "tax, trade and fiscal policy"], "answer": 0, "source": "Industry 5.0: An approach that links industrial transformation with human-centricity, sustainability and resilience.", "concept": "Industry 5.0"}, {"type": "mcq", "q": "'Society 5.0' is defined as a super-smart transformation combining new technologies with…", "options": ["broad societal goals like the SDGs", "military objectives", "monetary union", "the Brussels effect"], "answer": 0, "source": "Society 5.0: ‘super smart industrial transformation and society’ combining broad societal goals like SDGs with new technologies.", "concept": "Society 5.0"}]}, {"id": "m4-health", "module": "m4", "title": "Example — AI in Healthcare", "blocks": [{"k": "ex", "t": "AI has a key ‘vertical’ application to healthcare throughout the lifecycle of medicinal products: (1) speeding up (efficiency gains) the discovery of novel compounds with potential medicinal applications; (2) rapidly identifying patients for phase III clinical trials; (3) personalising therapies & optimising treatment plans."}, {"k": "ex", "t": "Key use case for COVID-19 vaccines: the EU-funded project <b>Exscalate<\/b> used HPC to screen molecules."}, {"k": "list", "lead": "Advantages of HPC & AI to accelerate drug discovery (down from the current 9.1 years for clinical development):", "items": ["More effective patent protection (and a larger market).", "Large cost savings (up to <b>50%<\/b>) with some pass-through."]}], "terms": [{"t": "Exscalate", "d": "EU-funded project that used HPC to screen molecules — a key AI/HPC use case for COVID-19 vaccines."}], "quiz": [{"type": "mcq", "q": "Which EU-funded project used HPC to screen molecules for COVID-19 vaccines?", "options": ["Exscalate", "EuroHPC", "Gaia-X", "FUTURINNOV"], "answer": 0, "source": "Key use case for COVID-19 vaccines (EU-funded project Exscalate used HPC to screen molecules).", "concept": "AI in healthcare"}, {"type": "blank", "q": "HPC & AI can deliver large cost savings of up to ______% in drug discovery.", "accept": ["50"], "answer": "50", "source": "Large cost savings (up to 50%) with some pass-through.", "concept": "AI in healthcare"}, {"type": "blank", "q": "Current clinical development takes about ______ years, which AI/HPC aim to shorten.", "accept": ["9.1"], "answer": "9.1", "source": "(down from current 9.1 years for clinical development).", "concept": "AI in healthcare"}]}, {"id": "m4-jobs", "module": "m4", "title": "The Technology/Jobs Puzzle", "blocks": [{"k": "def", "t": "<b>Technology/jobs puzzle<\/b>: the AI revolution will transform the job market — but will it lead to job loss? Productivity growth and job expansion could be another outcome (example: preventive medicine), but how to achieve it? The issue is <b>not only numerical<\/b>: policymakers should create ‘<b>good jobs<\/b>’ in ‘<b>good sectors<\/b>’."}, {"k": "principle", "t": "<b>Skills foresight<\/b> across key industrial ecosystems can empower workers along the digital transition and boost innovation — e.g. <b>Industry 5.0, the Pact for Skills, the Alliance for Apprenticeships, the New Innovation Agenda, Deep Tech Talent Initiatives, Net-Zero Academies<\/b>."}, {"k": "list", "lead": "Recommendations:", "items": ["Industrial policy meets (skills) foresight to veer towards the creation of needed skills in sectors deemed strategic.", "A common space for skills as part of a digital transatlantic (or transpacific) marketplace."]}], "terms": [{"t": "Technology/jobs puzzle", "d": "Whether the AI revolution causes job loss or job expansion; the goal is 'good jobs' in 'good sectors' via skills foresight (Renda, Balland, Bosoer 2023)."}, {"t": "Skills foresight", "d": "Anticipating skills needs across industrial ecosystems to empower workers and boost innovation."}], "quiz": [{"type": "mcq", "q": "The technology/jobs puzzle stresses creating…", "options": ["'good jobs' in 'good sectors'", "more low-wage jobs", "fewer regulations", "a universal basic income"], "answer": 0, "source": "policymakers should tackle the technology / jobs puzzle and create ‘good jobs’ in ‘good sectors’.", "concept": "Technology/jobs puzzle"}, {"type": "mcq", "q": "Which is cited as a skills-foresight instrument?", "options": ["Pact for Skills", "Chips Act", "DMA", "Global Gateway"], "answer": 0, "source": "…(e.g. Industry 5.0, Pact for Skills, Alliance for Apprenticeships, New Innovation Agenda, Deep Tech Talent Initiatives, Net-Zero Academies).", "concept": "Skills foresight"}]}, {"id": "m4-skills", "module": "m4", "title": "Digital Skills — the Digital Decade Targets", "blocks": [{"k": "ex", "t": "<b>42-44% of Europeans do not have basic digital skills<\/b> (particularly older people and rural areas), hampering everyday tasks and access to online services — this means <b>less than 70%<\/b>, against the <b>2030 target of 80%<\/b>."}, {"k": "principle", "t": "The skills gap (by age, gender, education, urbanisation) is large and varies across Member States."}, {"k": "ex", "t": "<b>ICT specialists<\/b> in the EU (<b>81% of which are male<\/b>) increased by <b>57.8% in 2012-2022<\/b> but are still flagged as insufficient by <b>85% of EU firms<\/b>. The status quo would mean just <b>12 million ICT specialists by 2030<\/b> — well below the <b>20 million<\/b> Digital Decade target."}], "terms": [{"t": "Digital Decade skills targets", "d": "80% of people with basic digital skills and 20 million ICT specialists by 2030; the EU currently lags both."}], "quiz": [{"type": "blank", "q": "The Digital Decade target is for ______% of people to have basic digital skills by 2030.", "accept": ["80"], "answer": "80", "source": "less than 70% of the 2030 target of 80%.", "concept": "Digital skills"}, {"type": "blank", "q": "The Digital Decade target is ______ million ICT specialists by 2030.", "accept": ["20", "20 million", "twenty"], "answer": "20", "source": "well below the 20 million DD target.", "concept": "Digital skills"}, {"type": "mcq", "q": "What share of Europeans lack basic digital skills?", "options": ["42-44%", "12%", "80%", "57.8%"], "answer": 0, "source": "42-44% of Europeans do not have basic digital skills.", "concept": "Digital skills"}]}, {"id": "m4-gig", "module": "m4", "title": "A New EU Social Contract — Gig Workers", "blocks": [{"k": "ex", "t": "The gig economy and platform work are rising: <b>28 mn gig workers in 2022<\/b>, <b>43 mn in 2025<\/b>."}, {"k": "warn", "t": "Issue: <b>93% (26 mn)<\/b> of workers are classified as <b>self-employed<\/b>, not entitled to the same rights & protection as employees. Around <b>5 million (19%)<\/b> are likely to be incorrectly classified."}, {"k": "def", "t": "The EU is the <b>1st legislator in the world to regulate platform work<\/b>: the Council adopted the <b>Platform Work Directive in October 2024<\/b>. Member States have <b>2 years to transpose<\/b> it. It (1) helps determine the correct employment status & social protection (self-employed vs employees); and (2) establishes rules on the use of <b>algorithms in the workplace<\/b> and related transparency safeguards."}], "terms": [{"t": "Platform Work Directive", "d": "Adopted by the Council in October 2024; the EU is the first legislator worldwide to regulate platform work; MS have 2 years to transpose."}], "quiz": [{"type": "blank", "q": "Gig workers rose from 28 mn in 2022 to ______ mn in 2025.", "accept": ["43"], "answer": "43", "source": "28 mn gig workers in 2022, 43 mn in 2025.", "concept": "Gig workers"}, {"type": "blank", "q": "______% of gig workers (26 mn) are classified as self-employed.", "accept": ["93"], "answer": "93", "source": "93% (26 mn) of workers are classified as self-employed.", "concept": "Gig workers"}, {"type": "mcq", "q": "The Platform Work Directive was adopted by the Council in…", "options": ["October 2024", "September 2021", "December 2025", "January 2020"], "answer": 0, "source": "the Council adopted the Platform Work Directive in October 2024.", "concept": "Platform Work Directive"}, {"type": "mcq", "q": "How long do Member States have to transpose the Platform Work Directive?", "options": ["2 years", "6 months", "5 years", "immediately"], "answer": 0, "source": "Member States have 2 years to transpose this Directive into national law.", "concept": "Platform Work Directive"}]}, {"id": "m4-gig2", "module": "m4", "title": "Platform Work Directive — Mechanisms", "blocks": [{"k": "list", "lead": "The Directive's mechanisms:", "items": ["A <b>rebuttable legal presumption of employment relationship<\/b> based on control/direction elements in national law or collective agreement in force, with modalities set out by each Member State.", "<b>Use of algorithms in the workplace<\/b>: workers to be informed about automated monitoring & decision-making; personal data protected; <b>human oversight at least for significant decisions<\/b>.", "<b>Enforcement of transparency & traceability<\/b>: platforms to declare work to national authorities (including cross-border)."]}, {"k": "warn", "t": "The debate on <b>control triggers<\/b> is complex: sometimes platforms’ rate control is to the workers’ advantage or to users’ benefit (certainty)."}], "terms": [{"t": "Rebuttable presumption of employment", "d": "The Platform Work Directive's mechanism: workers presumed employees based on control/direction elements, unless rebutted; modalities set by each MS."}], "quiz": [{"type": "mcq", "q": "The Platform Work Directive introduces a 'rebuttable legal presumption' of…", "options": ["an employment relationship (based on control/direction)", "self-employment", "tax residence", "data ownership"], "answer": 0, "source": "Rebuttable legal presumption of employment relationship based on control / direction elements.", "concept": "Platform Work Directive"}, {"type": "mcq", "q": "On workplace algorithms, the Directive requires human oversight…", "options": ["at least for significant decisions", "for no decisions", "for all decisions without exception", "only on weekends"], "answer": 0, "source": "human oversight at least for significant decision.", "concept": "Platform Work Directive"}]}, {"id": "m4-takeaways", "module": "m4", "title": "Module 4 — Key Takeaways", "blocks": [{"k": "list", "lead": "The four key takeaways of Module 4:", "items": ["Digitalisation can help <b>solve the industrial-policy trilemma/quadrilemma<\/b> between economic security, competitiveness and decarbonisation, <b>plus fairness<\/b>, as overlapping (and sometimes competing) goals.", "<b>Twinning mainstreaming<\/b> is evident across EU policymaking — from the Digital Decade’s focus on <b>climate-neutral data centres and low-energy semiconductors<\/b> to the <b>Critical Raw Materials Act<\/b>.", "<b>Skills foresight<\/b> across key industrial ecosystems can assuage the technology/jobs puzzle, helping move towards ‘good jobs’ in ‘good (strategic) sectors’. Skills foresight and a focus on digital skills are part of the <b>2025 Union of Skills strategy<\/b>.", "A new (digital) industrial strategy for Europe also calls for a <b>new EU social contract<\/b>, including adequate workers’ protection in the digital world (the <b>Platform Work Directive<\/b>)."]}], "terms": [{"t": "Critical Raw Materials Act", "d": "Cited as evidence of twinning mainstreaming across EU policymaking."}, {"t": "Union of Skills strategy (2025)", "d": "The 2025 strategy of which skills foresight and digital skills are a part."}], "quiz": [{"type": "mcq", "q": "Twinning mainstreaming is illustrated by the Digital Decade's focus on climate-neutral data centres and…", "options": ["low-energy semiconductors", "high-frequency trading", "nuclear submarines", "carbon credits"], "answer": 0, "source": "from the Digital Decade’s focus on climate-neutral data centres and low-energy semiconductors, to the Critical Raw Materials Act.", "concept": "Module 4 takeaways"}, {"type": "mcq", "q": "Skills foresight and digital skills are framed as part of the 2025…", "options": ["Union of Skills strategy", "Competitiveness Compass", "Chips Act 2.0", "Digital Omnibus"], "answer": 0, "source": "Skills foresight and a focus on digital skills are part of the 2025 Union of Skills strategy.", "concept": "Module 4 takeaways"}]}, {"id": "sem-sisters", "module": "seminar", "title": "The DSA & DMA — the ‘Digital (not twin) Sisters’", "blocks": [{"k": "def", "t": "The <b>DSA and DMA<\/b> are recent Regulations. The <b>DSA<\/b> ensures a <b>safer digital space<\/b> where average users’ <b>fundamental rights<\/b> are protected (especially vis-à-vis <b>VLOPs<\/b> — very large online platforms). The <b>DMA<\/b> ensures a <b>level playing field for businesses<\/b> (e.g. SMEs, start-ups) and a fair choice for business users marketing products/services online, vis-à-vis <b>gatekeepers<\/b>."}, {"k": "principle", "t": "Digital technologies create new ways to exercise and infringe fundamental rights and freedoms (the ‘battle of models’) — e.g. trade of illegal content online, disinformation, and private rule-makers in digital markets. The DSA/DMA mark the start of a long, collaborative process to change the status quo."}], "terms": [{"t": "DSA (Digital Services Act)", "d": "Regulation (EU) 2022/2065 on online intermediary services: due-diligence obligations, systemic risks and platform accountability; protects users' fundamental rights, esp. vis-à-vis VLOPs."}, {"t": "DMA (Digital Markets Act)", "d": "Regulation imposing obligations on gatekeeper platforms to promote contestability and fairness; protects a level playing field for business users."}, {"t": "VLOPs", "d": "Very Large Online Platforms — the focus of the DSA's strongest obligations."}, {"t": "Gatekeepers", "d": "Large platforms subject to DMA obligations to ensure contestability and fairness."}], "quiz": [{"type": "mcq", "q": "The DSA primarily protects…", "options": ["users' fundamental rights and a safer digital space (esp. vs VLOPs)", "a level playing field for businesses vs gatekeepers", "chip supply chains", "AI model providers"], "answer": 0, "source": "safer digital space where average users’ fundamental rights are protected (DSA) especially vis-à-vis VLOPs.", "concept": "DSA/DMA"}, {"type": "mcq", "q": "The DMA primarily targets…", "options": ["gatekeepers, to ensure contestability and a level playing field", "VLOPs and illegal content", "submarine cables", "quantum encryption"], "answer": 0, "source": "a level playing field for businesses… vis-à-vis gatekeepers online (DMA).", "concept": "DSA/DMA"}]}, {"id": "sem-origins", "module": "seminar", "title": "Origins, Due Diligence & Gatekeeper Obligations", "blocks": [{"k": "def", "t": "Origins in <b>e-commerce law<\/b>: the <b>2000 E-commerce Directive<\/b> is the origin point for EU intermediary-liability and digital-services rules; the regulatory landscape also includes the <b>2018 Audiovisual Media Services Directive<\/b> update."}, {"k": "def", "t": "<b>DSA — asymmetric due diligence<\/b>: obligations scale with the size and systemic role of the service. The DSA imposes <b>due-diligence obligations<\/b>, addresses <b>systemic risks<\/b> and establishes <b>platform accountability<\/b>, with the heaviest duties on the largest platforms (VLOPs)."}, {"k": "def", "t": "<b>DMA — gatekeeper obligations<\/b>: the DMA imposes <i>ex ante<\/i> obligations on gatekeeper platforms to promote <b>contestability and fairness<\/b> (e.g. against self-preferencing and unfair conditions for business users)."}, {"k": "ex", "t": "Official citations from the reading list: <b>Digital Services Act, Regulation (EU) 2022/2065<\/b>; the DSA/DMA are presented in depth in the <b>Filomena Chirico seminar<\/b>."}], "terms": [{"t": "E-commerce Directive (2000)", "d": "The origin point for EU intermediary-liability and digital-services rules."}, {"t": "Asymmetric due diligence (DSA)", "d": "DSA obligations scale with the size and systemic role of the service; heaviest on VLOPs."}], "quiz": [{"type": "mcq", "q": "EU intermediary-liability and digital-services rules originate in which instrument?", "options": ["The 2000 E-commerce Directive", "The 2018 AVMSD", "GDPR", "The AI Act"], "answer": 0, "source": "2000: E-commerce Directive: origin point for EU intermediary-liability and digital-services rules.", "concept": "DSA origins"}, {"type": "mcq", "q": "The DSA's due-diligence model is described as…", "options": ["asymmetric (scaling with platform size/systemic role)", "identical for all firms", "voluntary", "limited to gatekeepers"], "answer": 0, "source": "DSA asymmetric due diligence… heaviest duties on the largest platforms (VLOPs).", "concept": "DSA"}, {"type": "blank", "q": "The Digital Services Act is Regulation (EU) 2022/______.", "accept": ["2065"], "answer": "2065", "source": "Digital Services Act, Regulation (EU) 2022/2065.", "concept": "DSA"}]}, {"id": "read-draghi", "module": "readings", "title": "The Draghi Report (2024)", "blocks": [{"k": "def", "t": "<b>Draghi Report<\/b>: Mario Draghi’s 2024 report ‘The Future of European Competitiveness’ — used in the course as the central diagnosis of EU industrial-policy needs. Compulsory: Part A + the digital and governance chapters in Part B (‘Digitalisation & Advanced Tech’ p 67; ‘Accelerating Innovation’ p 228; ‘Strengthening Governance’ p 307)."}, {"k": "quote", "t": "“Industrial strategies today – as seen in the US and China – combine multiple policies… In the EU context, linking policies in this way requires […] a new industrial strategy for Europe.” — Mario Draghi, September 2024."}], "terms": [{"t": "Draghi Report", "d": "Mario Draghi's 2024 report on the future of European competitiveness; the course's central diagnosis of EU industrial-policy needs."}], "quiz": [{"type": "mcq", "q": "The Draghi Report is titled…", "options": ["'The Future of European Competitiveness'", "'Digital Empires'", "'A Shield for Europe'", "'The North Star'"], "answer": 0, "source": "Mario Draghi, ‘The Future of European Competitiveness’, September 2024.", "concept": "Draghi Report"}]}, {"id": "read-renda", "module": "readings", "title": "Andrea Renda — North Star & the Technology/Jobs Puzzle", "blocks": [{"k": "def", "t": "Andrea Renda (2024), ‘What North Star for future EU industrial policy?’, frames the <b>industrial-policy trilemma/quadrilemma<\/b> (competitiveness, decarbonisation, economic security + fairness) and maps <b>agile regulatory tools<\/b> by policy-cycle phase."}, {"k": "def", "t": "Renda, Balland & Bosoer (2023), ‘The Technology/Jobs Puzzle: A European Perspective’, frames whether AI causes job loss or job expansion and argues for ‘good jobs in good sectors’ via skills foresight."}, {"k": "ex", "t": "Also by Renda: ‘IoT4SDGs’ (CEPS, with Moritz Laurer, 2020)."}], "terms": [{"t": "Andrea Renda", "d": "CEPS author of the 'North Star' industrial-policy paper, the Technology/Jobs Puzzle, the regulatory-tools policy-cycle map and IoT4SDGs."}], "quiz": [{"type": "mcq", "q": "Which Renda paper frames whether AI leads to job loss or job expansion?", "options": ["The Technology/Jobs Puzzle (2023)", "What North Star for future EU industrial policy? (2024)", "IoT4SDGs (2020)", "Digital Empires (2023)"], "answer": 0, "source": "The Technology/Jobs Puzzle: A European Perspective, Andrea Renda, Pierre Alexandre Balland and Lucia Bosoer, 2023.", "concept": "Renda"}]}, {"id": "read-shield", "module": "readings", "title": "A Shield for Europe — Reviving the European Defence Community", "blocks": [{"k": "def", "t": "‘<b>A Shield for Europe: Reviving the European Defence Community<\/b>’ (Federico Fabbrini, Survival, 2025, 67:1, 55-60). A defence-policy reading on European security, OSA and the potential revival of an EDC-like framework."}, {"k": "ex", "t": "Context: a major conventional inter-state war returned to Europe (Russia’s aggression against Ukraine); EU leaders called it a ‘<b>tectonic shift in European history<\/b>’ in the <b>Versailles Declaration of March 2022<\/b>; Trump’s re-election compounds the challenge. If the US withheld support, the EU would become, by default, the main instrument of European defence solidarity."}, {"k": "def", "t": "<b>European Defence Community (EDC)<\/b>: in 1951 six countries — Belgium, France, Italy, Luxembourg, the Netherlands and West Germany — founded the <b>ECSC<\/b> with the 1951 <b>Treaty of Paris<\/b>; in 1952 they established the EDC, explicitly focused on defending Western Europe (France also saw it as a way to deal with the remilitarisation of Germany)."}, {"k": "principle", "t": "Fabbrini argues that since the four states that ratified it never rescinded their ratification, if <b>France and Italy<\/b> approved the treaty today, the EDC would become operational; the EDC would be interconnected with NATO (allaying decoupling fears), open to any EU state (with a veto on uncooperative partners), and would build a bridge with the UK."}], "terms": [{"t": "European Defence Community (EDC)", "d": "A 1950s supranational defence framework (est. 1952), revisited by Fabbrini (2025) as a possible model for European defence solidarity."}, {"t": "Versailles Declaration (March 2022)", "d": "EU leaders called Russia's war a 'tectonic shift in European history'."}, {"t": "Treaty of Paris (1951)", "d": "Founded the European Coal and Steel Community (ECSC) by six countries."}], "quiz": [{"type": "mcq", "q": "Who wrote 'A Shield for Europe: Reviving the European Defence Community' (2025)?", "options": ["Federico Fabbrini", "Andrea Renda", "Anu Bradford", "Dimitri Lorenzani"], "answer": 0, "source": "Federico Fabbrini (2025) A Shield for Europe: Reviving the European Defence Community, Survival.", "concept": "EDC"}, {"type": "mcq", "q": "The 2022 Versailles Declaration described Russia's war as a…", "options": ["'tectonic shift in European history'", "'point of inflection'", "'North Star'", "'battle of models'"], "answer": 0, "source": "the war, they stated, ‘constitutes a tectonic shift in European history’.", "concept": "EDC"}, {"type": "blank", "q": "The EDC was established in the year ______, after the ECSC's 1951 Treaty of Paris.", "accept": ["1952"], "answer": "1952", "source": "in 1952 they established the EDC, a new organisation explicitly focused on defending Western Europe.", "concept": "EDC"}, {"type": "mcq", "q": "Per Fabbrini, the EDC could become operational today if which two states approved the treaty?", "options": ["France and Italy", "Germany and Poland", "Spain and Portugal", "Belgium and the Netherlands"], "answer": 0, "source": "if France and Italy approved the treaty today, the EDC would become operational.", "concept": "EDC"}]}, {"id": "read-orals", "module": "readings", "title": "Oral Presentation Themes (the Five Debates)", "blocks": [{"k": "list", "lead": "The course treats five policy debates as central:", "items": ["<b>Group 1<\/b>: the links (synergies and trade-offs) between European <b>industrial policy and competition policy<\/b> — with a focus on the digital field; present at least 2 recent examples of EU digital legislation where this tension is most relevant.", "<b>Group 2<\/b>: the pros and cons of <b>tech export controls and preference clauses<\/b> in trade/public procurement — are they necessary for economic security or the end of Europe’s openness?", "<b>Group 3<\/b>: the pros and cons of Europe’s <b>(over)regulating the digital world<\/b> — the balance between the <b>principle of precaution and innovation<\/b>; present 2 recent examples and compare with the AI Act.", "<b>Group 4<\/b>: the pros and cons of alternative strategies to make the <b>digital transition greener<\/b> (innovation-led vs de-growth strategies towards decarbonisation; best achieving the twinning).", "<b>Group 5<\/b>: the new ‘<b>socio-economic models<\/b>’ imposed by digitalisation (labour market, skills, inequalities) — ‘How can digitalisation be part of the solution rather than of the problem?’"]}], "terms": [], "quiz": [{"type": "mcq", "q": "Which oral-presentation debate asks whether export controls are 'necessary for economic security or the end of Europe’s openness'?", "options": ["Group 2", "Group 1", "Group 3", "Group 5"], "answer": 0, "source": "Group 2: pros and cons of tech export controls and preference clauses… are they necessary for economic security or the end of Europe’s openness?", "concept": "Oral themes"}, {"type": "mcq", "q": "Which debate centres on the balance between the precautionary principle and innovation, compared with the AI Act?", "options": ["Group 3", "Group 1", "Group 4", "Group 5"], "answer": 0, "source": "Group 3: pros and cons of Europe’s (over)regulating the digital world… balance between principle of precaution and innovation… compare them with the AI Act.", "concept": "Oral themes"}]}, {"id": "syn-themes", "module": "synthesis", "title": "Thematic Synthesis — Five Cross-Cutting Themes", "blocks": [{"k": "def", "t": "<b>1. The consistent trio<\/b>: digital policy must be embedded in a broader industrial and foresight strategy. Foresight identifies long-term risks and scenarios; industrial strategy selects capacity-building priorities; digital policy supplies the regulatory and technological instruments."}, {"k": "def", "t": "<b>2. Open strategic autonomy & economic security<\/b>: building capacity and reducing excessive dependencies without simply closing the EU economy; reframing supply chains, critical technologies, cybersecurity and infrastructure as risk-management fields."}, {"k": "def", "t": "<b>3. The EU as digital normative superpower<\/b>: projecting power through law by setting binding standards (AI, platforms, services, gatekeepers); linked to the Brussels effect and global regulatory competition."}, {"k": "def", "t": "<b>4. Dynamic policy coherence & the twin/fair transition<\/b>: digitalisation creates both opportunities and trade-offs for decarbonisation and social fairness; coherence manages these interdependencies over time."}, {"k": "def", "t": "<b>5. Competitiveness, productivity & the innovation lifecycle<\/b>: competitiveness is connected to digital innovation, scale-up capacity, R&I, skills and industrial ecosystems; the EU must escape a middle-technology trap."}], "terms": [], "quiz": [{"type": "mcq", "q": "Which theme links the EU's power to the Brussels effect and global regulatory competition?", "options": ["The EU as digital normative superpower", "The consistent trio", "Dynamic policy coherence", "The innovation lifecycle"], "answer": 0, "source": "The EU as digital normative superpower: projecting power through law… linked to the Brussels effect and to global regulatory competition.", "concept": "Synthesis"}]}, {"id": "syn-timeline", "module": "synthesis", "title": "Course Timeline (Memorise the Dates)", "blocks": [{"k": "list", "lead": "Key dates:", "items": ["<b>1950s<\/b>: European Defence Community project (supranational defence reference).", "<b>2000<\/b>: E-commerce Directive — origin of EU intermediary-liability and digital-services rules.", "<b>2018<\/b>: Audiovisual Media Services Directive update.", "<b>2020<\/b>: Strategic Foresight Report cycle and the digital-strategy policy turn begin to feature centrally.", "<b>2022<\/b>: Versailles Declaration & Russia’s war against Ukraine reinforce the strategic-autonomy agenda; 2022 SFR focuses on green-digital twinning.", "<b>2023<\/b>: Economic Security Strategy; 2023 SFR; Spain’s Presidency foregrounds OSA; EU Chips Act enters into force (Sep).", "<b>2024<\/b>: Draghi Report and the European competitiveness agenda; Platform Work Directive adopted (Oct); AI Act = Regulation (EU) 2024/1689.", "<b>2025<\/b>: Competitiveness Compass and SFR 2025; Fabbrini article on reviving the EDC; Economic Security Doctrine (Dec).", "<b>2026<\/b>: Course and exam year; final exam is a closed-book 2-hour written exam."]}], "terms": [], "quiz": [{"type": "mcq", "q": "In which year did the EU Chips Act Regulation enter into force?", "options": ["2023", "2020", "2025", "2018"], "answer": 0, "source": "2023: …EU Chips Act enters into force (Sep).", "concept": "Timeline"}, {"type": "mcq", "q": "The 2000 milestone in the timeline is the…", "options": ["E-commerce Directive", "AI Act", "Versailles Declaration", "Competitiveness Compass"], "answer": 0, "source": "2000: E-commerce Directive: origin point for EU intermediary-liability and digital-services rules.", "concept": "Timeline"}]}, {"id": "syn-exam", "module": "synthesis", "title": "Exam Preparation — Topics, Pitfalls & Model Plans", "blocks": [{"k": "list", "lead": "Likely essay topics:", "items": ["The consistent trio as the EU’s new policy paradigm.", "Open strategic autonomy in digital technologies.", "EU digital regulation as normative power: AI Act, DSA and DMA.", "The EU competitiveness problem and the role of digital industrial policy.", "Digitalisation, decarbonisation and fairness: solving the industrial-policy trilemma."]}, {"k": "list", "lead": "Possible short questions:", "items": ["Define strategic foresight; define open strategic autonomy; define the Brussels effect.", "What is the difference between the DSA and DMA? What are gatekeepers (DMA) and systemic risks (DSA)?", "What is the EU Chips Act designed to address? What is dynamic policy coherence?", "How does the AI Act structure regulation by risk? What is the technology/jobs puzzle?"]}, {"k": "warn", "t": "Common mistakes to avoid: treating digital policy as only market regulation (ignoring industrial capacity); using OSA as a synonym for protectionism; describing the AI Act/DSA/DMA without explaining their different regulatory logics; listing instruments without linking them to competitiveness/autonomy/coherence; ignoring trade-offs (innovation vs regulation; openness vs security; digitalisation vs jobs; green transition vs industrial cost)."}, {"k": "principle", "t": "High-value arguments: foresight is the analytical lens, industrial strategy the capacity-building agenda, digital policy both object and instrument; the EU’s regulatory strength must be connected to innovation and scale-up; OSA is about managing dependencies, not withdrawing; green and digital transitions are not automatically coherent — policy must create synergies; structure answers as concept → policy example → trade-off → conclusion."}], "terms": [], "quiz": [{"type": "mcq", "q": "A recommended structure for exam answers is…", "options": ["concept → policy example → trade-off → conclusion", "opinion → anecdote → opinion", "definition only", "list of dates"], "answer": 0, "source": "Exam answers should move from concept to policy example to trade-off to conclusion.", "concept": "Exam technique"}, {"type": "mcq", "q": "Which is a 'common mistake to avoid'?", "options": ["Using open strategic autonomy as a synonym for protectionism", "Linking instruments to competitiveness", "Discussing trade-offs", "Using course terminology"], "answer": 0, "source": "Common mistakes: Using open strategic autonomy as a synonym for protectionism.", "concept": "Exam technique"}]}], "glossary": [{"term": "11 sensitive industrial ecosystems", "def": "The ecosystems across which the EU mapped excessive dependencies (over-reliance on limited actors for goods, services, data, infrastructures, skills, technologies).", "sec": "m1-linking", "secTitle": "Linking Foresight & the New EU Industrial Strategy"}, {"term": "4 high-risk areas", "def": "Advanced chips, AI, quantum and biotech — flagged for immediate joint risk assessment.", "sec": "m2-econsec", "secTitle": "Economic Security Strategy — the 3 P’s"}, {"term": "4 scenarios for 2050", "def": "JRC scenarios of a sustainable Europe in 2050 along two axes: societal behaviour (individualistic vs collaborative) and policy mix (less vs more supportive of sustainability).", "sec": "m4-twinning2050", "secTitle": "Twinning by 2050 — a Scenario-Based Approach"}, {"term": "5G/6G", "def": "Fifth-/sixth-generation wireless tech; higher frequencies than 4G; more bandwidth, lower (microsecond) latency; standardised by the ITU.", "sec": "intro-glossary1", "secTitle": "Digital Glossary (I): AI, Connectivity & Computing"}, {"term": "AI Act", "def": "World's first horizontal AI regulation, Regulation (EU) 2024/1689; rights-based, risk-based, with agile tools (sandboxes, codes, guidance).", "sec": "m3-aiact1", "secTitle": "The AI Act — Normative Superpower in Digital?"}, {"term": "AI Act fines", "def": "Up to EUR 35 million or 7% of total worldwide annual turnover (whichever higher) for the gravest infringements.", "sec": "m3-aiact3", "secTitle": "The AI Act — GPAI, Sandboxing & Governance"}, {"term": "AI Act risk tiers", "def": "Unacceptable (8 banned), high-risk (conformity assessment), low-risk (transparency), minimal (minimal obligations).", "sec": "m3-aiact2", "secTitle": "The AI Act — Risk-Based Architecture"}, {"term": "AI Continent Strategy", "def": "The umbrella linking AI Gigafactories, EU cloud/edge steps and related initiatives as part of the new digital industrial policy.", "sec": "m2-takeaways", "secTitle": "Module 2 — Key Takeaways"}, {"term": "AI Factories / AI Gigafactories", "def": "AI factories (19 across 16 MS) open HPCs to startups to train trustworthy AI; the first 4–5 AI Gigafactories are planned for Europe.", "sec": "m2-hpc", "secTitle": "AI Vertical Use Cases — Computing Power (HPC)"}, {"term": "AI model", "def": "A program trained on data to recognise patterns or make decisions; an AI language model generates text from preceding words.", "sec": null, "secTitle": null}, {"term": "AI Office", "def": "Coordinates EU AI policies and implements the AI Act.", "sec": "m2-hpc", "secTitle": "AI Vertical Use Cases — Computing Power (HPC)"}, {"term": "AI Pact", "def": "Voluntary industry pledges to anticipate AI Act provisions (100+ in Sep 2024, 230+ in Jan 2026).", "sec": "m3-aiact1", "secTitle": "The AI Act — Normative Superpower in Digital?"}, {"term": "Andrea Renda", "def": "CEPS author of the 'North Star' industrial-policy paper, the Technology/Jobs Puzzle, the regulatory-tools policy-cycle map and IoT4SDGs.", "sec": "read-renda", "secTitle": "Andrea Renda — North Star & the Technology/Jobs Puzzle"}, {"term": "Artificial intelligence (AI)", "def": "The ability of a computer/robot to perform tasks of intelligent beings; combines computer science and data analytics; encompasses machine learning and deep learning.", "sec": "intro-glossary1", "secTitle": "Digital Glossary (I): AI, Connectivity & Computing"}, {"term": "Asymmetric due diligence (DSA)", "def": "DSA obligations scale with the size and systemic role of the service; heaviest on VLOPs.", "sec": "sem-origins", "secTitle": "Origins, Due Diligence & Gatekeeper Obligations"}, {"term": "Backcasting", "def": "An agenda-setting foresight tool working backwards from a desired future via transition pathways.", "sec": "m3-tools", "secTitle": "Linking Foresight & Regulation — Agile Regulatory Tools"}, {"term": "Battle of narratives, offers and models", "def": "The global contest (2023 SFR) in which EU tech sovereignty competes with third-country propaganda and alternative offers (e.g. Belt and Road).", "sec": "m2-chipswar", "secTitle": "Security Dimension — the ‘Chips War’"}, {"term": "Bespoke State aid (chips)", "def": "A case-by-case Chips Act approach allowing aid up to 100% of a proven funding gap for FOAK facilities that would otherwise not exist in Europe.", "sec": "m2-stateaid", "secTitle": "Bespoke State Aid & the ‘Chips Subsidies Race’"}, {"term": "Brussels effect", "def": "The EU shapes global markets through regulation because firms adapt to EU rules and diffuse them beyond Europe.", "sec": "m3-intro", "secTitle": "Module 3 — The EU as a Digital Normative Superpower?"}, {"term": "China Standards 2035", "def": "China's assertive standard-setting strategy cited as a rival in the global 'battle of models'.", "sec": "m3-intro", "secTitle": "Module 3 — The EU as a Digital Normative Superpower?"}, {"term": "Cloud", "def": "Networked computing facilities providing remote data storage and processing services via the internet.", "sec": null, "secTitle": null}, {"term": "Collective intelligence", "def": "Structured pooling of diverse expertise used in foresight to prepare for future developments/crises.", "sec": "m1-lens", "secTitle": "Foresight as a ‘Strategic Lens’"}, {"term": "Competitiveness Compass", "def": "A 2025 Commission framework, presented as a 'North Star', orienting Europe towards productivity, innovation, decarbonisation and security.", "sec": "m1-compass", "secTitle": "The Competitiveness Compass — Europe’s ‘North Star’"}, {"term": "Competitiveness Coordination Tool (CCT)", "def": "A coordination instrument presented as part of the Competitiveness Compass machinery.", "sec": "m1-compass", "secTitle": "The Competitiveness Compass — Europe’s ‘North Star’"}, {"term": "Conformity assessment", "def": "The strong compliance requirement imposed on high-risk AI systems.", "sec": "m3-aiact2", "secTitle": "The AI Act — Risk-Based Architecture"}, {"term": "Consistent trio", "def": "Foresight + industrial strategy + digital policy as a new, crucial trio in EU policymaking.", "sec": "intro-overview", "secTitle": "Course Overview & the Central Argument"}, {"term": "Critical Raw Materials Act", "def": "Cited as evidence of twinning mainstreaming across EU policymaking.", "sec": "m4-takeaways", "secTitle": "Module 4 — Key Takeaways"}, {"term": "Cyber Resilience Act (CRA)", "def": "Mandatory lifecycle cybersecurity requirements for manufacturers; CE marking; EU market access from 2027; fines up to €15mn or 2.5% turnover.", "sec": "m2-cyber", "secTitle": "The EU Cybersecurity Acquis"}, {"term": "Data Centres", "def": "Centralized facilities concentrating IT operations for storing, processing and disseminating data; can be on-premise, cloud or edge.", "sec": "intro-glossary2", "secTitle": "Digital Glossary (II): Exascale, Twins, Data Centres & AI Models"}, {"term": "DESI", "def": "Digital Economy and Society Index — the basis for Digital Decade annual monitoring reports.", "sec": "m2-infra", "secTitle": "State-of-the-Art Enablers — Digital Infrastructure"}, {"term": "Digital Decade Policy Programme (DDPP)", "def": "Governance framework with 2030 targets and DESI-based monitoring; MS produce 2-yearly Digital Decade Roadmaps.", "sec": "m2-infra", "secTitle": "State-of-the-Art Enablers — Digital Infrastructure"}, {"term": "Digital Decade skills targets", "def": "80% of people with basic digital skills and 20 million ICT specialists by 2030; the EU currently lags both.", "sec": "m4-skills", "secTitle": "Digital Skills — the Digital Decade Targets"}, {"term": "Digital Empires", "def": "Anu Bradford's framing of three rival digital-governance models (US market-driven, China state-driven, EU rights-driven).", "sec": "m3-empires", "secTitle": "Digital Empires & the Battles for Influence"}, {"term": "Digital Omnibus (2025)", "def": "Under negotiation; extends AI Act compliance deadlines (02/12/27 for listed high-risk; 02/12/28 for AI in regulated products).", "sec": "m3-aiact3", "secTitle": "The AI Act — GPAI, Sandboxing & Governance"}, {"term": "Digital Single Market", "def": "The EU project of integrating digital markets, reducing fragmentation and creating common rules for online services and digital business.", "sec": "m3-takeaways", "secTitle": "Module 3 — Key Takeaways"}, {"term": "Digital twins", "def": "A digital counterpart of a real-world physical product/system/process used for simulation, testing, monitoring, maintenance.", "sec": "intro-glossary2", "secTitle": "Digital Glossary (II): Exascale, Twins, Data Centres & AI Models"}, {"term": "DMA (Digital Markets Act)", "def": "Regulation imposing obligations on gatekeeper platforms to promote contestability and fairness; protects a level playing field for business users.", "sec": "sem-sisters", "secTitle": "The DSA & DMA — the ‘Digital (not twin) Sisters’"}, {"term": "Draghi Report", "def": "Mario Draghi's 2024 report on the future of European competitiveness; the course's central diagnosis of EU industrial-policy needs.", "sec": "read-draghi", "secTitle": "The Draghi Report (2024)"}, {"term": "DSA (Digital Services Act)", "def": "Regulation (EU) 2022/2065 on online intermediary services: due-diligence obligations, systemic risks and platform accountability; protects users' fundamental rights, esp. vis-à-vis VLOPs.", "sec": "sem-sisters", "secTitle": "The DSA & DMA — the ‘Digital (not twin) Sisters’"}, {"term": "Dynamic policy coherence", "def": "The capacity to exploit synergies and manage trade-offs between policies over time, especially between digital, green, fair and security objectives.", "sec": "intro-overview", "secTitle": "Course Overview & the Central Argument"}, {"term": "E-commerce Directive (2000)", "def": "The origin point for EU intermediary-liability and digital-services rules.", "sec": "sem-origins", "secTitle": "Origins, Due Diligence & Gatekeeper Obligations"}, {"term": "Economic Security Doctrine (Dec 2025)", "def": "Operationalises economic security via FDI screening, export-control coordination, outbound-investment screening and dual-use R&D; 6 high-risk areas tied to risk thresholds.", "sec": "m2-doctrine", "secTitle": "The Economic Security Doctrine (Dec 2025)"}, {"term": "Economic Security Strategy (3 P's)", "def": "2023 risk-management approach: Promoting competitiveness, Protecting economic security, Partnering with like-minded countries (…and Preparing?).", "sec": "m2-econsec", "secTitle": "Economic Security Strategy — the 3 P’s"}, {"term": "Edge cloud (fog)", "def": "Cloud computing at the network edge; reduces latency, raises availability, reduces unauthorized-access risk.", "sec": "intro-glossary2", "secTitle": "Digital Glossary (II): Exascale, Twins, Data Centres & AI Models"}, {"term": "Edge computing", "def": "Distributed architecture bringing computation/storage closer to data sources to improve response times and save bandwidth.", "sec": "intro-glossary1", "secTitle": "Digital Glossary (I): AI, Connectivity & Computing"}, {"term": "EDICs", "def": "EU Digital Infrastructure Consortia — vehicles for multi-country projects combining EU, MS and private investment (3 set up in 2024).", "sec": "m2-infra", "secTitle": "State-of-the-Art Enablers — Digital Infrastructure"}, {"term": "ENISA", "def": "The EU Agency for Cybersecurity, given a permanent mandate by the Cybersecurity Act.", "sec": "m2-cyber", "secTitle": "The EU Cybersecurity Acquis"}, {"term": "ESPAS", "def": "European Strategy and Policy Analysis System — the inter-institutional foresight network in which 9 EU institutions participate.", "sec": "m1-orga", "secTitle": "Organisation of Foresight within the EU"}, {"term": "EU Chips Act", "def": "EU Regulation (in force Sept 2023) to raise the EU chip production share to 20% by 2030; 3 pillars: Chips for Europe; security of supply; monitoring/crisis response.", "sec": "m2-chipsact", "secTitle": "The EU Chips Act — Three Pillars"}, {"term": "EU Cybersecurity Act", "def": "Voluntary EU cybersecurity certification scheme; security-by-design; permanent ENISA mandate; ECCC in Bucharest.", "sec": "m2-cyber", "secTitle": "The EU Cybersecurity Acquis"}, {"term": "EU-US TTC", "def": "Trade and Technology Council moving towards a 'transatlantic marketplace'; ~half its working groups are digital/tech.", "sec": "m3-ttc", "secTitle": "EU-US Techno-Democratic Regulatory Alliance? (TTC)"}, {"term": "EuroHPC Joint Undertaking", "def": "The EU body for high-performance computing; 4 EU supercomputers are in the global top 10; amended to create AI factories.", "sec": "m2-hpc", "secTitle": "AI Vertical Use Cases — Computing Power (HPC)"}, {"term": "European Defence Community (EDC)", "def": "A 1950s supranational defence framework (est. 1952), revisited by Fabbrini (2025) as a possible model for European defence solidarity.", "sec": "read-shield", "secTitle": "A Shield for Europe — Reviving the European Defence Community"}, {"term": "European Innovation Council (EIC)", "def": "Part of Horizon Europe Pillar 3 (Innovative Europe), ~€10.1bn, supporting breakthrough/scale-up innovation.", "sec": "m2-rilifecycle", "secTitle": "The Research & Innovation Lifecycle: Capital, Knowledge, Scale"}, {"term": "European Innovation Scoreboard", "def": "Annual EU benchmark of innovation performance (2024 edition cited).", "sec": "m2-mtt", "secTitle": "The EU’s ‘Middle Technology Trap’"}, {"term": "European Semiconductor Board (ESB)", "def": "Supports the Commission in strategic mapping/monitoring of chips and is consulted before priority-rated orders.", "sec": "m2-chipsact", "secTitle": "The EU Chips Act — Three Pillars"}, {"term": "Exascale", "def": "Supercomputer performance of at least 10^18 double-precision operations per second (exaFLOPS).", "sec": "intro-glossary2", "secTitle": "Digital Glossary (II): Exascale, Twins, Data Centres & AI Models"}, {"term": "Exscalate", "def": "EU-funded project that used HPC to screen molecules — a key AI/HPC use case for COVID-19 vaccines.", "sec": "m4-health", "secTitle": "Example — AI in Healthcare"}, {"term": "Final exam (55%)", "def": "A 2-hour closed-book written exam: 1–2 essays (1000 words max, 50%) plus a few short questions (50%).", "sec": "intro-marking", "secTitle": "Marking & Assessment of the Course"}, {"term": "FOAK", "def": "First-of-
